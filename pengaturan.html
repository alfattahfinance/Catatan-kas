<!-- ================================= -->
<!-- PENGATURAN APLIKASI -->
<!-- ================================= -->

<script>

const pengaturanDefault = {

    namaPondok:
        "Ribath Madrasah Al-Fattah",

    subJudul:
        "Dashboard Keuangan Pondok",

    mataUang:
        "Rupiah",

    tema:
        "light"

};


function ambilPengaturan() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "pengaturanAplikasi"
            )
        ) || {
            ...pengaturanDefault
        };

    } catch (error) {

        console.error(
            "Pengaturan rusak:",
            error
        );

        return {
            ...pengaturanDefault
        };

    }

}


function muatPengaturan() {

    const data =
        ambilPengaturan();


    document.getElementById(
        "namaPondok"
    ).value =
        data.namaPondok ||
        pengaturanDefault.namaPondok;


    document.getElementById(
        "subJudul"
    ).value =
        data.subJudul ||
        pengaturanDefault.subJudul;


    document.getElementById(
        "mataUang"
    ).value =
        data.mataUang ||
        pengaturanDefault.mataUang;


    document.getElementById(
        "tema"
    ).value =
        data.tema ||
        pengaturanDefault.tema;


    terapkanTema(
        data.tema ||
        "light"
    );

}


function simpanPengaturan() {

    const data = {

        namaPondok:
            document.getElementById(
                "namaPondok"
            ).value.trim(),

        subJudul:
            document.getElementById(
                "subJudul"
            ).value.trim(),

        mataUang:
            document.getElementById(
                "mataUang"
            ).value,

        tema:
            document.getElementById(
                "tema"
            ).value

    };


    if (!data.namaPondok) {

        alert(
            "Nama pondok belum diisi."
        );

        return;

    }


    localStorage.setItem(

        "pengaturanAplikasi",

        JSON.stringify(data)

    );


    terapkanTema(
        data.tema
    );


    alert(
        "✅ Pengaturan berhasil disimpan!"
    );

}


function terapkanTema(tema) {

    let gunakanGelap = false;


    if (tema === "dark") {

        gunakanGelap = true;

    }

    else if (tema === "system") {

        gunakanGelap =
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

    }


    document.body.classList.toggle(
        "dark-mode",
        gunakanGelap
    );

}


function resetPengaturan() {

    const yakin =
        confirm(
            "Apakah kamu yakin ingin mengembalikan pengaturan awal?"
        );


    if (!yakin) {

        return;

    }


    localStorage.setItem(

        "pengaturanAplikasi",

        JSON.stringify(
            pengaturanDefault
        )

    );


    muatPengaturan();


    alert(
        "✅ Pengaturan dikembalikan ke awal."
    );

}


document
    .getElementById(
        "simpanPengaturanButton"
    )
    .addEventListener(
        "click",
        simpanPengaturan
    );


document
    .getElementById(
        "resetPengaturanButton"
    )
    .addEventListener(
        "click",
        resetPengaturan
    );


document
    .getElementById("tema")
    .addEventListener(
        "change",
        function () {

            terapkanTema(
                this.value
            );

        }
    );

</script>

<!-- LOGO DASHBOARD -->
<!-- ================================= -->

<script>

const LOGO_DEFAULT =
    "assets/logo-catatan-kas.jpg";


function muatLogoDashboard() {

    const saved =
        localStorage.getItem(
            "logoDashboard"
        );


    const preview =
        document.getElementById(
            "previewLogoDashboard"
        );


    const headerLogo =
        document.getElementById(
            "logoPreviewV2"
        );


    const logo =
        saved ||
        LOGO_DEFAULT;


    if (preview) {

        preview.src =
            logo;

    }


    if (headerLogo) {

        headerLogo.src =
            logo;

    }

}


function simpanLogoDashboard(file) {

    if (!file) {

        return;

    }


    if (!file.type.startsWith("image/")) {

        alert(
            "Silakan pilih file gambar."
        );

        return;

    }


    /*
     * Ukuran file dibatasi agar
     * localStorage tidak cepat penuh.
     */

    if (file.size > 3 * 1024 * 1024) {

        alert(
            "Ukuran logo maksimal 3 MB."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload = function (event) {

        const dataURL =
            event.target.result;


        localStorage.setItem(
            "logoDashboard",
            dataURL
        );


        muatLogoDashboard();


        alert(
            "✅ Logo Dashboard berhasil diganti."
        );

    };


    reader.onerror = function () {

        alert(
            "Gagal membaca file logo."
        );

    };


    reader.readAsDataURL(file);

}


function resetLogoDashboard() {

    const yakin =
        confirm(
            "Gunakan kembali logo bawaan Catatan Kas?"
        );


    if (!yakin) {

        return;

    }


    localStorage.removeItem(
        "logoDashboard"
    );


    muatLogoDashboard();


    alert(
        "✅ Logo Dashboard dikembalikan."
    );

}


document
    .getElementById(
        "logoDashboardInput"
    )
    .addEventListener(
        "change",
        function () {

            const file =
                this.files?.[0];

            simpanLogoDashboard(
                file
            );

        }
    );


document
    .getElementById(
        "resetLogoButton"
    )
    .addEventListener(
        "click",
        resetLogoDashboard
    );

</script>


<!-- ================================= -->
<!-- FIREBASE LOGIN / LOGOUT -->
<!-- ================================= -->

<script type="module">

import {
    auth
} from "./js/firebase-config.js";


import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const emailAkun =
    document.getElementById(
        "emailAkun"
    );


const tombolLoginLogout =
    document.getElementById(
        "tombolLoginLogout"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


onAuthStateChanged(
    auth,
    function (user) {

        if (user) {

            if (emailAkun) {

                emailAkun.textContent =
                    user.email ||
                    "Akun Firebase";

            }


            if (tombolLoginLogout) {

                tombolLoginLogout.innerHTML =
                    '<i class="bi bi-box-arrow-right"></i> Keluar';

                tombolLoginLogout.className =
                    "btn btn-outline-danger";

                tombolLoginLogout.onclick =
                    logout;

            }

        }

        else {

            if (emailAkun) {

                emailAkun.textContent =
                    "Belum login";

            }


            if (tombolLoginLogout) {

                tombolLoginLogout.innerHTML =
                    '<i class="bi bi-box-arrow-in-right"></i> Login';

                tombolLoginLogout.className =
                    "btn btn-success";

                tombolLoginLogout.onclick =
                    function () {

                        window.location.replace(
                            "Login.html"
                        );

                    };

            }

        }

    }
);


async function logout() {

    const yakin =
        confirm(
            "Apakah kamu yakin ingin keluar?"
        );


    if (!yakin) {

        return;

    }


    try {

        await signOut(auth);


        window.location.replace(
            "Login.html"
        );


    }

    catch (error) {

        console.error(
            "Logout gagal:",
            error
        );


        alert(
            "Logout gagal. Silakan coba lagi."
        );

    }

}


if (logoutButton) {

    logoutButton.addEventListener(
        "click",
        logout
    );

}

</script>

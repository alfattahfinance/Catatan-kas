<!-- ================================= -->
<!-- PENGATURAN LOCAL STORAGE -->
<!-- ================================= -->

<script>

const pengaturanDefault = {

    namaPondok:
        "Ribath Madrasah Al-Fattah",

    subJudul:
        "Dashboard Keuangan Pondok",

    mataUang:
        "Rupiah",

    tema:
        "light"

};


// ======================================
// MUAT PENGATURAN
// ======================================

function muatPengaturan() {

    let data;

    try {

        data =
            JSON.parse(
                localStorage.getItem(
                    "pengaturanAplikasi"
                )
            );

    } catch (error) {

        data = null;

    }


    if (!data) {

        data = {
            ...pengaturanDefault
        };

    }


    document.getElementById(
        "namaPondok"
    ).value =
        data.namaPondok ||
        pengaturanDefault.namaPondok;


    document.getElementById(
        "subJudul"
    ).value =
        data.subJudul ||
        pengaturanDefault.subJudul;


    document.getElementById(
        "mataUang"
    ).value =
        data.mataUang ||
        pengaturanDefault.mataUang;


    document.getElementById(
        "tema"
    ).value =
        data.tema ||
        pengaturanDefault.tema;

}


// ======================================
// SIMPAN PENGATURAN
// ======================================

function simpanPengaturan() {

    const namaPondok =
        document
            .getElementById("namaPondok")
            .value
            .trim();


    const subJudul =
        document
            .getElementById("subJudul")
            .value
            .trim();


    const mataUang =
        document
            .getElementById("mataUang")
            .value;


    const tema =
        document
            .getElementById("tema")
            .value;


    if (!namaPondok) {

        alert(
            "Nama pondok belum diisi."
        );

        return;

    }


    const data = {

        namaPondok:
            namaPondok,

        subJudul:
            subJudul ||
            "Dashboard Keuangan Pondok",

        mataUang:
            mataUang,

        tema:
            tema

    };


    localStorage.setItem(
        "pengaturanAplikasi",
        JSON.stringify(data)
    );


    terapkanTema(tema);


    alert(
        "✅ Pengaturan berhasil disimpan!"
    );

}


// ======================================
// TERAPKAN TEMA
// ======================================

function terapkanTema(tema) {

    let gunakanGelap = false;


    if (tema === "dark") {

        gunakanGelap = true;

    }

    else if (tema === "system") {

        gunakanGelap =
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

    }


    document.body.classList.toggle(
        "dark-mode",
        gunakanGelap
    );

}


// ======================================
// RESET PENGATURAN
// ======================================

function resetPengaturan() {

    const yakin =
        confirm(
            "Apakah kamu yakin ingin mengembalikan semua pengaturan ke awal?"
        );


    if (!yakin) {

        return;

    }


    localStorage.removeItem(
        "pengaturanAplikasi"
    );


    muatPengaturan();


    terapkanTema(
        "light"
    );


    alert(
        "✅ Pengaturan dikembalikan ke awal."
    );

}


// ======================================
// TEMA BERUBAH LANGSUNG
// ======================================

document
    .getElementById("tema")
    .addEventListener(
        "change",
        function () {

            terapkanTema(
                this.value
            );

        }
    );


// ======================================
// TOMBOL
// ======================================

document
    .getElementById(
        "simpanPengaturanButton"
    )
    .addEventListener(
        "click",
        simpanPengaturan
    );


document
    .getElementById(
        "resetPengaturanButton"
    )
    .addEventListener(
        "click",
        resetPengaturan
    );


// ======================================
// LOAD AWAL
// ======================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        muatPengaturan();


        let data;

        try {

            data =
                JSON.parse(
                    localStorage.getItem(
                        "pengaturanAplikasi"
                    )
                );

        } catch (error) {

            data = null;

        }


        terapkanTema(
            data?.tema ||
            pengaturanDefault.tema
        );

    }
);

</script>


<!-- ================================= -->
<!-- LOGO DASHBOARD -->
<!-- ================================= -->

<script>

const DEFAULT_LOGO =
    "assets/logo-catatan-kas.png";


function muatLogoDashboard() {

    const saved =
        localStorage.getItem(
            "logoDashboard"
        );


    const preview =
        document.getElementById(
            "previewLogoDashboard"
        );


    const headerPreview =
        document.getElementById(
            "logoPreviewV2"
        );


    const logo =
        saved ||
        DEFAULT_LOGO;


    if (preview) {

        preview.src = logo;

    }


    if (headerPreview) {

        headerPreview.src = logo;

    }

}


// ======================================
// PILIH LOGO
// ======================================

document
    .getElementById(
        "logoDashboardInput"
    )
    .addEventListener(
        "change",
        function () {

            const file =
                this.files &&
                this.files[0];


            if (!file) {

                return;

            }


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                alert(
                    "Silakan pilih file gambar."
                );

                this.value = "";

                return;

            }


            // Batas 2 MB
            if (
                file.size >
                2 * 1024 * 1024
            ) {

                alert(
                    "Ukuran logo maksimal 2 MB."
                );

                this.value = "";

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function (event) {

                    const logo =
                        event.target.result;


                    try {

                        localStorage.setItem(
                            "logoDashboard",
                            logo
                        );

                    } catch (error) {

                        console.error(
                            error
                        );

                        alert(
                            "Logo terlalu besar untuk disimpan."
                        );

                        return;

                    }


                    const preview =
                        document.getElementById(
                            "previewLogoDashboard"
                        );


                    const headerPreview =
                        document.getElementById(
                            "logoPreviewV2"
                        );


                    if (preview) {

                        preview.src =
                            logo;

                    }


                    if (headerPreview) {

                        headerPreview.src =
                            logo;

                    }


                    alert(
                        "✅ Logo Dashboard berhasil diganti."
                    );

                };


            reader.readAsDataURL(file);

        }
    );


// ======================================
// RESET LOGO
// ======================================

function resetLogoDashboard() {

    const yakin =
        confirm(
            "Gunakan kembali logo bawaan Catatan Kas?"
        );


    if (!yakin) {

        return;

    }


    localStorage.removeItem(
        "logoDashboard"
    );


    document.getElementById(
        "previewLogoDashboard"
    ).src =
        DEFAULT_LOGO;


    document.getElementById(
        "logoPreviewV2"
    ).src =
        DEFAULT_LOGO;


    document.getElementById(
        "logoDashboardInput"
    ).value = "";


    alert(
        "✅ Logo Dashboard dikembalikan ke logo bawaan."
    );

}


document
    .getElementById(
        "resetLogoButton"
    )
    .addEventListener(
        "click",
        resetLogoDashboard
    );


document.addEventListener(
    "DOMContentLoaded",
    muatLogoDashboard
);

</script>


<!-- ================================= -->
<!-- FIREBASE LOGIN / LOGOUT -->
<!-- ================================= -->

<script type="module">

import {
    auth
} from "./js/firebase-config.js";


import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const emailAkun =
    document.getElementById(
        "emailAkun"
    );


const tombol =
    document.getElementById(
        "tombolLoginLogout"
    );


// ======================================
// CEK STATUS LOGIN
// ======================================

onAuthStateChanged(
    auth,
    function (user) {

        if (user) {

            // ==========================
            // SUDAH LOGIN
            // ==========================

            emailAkun.textContent =
                user.email ||
                "Akun Firebase";


            tombol.innerHTML =
                '<i class="bi bi-box-arrow-right"></i> Keluar';


            tombol.className =
                "btn btn-outline-danger";


            tombol.onclick =
                async function () {

                    const yakin =
                        confirm(
                            "Apakah kamu yakin ingin keluar?"
                        );


                    if (!yakin) {

                        return;

                    }


                    try {

                        await signOut(
                            auth
                        );


                        window.location.replace(
                            "login.html"
                        );


                    } catch (error) {

                        console.error(
                            "Gagal logout:",
                            error
                        );


                        alert(
                            "Gagal keluar dari akun."
                        );

                    }

                };

        }

        else {

            // ==========================
            // BELUM LOGIN
            // ==========================

            emailAkun.textContent =
                "Belum login";


            tombol.innerHTML =
                '<i class="bi bi-box-arrow-in-right"></i> Login';


            tombol.className =
                "btn btn-success";


            tombol.onclick =
                function () {

                    window.location.replace(
                        "login.html"
                    );

                };

        }

    }
);

</script>

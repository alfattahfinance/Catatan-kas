<!-- PENGATURAN -->
<!-- ================================= -->
<script>
const pengaturanDefault = {
    namaPondok:
        "Ribath Madrasah Al-Fattah",
    subJudul:
        "Dashboard Keuangan Pondok",
    mataUang:
        "Rupiah",
    tema:
        "light"
};
function muatPengaturan() {
    const data =
        JSON.parse(
            localStorage.getItem("pengaturanAplikasi")
        ) || pengaturanDefault;
    document.getElementById("namaPondok").value =
        data.namaPondok;
    document.getElementById("subJudul").value =
        data.subJudul;
    document.getElementById("mataUang").value =
        data.mataUang;
    document.getElementById("tema").value =
        data.tema;
}
function simpanPengaturan() {
    const data = {
        namaPondok:
            document.getElementById("namaPondok").value.trim(),
        subJudul:
            document.getElementById("subJudul").value.trim(),
        mataUang:
            document.getElementById("mataUang").value,
        tema:
            document.getElementById("tema").value
    };
    if (!data.namaPondok) {
        alert("Nama pondok belum diisi.");
        return;
    }
    localStorage.setItem(
        "pengaturanAplikasi",
        JSON.stringify(data)
    );
    terapkanTema(data.tema);
    alert(
        "✅ Pengaturan berhasil disimpan!"
    );
}
function terapkanTema(tema) {
    let gunakanGelap = false;
    if (tema === "dark") {
        gunakanGelap = true;
    } else if (tema === "system") {
        gunakanGelap =
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;
    }
    if (gunakanGelap) {
        document.body.classList.add("dark-mode");
    } else {
        document.body.classList.remove("dark-mode");
    }
}
function resetPengaturan() {
    const yakin =
        confirm(
            "Apakah kamu yakin ingin mengembalikan pengaturan awal?"
        );
    if (!yakin) return;
    localStorage.removeItem(
        "pengaturanAplikasi"
    );
    muatPengaturan();
    terapkanTema("light");
    alert(
        "✅ Pengaturan dikembalikan ke awal."
    );
}
document.addEventListener(
    "DOMContentLoaded",
    () => {
        muatPengaturan();
        const data =
            JSON.parse(
                localStorage.getItem(
                    "pengaturanAplikasi"
                )
            ) || pengaturanDefault;
        terapkanTema(data.tema);
    }
);
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const saved = localStorage.getItem("logoDashboard");
    if (saved) document.getElementById("previewLogoDashboard").src = saved;

    const input = document.getElementById("logoDashboardInput");
    if (input) {
        input.addEventListener("change", function () {
            const file = this.files && this.files[0];
            if (!file) return;
            if (!file.type.startsWith("image/")) {
                alert("Silakan pilih file gambar.");
                return;
            }
            const reader = new FileReader();
            reader.onload = function (e) {
                localStorage.setItem("logoDashboard", e.target.result);
                document.getElementById("previewLogoDashboard").src = e.target.result;
                alert("Logo Dashboard berhasil diganti.");
            };
            reader.readAsDataURL(file);
        });
    }
});
function resetLogoDashboard() {
    localStorage.removeItem("logoDashboard");
    document.getElementById("previewLogoDashboard").src = "assets/logo-catatan-kas.jpg";
    alert("Logo Dashboard dikembalikan ke logo bawaan.");
}
</script>

<script>
document.addEventListener("DOMContentLoaded", function(){
  const input=document.getElementById("logoDashboardInput");
  const preview=document.getElementById("logoPreviewV2");
  const saved=localStorage.getItem("logoDashboard");
  if(saved && preview) preview.src=saved;
  if(input && preview){
    input.addEventListener("change",function(){
      const file=this.files && this.files[0];
      if(!file) return;
      const reader=new FileReader();
      reader.onload=()=>preview.src=reader.result;
      reader.readAsDataURL(file);
    });
  }
});
</script>

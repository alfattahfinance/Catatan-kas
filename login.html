<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#dfe8d5">
<title>Login | Alfattah Finance</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<style>
*{box-sizing:border-box}
:root{--sage:#789b83;--sage-dark:#4f7560;--cream:#f5efdc;--gold:#d6b56d;--ink:#20342a;--danger:#c95656}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--cream),#e5ead9,var(--sage));background-size:300% 300%;animation:bgMove 18s ease-in-out infinite;color:var(--ink)}
.login-container{width:100%;max-width:430px;text-align:center}
.logo-wrapper{animation:logoIn .8s ease forwards;opacity:0}.logo{width:96px;height:96px;object-fit:cover;border-radius:24px;border:4px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(35,70,50,.2);background:#fff}
.welcome{margin-top:18px;animation:up .8s .15s ease forwards;opacity:0}.welcome h1{font-size:28px;font-weight:800;color:var(--sage-dark);margin:0 0 7px}.welcome p{color:#5f6e65;font-size:14px;line-height:1.5;margin:0}
.login-card{margin-top:24px;background:rgba(255,255,255,.92);padding:25px 22px;border-radius:24px;box-shadow:0 14px 40px rgba(31,55,41,.14);animation:up .8s .3s ease forwards;opacity:0;backdrop-filter:blur(8px)}
.input-group-custom{position:relative;margin-bottom:14px}.input-group-custom>i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--sage-dark);z-index:2}.input-group-custom input{width:100%;border:1px solid #d7dfd7;border-radius:14px;padding:14px 48px 14px 44px;outline:none;background:#fff;color:#24372d;transition:.2s}.input-group-custom input:focus{border-color:var(--sage);box-shadow:0 0 0 4px rgba(120,155,131,.14)}
.password-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#6b7d72;padding:7px;z-index:3}.btn-main{width:100%;border:0;background:var(--sage-dark);color:#fff;padding:14px;border-radius:14px;font-weight:700;transition:.2s}.btn-main:hover{background:#416750;transform:translateY(-1px)}.btn-main:disabled{opacity:.65;transform:none}
.secondary-row{display:flex;justify-content:space-between;gap:10px;margin-top:15px;font-size:13px}.link-btn{border:0;background:transparent;color:var(--sage-dark);font-weight:700;padding:4px}.link-btn:hover{text-decoration:underline}
.message{display:none;padding:11px 12px;border-radius:12px;margin-bottom:14px;font-size:13px;text-align:left}.message.error{color:#9f3030;background:#fff0f0;border:1px solid #f0c8c8}.message.info{color:#3e604d;background:#edf7ef;border:1px solid #cfe5d4}.loading{display:none;margin-top:12px;color:#64736a;font-size:13px}.footer{margin-top:18px;color:rgba(32,52,42,.65);font-size:12px;animation:fade 1s 1s forwards;opacity:0}
@keyframes bgMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}@keyframes logoIn{0%{opacity:0;transform:scale(.75)}70%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){body,.logo-wrapper,.welcome,.login-card,.footer{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="login-container">
    <div class="logo-wrapper"><img src="IMG_1091.jpeg" class="logo" alt="Logo Alfattah Finance" onerror="this.onerror=null;this.src='logo-catatan-kas.jpg'"></div>
    <div class="welcome"><h1>Welcome</h1><p>Selamat datang di <strong>Alfattah Finance</strong><br>Sistem Keuangan Ribath Madrasah Al-Fattah</p></div>

    <div class="login-card">
        <div id="message" class="message"></div>

        <div class="input-group-custom">
            <i class="bi bi-envelope-fill"></i>
            <input type="email" id="email" placeholder="Gmail" autocomplete="username" inputmode="email">
        </div>

        <div class="input-group-custom">
            <i class="bi bi-lock-fill"></i>
            <input type="password" id="password" placeholder="Kata sandi" autocomplete="current-password">
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Tampilkan kata sandi"><i class="bi bi-eye"></i></button>
        </div>

        <button id="loginButton" class="btn-main"><i class="bi bi-box-arrow-in-right"></i> Masuk</button>
        <div id="loading" class="loading"><span class="spinner-border spinner-border-sm"></span> Memeriksa akun...</div>

        <div class="secondary-row">
            <button type="button" class="link-btn" id="registerButton"><i class="bi bi-person-plus"></i> Daftar</button>
            <button type="button" class="link-btn" id="forgotButton"><i class="bi bi-key"></i> Lupa kata sandi?</button>
        </div>
    </div>

    <div class="footer">© 2026 Alfattah Finance</div>
</div>

<script type="module">
import { auth } from "./firebase-config.js";
import {
    signInWithEmailAndPassword,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence,
    sendPasswordResetEmail,
    signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

const emailInput=document.getElementById("email");
const passwordInput=document.getElementById("password");
const loginButton=document.getElementById("loginButton");
const registerButton=document.getElementById("registerButton");
const forgotButton=document.getElementById("forgotButton");
const togglePassword=document.getElementById("togglePassword");
const loading=document.getElementById("loading");
const message=document.getElementById("message");

function showMessage(text,type="error"){
    message.textContent=text;
    message.className=`message ${type}`;
    message.style.display="block";
}
function clearMessage(){message.style.display="none"}
function setBusy(busy){loginButton.disabled=busy;registerButton.disabled=busy;forgotButton.disabled=busy;loading.style.display=busy?"block":"none"}
function explainAuthError(error){
    const code=error?.code||"";
    if(code.includes("network-request-failed")) return "Tidak dapat terhubung ke Firebase. Pastikan internet aktif lalu coba lagi.";
    if(code.includes("too-many-requests")) return "Terlalu banyak percobaan login. Tunggu beberapa saat lalu coba lagi.";
    if(code.includes("user-disabled")) return "Akun ini dinonaktifkan oleh administrator Firebase.";
    if(code.includes("invalid-email")) return "Format Gmail tidak valid. Periksa kembali alamat email.";
    if(code.includes("invalid-credential")||code.includes("invalid-login-credentials")||code.includes("wrong-password")||code.includes("user-not-found")) return "Gmail atau kata sandi tidak cocok. Periksa kembali penulisannya.";
    if(code.includes("operation-not-allowed")) return "Login email/password belum diaktifkan di Firebase Authentication.";
    return `Login gagal (${code||"error tidak diketahui"}). Coba lagi atau hubungi pengelola aplikasi.`;
}

async function prosesLogin(){
    const email=emailInput.value.trim().toLowerCase();
    const password=passwordInput.value;
    clearMessage();
    if(!email||!password){showMessage("Gmail dan kata sandi harus diisi.");return}
    setBusy(true);
    try{
        await setPersistence(auth,browserLocalPersistence);
        await signInWithEmailAndPassword(auth,email,password);
        window.location.replace("index.html");
    }catch(error){
        console.error("LOGIN ERROR:",error);
        showMessage(explainAuthError(error));
        setBusy(false);
    }
}

loginButton.addEventListener("click",prosesLogin);
[emailInput,passwordInput].forEach(input=>input.addEventListener("keydown",e=>{if(e.key==="Enter")prosesLogin()}));

togglePassword.addEventListener("click",()=>{
    const visible=passwordInput.type==="text";
    passwordInput.type=visible?"password":"text";
    togglePassword.innerHTML=visible?'<i class="bi bi-eye"></i>':'<i class="bi bi-eye-slash"></i>';
});

registerButton.addEventListener("click",()=>window.location.href="register.html");

forgotButton.addEventListener("click",async()=>{
    const email=emailInput.value.trim().toLowerCase();
    if(!email){showMessage("Masukkan Gmail terlebih dahulu untuk mengirim link reset kata sandi.","info");emailInput.focus();return}
    forgotButton.disabled=true;
    try{
        await sendPasswordResetEmail(auth,email);
        showMessage("Link untuk membuat kata sandi baru sudah dikirim. Periksa Inbox/Spam Gmail.","info");
    }catch(error){
        console.error("RESET PASSWORD ERROR:",error);
        showMessage(explainAuthError(error));
    }finally{forgotButton.disabled=false}
});

onAuthStateChanged(auth,user=>{
    if(user){window.location.replace("index.html")}
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Santri | Catatan Kas</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            /* Background Gradasi 2 Warna Beranimasi */
            background: linear-gradient(135deg, #d8e2dc 0%, #fefae0 100%);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            color: #212529;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .mobile-container {
            max-width: 600px;
            margin: auto;
            padding-bottom: 90px;
        }

        .custom-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .06);
            background: rgba(255, 255, 255, .90);
            backdrop-filter: blur(6px);
        }

        /* HEADER TOPBAR */
        .ck-topbar {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, .92);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .05);
        }

        .ck-logo {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 14px;
            background: white;
            border: 1px solid #eee;
        }

        .ck-title {
            margin: 0;
            color: #198754;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .ck-subtitle {
            color: #6c757d;
            font-size: .8rem;
        }

        .ck-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #198754;
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .ck-back:hover {
            color: #146c43;
        }

        /* BOTTOM NAVIGATION */
        .ck-bottom {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1050;
    background: rgba(255, 255, 255, .97);
    border-top: 1px solid #dee2e6;
    box-shadow: 0 -3px 15px rgba(0, 0, 0, .08);
    padding: 6px 15px; /* Sesuaikan padding kiri-kanan */
    backdrop-filter: blur(8px);
}

.ck-bottom-inner {
    width: 100% !important;
    max-width: 100% !important; /* Diubah dari pembatas sebelumnya agar full */
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
}


        .ck-bottom a {
            color: #6c757d;
            text-decoration: none;
            font-size: .68rem;
            text-align: center;
            min-width: 58px;
            font-weight: 600;
        }

        .ck-bottom a i {
            display: block;
            font-size: 1.15rem;
            line-height: 1.1;
        }

        .ck-bottom a.active {
            color: #198754;
            font-weight: 800;
        }

        /* DARK MODE */
        body.dark-mode {
            background: #121212 !important;
            animation: none !important;
            color: #ffffff !important;
        }

        body.dark-mode .custom-card,
        body.dark-mode .ck-topbar,
        body.dark-mode .ck-bottom {
            background: #1e1e1e !important;
            color: #eee !important;
            border-color: #333 !important;
        }

        body.dark-mode .form-control,
        body.dark-mode .form-select {
            background: #2a2a2a !important;
            color: #fff !important;
            border: 1px solid #444 !important;
        }

        body.dark-mode .text-muted {
            color: #aaa !important;
        }
    </style>
</head>

<body>

<div class="container mobile-container py-4">

    <!-- Topbar Header -->
    <div class="ck-topbar">
        <img id="logoPreviewV2" src="assets/logo-catatan-kas.jpg" class="ck-logo" alt="Logo Catatan Kas">
        <div>
            <p class="ck-title">Catatan Kas</p>
            <span class="ck-subtitle" id="namaPondokHeader">Madrasah Al-Fattah</span>
        </div>
    </div>

    <div class="py-2 mb-5">

        <!-- Form Pembayaran -->
        <div class="card custom-card p-3 mb-4">
            <div class="card-body p-1">
                <a href="index.html" class="ck-back"><i class="bi bi-arrow-left"></i> Kembali ke Dashboard</a>
                <h4 class="mb-4 fw-bold">Input Pembayaran</h4>

                <div class="mb-3">
                    <label class="form-label text-muted small">Nama Santri</label>
                    <select id="santri" class="form-select border-0 bg-light px-3 py-2">
                        <option value="">Pilih Santri</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small">Jenis Pembayaran</label>
                    <select id="jenis" class="form-select border-0 bg-light px-3 py-2" onchange="pilihPembayaran()">
                        <option value="">Pilih Pembayaran</option>
                        <option value="SPP">SPP</option>
                        <option value="Syahriyyah">Syahriyyah</option>
                        <option value="Infaq">Infaq</option>
                        <option value="Kas">Kas</option>
                        <option value="Beras">Beras</option>
                    </select>
                </div>

                <div id="berasPilihan" class="mb-3" style="display:none;">
                    <label class="form-label text-muted small">Metode Beras</label>
                    <select id="tipeBeras" class="form-select border-0 bg-light px-3 py-2" onchange="aturBeras()">
                        <option value="uang">💵 Uang</option>
                        <option value="liter">🌾 Beras (Liter)</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small">Nominal</label>
                    <input type="number" id="nominal" class="form-control border-0 bg-light px-3 py-2" placeholder="Masukkan nominal">
                </div>

                <button class="btn btn-success w-100 py-2 rounded-pill fw-bold" onclick="simpanPembayaran()">
                    Simpan Pembayaran
                </button>
            </div>
        </div>

        <!-- Riwayat Pembayaran -->
        <div class="card custom-card p-3">
            <div class="card-body p-1">
                <h5 class="mb-3 fw-bold">📜 Riwayat Pembayaran</h5>
                <ul id="riwayat" class="list-group list-group-flush mt-3">
                    <li class="list-group-item text-center text-muted border-0 py-3">
                        Memuat data...
                    </li>
                </ul>
            </div>
        </div>

    </div>

</div>

<!-- Bottom Navigation -->
<div class="ck-bottom">
    <div class="ck-bottom-inner">
        <a href="index.html"><i class="bi bi-house-fill"></i>Beranda</a>
        <a href="santri.html"><i class="bi bi-people-fill"></i>Santri</a>
        <a href="pembayaran.html" class="active"><i class="bi bi-cash-stack"></i>Bayar</a>
        <a href="pengeluaran.html"><i class="bi bi-wallet2"></i>Keluar</a>
        <a href="laporan.html"><i class="bi bi-bar-chart-fill"></i>Laporan</a>
    </div>
</div>

<!-- Script Logika UI -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Muat Pengaturan Nama Pondok & Logo
        const pengaturan = JSON.parse(localStorage.getItem("pengaturanAplikasi"));
        if (pengaturan && pengaturan.namaPondok) {
            document.getElementById("namaPondokHeader").textContent = pengaturan.namaPondok;
        }
        const savedLogo = localStorage.getItem("logoDashboard");
        if (savedLogo) {
            document.getElementById("logoPreviewV2").src = savedLogo;
        }

        // Muat Data Santri ke Dropdown dari localStorage (jaga-jaga jika variabel global belum siap)
        let selectSantri = document.getElementById("santri");
        let listSantri = [];
        
        try {
            listSantri = JSON.parse(localStorage.getItem("daftarSantri")) || window.daftarSantri || [];
        } catch (e) {
            listSantri = window.daftarSantri || [];
        }

        if (listSantri.length > 0) {
            listSantri.forEach((item) => {
                let option = document.createElement("option");
                option.value = item.nama;
                option.textContent = item.nama + (item.kelas ? ` (${item.kelas})` : '');
                selectSantri.appendChild(option);
            });
        }

        tampilkanRiwayat();
    });

    function pilihPembayaran() {
        let jenis = document.getElementById("jenis").value;
        let nominal = document.getElementById("nominal");
        let beras = document.getElementById("berasPilihan");

        beras.style.display = "none";

        if (jenis == "SPP") {
            nominal.value = 50000;
        } else if (jenis == "Syahriyyah") {
            nominal.value = 80000;
        } else if (jenis == "Kas") {
            nominal.value = 30000;
        } else if (jenis == "Beras") {
            nominal.value = "";
            beras.style.display = "block";
        } else {
            nominal.value = "";
        }
    }

    function aturBeras() {
        let tipe = document.getElementById("tipeBeras").value;
        let nominal = document.getElementById("nominal");

        if (tipe == "uang") {
            nominal.placeholder = "Masukkan nominal";
            nominal.value = 120000;
        } else {
            nominal.value = "";
            nominal.placeholder = "Masukkan jumlah liter";
        }
    }

    function simpanPembayaran() {
        let nama = document.getElementById("santri").value;
        let jenis = document.getElementById("jenis").value;
        let nominal = document.getElementById("nominal").value;

        if (!nama || !jenis || !nominal) {
            alert("Data belum lengkap");
            return;
        }

        let riwayatArr = JSON.parse(localStorage.getItem("pembayaran")) || [];

        riwayatArr.push({
            nama,
            jenis,
            nominal,
            tanggal: new Date().toLocaleDateString("id-ID")
        });

        localStorage.setItem("pembayaran", JSON.stringify(riwayatArr));
        alert("✅ Pembayaran berhasil disimpan");
        
        // Reset form
        document.getElementById("nominal").value = "";
        document.getElementById("jenis").value = "";
        document.getElementById("santri").value = "";
        document.getElementById("berasPilihan").style.display = "none";

        tampilkanRiwayat();
    }

    function tampilkanRiwayat() {
        let box = document.getElementById("riwayat");
        box.innerHTML = "";

        let riwayatArr = JSON.parse(localStorage.getItem("pembayaran")) || [];

        if (riwayatArr.length === 0) {
            box.innerHTML = `
            <li class="list-group-item text-muted text-center border-0 py-3">
                Belum ada transaksi
            </li>`;
            return;
        }

        // Tampilkan dari yang terbaru
        riwayatArr.slice().reverse().forEach((item) => {
            box.innerHTML += `
            <li class="list-group-item d-flex justify-content-between align-items-center border-0 border-bottom py-3 bg-transparent">
                <div>
                    <b class="d-block text-dark">${item.nama}</b>
                    <small class="text-muted">${item.jenis} • ${item.tanggal}</small>
                </div>
                <div class="text-success fw-bold">
                    Rp ${Number(item.nominal).toLocaleString("id-ID")}
                </div>
            </li>`;
        });
    }
</script>

<!-- Script Tambahan Pendukung -->
<script type="module" src="js/pembayaran.js?v=3"></script>
<script src="js/theme.js"></script>
<script type="module" src="js/auth-guard.js"></script>

</body>
</html>

     STYLE KHUSUS HALAMAN PEMBAYARAN
====================================================== -->
<style>
    * {
        box-sizing: border-box;
    }
    html {
        scroll-behavior: smooth;
    }
    body {
        margin: 0;
        min-height: 100vh;
        font-family:
            Arial,
            Helvetica,
            sans-serif;
        padding-bottom: 100px;
        background:
            linear-gradient(
                135deg,
                #d8e2dc 0%,
                #fefae0 100%
            );
        background-size: 200% 200%;
        animation:
            gradientShift 15s ease infinite;
        color: #212529;
    }
    @keyframes gradientShift {
        0% {
            background-position: 0% 50%;
        }
        50% {
            background-position: 100% 50%;
        }
        100% {
            background-position: 0% 50%;
        }
    }
    /* =================================================
       CONTAINER
    ================================================= */
    .mobile-container {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 auto;
        padding:
            20px !important;
        padding-bottom:
            110px !important;
    }
    /* =================================================
       CARD
    ================================================= */
    .custom-card {
        border: none;
        border-radius: 18px;
        box-shadow:
            0 4px 14px
            rgba(0, 0, 0, .06);
        background:
            rgba(255, 255, 255, .90);
        backdrop-filter:
            blur(8px);
        -webkit-backdrop-filter:
            blur(8px);
    }
    /* =================================================
       HEADER
    ================================================= */
    .ck-topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        background:
            rgba(255, 255, 255, .92);
        border-radius: 18px;
        padding: 14px;
        margin-bottom: 20px;
        box-shadow:
            0 4px 14px
            rgba(0, 0, 0, .05);
    }
    .ck-logo {
        width: 56px;
        height: 56px;
        min-width: 56px;
        object-fit: contain;
        border-radius: 14px;
        background: #fff;
        border:
            1px solid #eee;
    }
    .ck-title {
        margin: 0;
        color: #198754;
        font-weight: 800;
        font-size: 1.1rem;
    }
    .ck-subtitle {
        color: #6c757d;
        font-size: .8rem;
    }
    /* =================================================
       TOMBOL KEMBALI
    ================================================= */
    .ck-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #198754;
        text-decoration: none;
        font-weight: 700;
        margin-bottom: 12px;
    }
    .ck-back:hover {
        color: #146c43;
    }
    /* =================================================
       FORM
    ================================================= */
    .form-control,
    .form-select {
        min-height: 48px;
        border-radius: 12px;
        border:
            1px solid
            rgba(0, 0, 0, .10);
        box-shadow: none;
        transition:
            border-color .2s ease,
            box-shadow .2s ease,
            background .2s ease;
    }
    .form-control:focus,
    .form-select:focus {
        border-color:
            #198754;
        box-shadow:
            0 0 0 .2rem
            rgba(25, 135, 84, .12);
    }
    .form-label {
        color: #495057;
    }
    /* =================================================
       TOMBOL SIMPAN
    ================================================= */
    #btnSimpanPembayaran {
        min-height: 50px;
        transition:
            transform .2s ease,
            box-shadow .2s ease;
    }
    #btnSimpanPembayaran:hover {
        transform:
            translateY(-1px);
        box-shadow:
            0 6px 15px
            rgba(25, 135, 84, .20);
    }
    #btnSimpanPembayaran:active {
        transform:
            translateY(0);
    }
    /* =================================================
       RIWAYAT
    ================================================= */
    #riwayat {
        border-radius: 12px;
        overflow: hidden;
    }
    #riwayat .list-group-item {
        background:
            transparent;
        transition:
            background .2s ease;
    }
    #riwayat .list-group-item:hover {
        background:
            rgba(25, 135, 84, .05);
    }
    .riwayat-nama {
        color: #212529;
        font-weight: 700;
    }
    .riwayat-nominal {
        color: #198754;
        font-weight: 800;
        white-space: nowrap;
    }
    /* =================================================
       BOTTOM NAVIGATION
    ================================================= */
    .ck-bottom {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1050;
        background:
            rgba(255, 255, 255, .97);
        border-top:
            1px solid #dee2e6;
        box-shadow:
            0 -3px 15px
            rgba(0, 0, 0, .08);
        padding:
            6px 15px;
        backdrop-filter:
            blur(8px);
        -webkit-backdrop-filter:
            blur(8px);
    }
    .ck-bottom-inner {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 auto;
        display: grid;
        grid-template-columns:
            repeat(5, 1fr);
        gap: 4px;
    }
    .ck-bottom a {
        text-decoration: none !important;
        color: #6c757d;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        font-size: .68rem;
        padding:
            5px 2px;
        border-radius: 10px;
        transition:
            .2s ease;
    }
    .ck-bottom a i {
        font-size: 1.15rem;
    }
    .ck-bottom a:hover {
        color: #198754;
        background:
            rgba(25, 135, 84, .08);
    }
    .ck-bottom a.active {
        color:
            #198754 !important;
        font-weight: 700;
    }
    /* =================================================
       TABLET
    ================================================= */
    @media (min-width: 768px) {
        .mobile-container {
            padding-left:
                35px !important;
            padding-right:
                35px !important;
        }
        .ck-topbar {
            padding: 20px;
            border-radius: 20px;
        }
        .ck-logo {
            width: 72px;
            height: 72px;
            min-width: 72px;
            border-radius: 16px;
        }
        .ck-title {
            font-size: 1.35rem;
        }
        .ck-subtitle {
            font-size: 1rem;
        }
        .ck-back {
            font-size: 1rem;
        }
        .custom-card {
            border-radius: 20px;
        }
        .custom-card .card-body {
            padding: 25px !important;
        }
        .form-label {
            font-size: 1rem !important;
        }
        .form-control,
        .form-select {
            min-height: 52px;
            font-size: 1rem;
        }
        .btn {
            min-height: 52px;
            font-size: 1rem;
        }
        .ck-bottom {
            padding:
                8px 25px;
        }
        .ck-bottom a {
            font-size: .8rem;
            padding:
                8px 4px;
        }
        .ck-bottom a i {
            font-size: 1.35rem;
        }
    }
    /* =================================================
       TABLET BESAR
    ================================================= */
    @media (min-width: 992px) {
        .mobile-container {
            padding-left:
                50px !important;
            padding-right:
                50px !important;
        }
        .ck-topbar {
            padding: 24px;
        }
        .ck-logo {
            width: 86px;
            height: 86px;
            min-width: 86px;
        }
        .ck-title {
            font-size: 1.5rem;
        }
        .ck-subtitle {
            font-size: 1.05rem;
        }
        .custom-card .card-body {
            padding: 30px !important;
        }
    }
    /* =================================================
       MOBILE KECIL
    ================================================= */
    @media (max-width: 380px) {
        .mobile-container {
            padding-left:
                10px !important;
            padding-right:
                10px !important;
        }
        .ck-logo {
            width: 50px;
            height: 50px;
            min-width: 50px;
        }
        .ck-title {
            font-size: 1rem;
        }
        .ck-subtitle {
            font-size: .75rem;
        }
        .ck-bottom a {
            font-size: .62rem;
        }
        .ck-bottom a i {
            font-size: 1.05rem;
        }
    }
</style>

<body>

     CONTAINER UTAMA
====================================================== -->
<div

     HEADER
================================================== -->

<!-- =================================================
     FORM PEMBAYARAN
================================================== -->
<div class="card custom-card p-3 mb-4">
    <div class="card-body p-1">
        <!-- KEMBALI -->
        <a
            href="index.html"
            class="ck-back"
        >
            <i class="bi bi-arrow-left"></i>
            Kembali ke Dashboard
        </a>
        <h4 class="mb-4 fw-bold">
            <i
                class="bi bi-cash-stack text-success me-1"
            ></i>
            Input Pembayaran
        </h4>
        <!-- SANTRI -->
        <div class="mb-3">
            <label
                class="form-label fw-semibold"
                for="santri"
            >
                Nama Santri
            </label>
            <select
                id="santri"
                class="form-select"
            >
                <option value="">
                    Pilih Santri
                </option>
            </select>
        </div>
        <!-- JENIS PEMBAYARAN -->
        <div class="mb-3">
            <label
                class="form-label fw-semibold"
                for="jenis"
            >
                Jenis Pembayaran
            </label>
            <select
                id="jenis"
                class="form-select"
            >
                <option value="">
                    Pilih Pembayaran
                </option>
                <option value="SPP">
                    SPP
                </option>
                <option value="Syahriyyah">
                    Syahriyyah
                </option>
                <option value="Infaq">
                    Infaq
                </option>
                <option value="Kas">
                    Kas
                </option>
                <option value="Beras">
                    Beras
                </option>

        <!-- MODE BERAS -->

                class="form-select"

<!-- =====================================================
     PENGATURAN NAMA & LOGO
====================================================== -->
<script>
document.addEventListener(
    "DOMContentLoaded",
    function () {
        let pengaturan = null;
        try {
            pengaturan =
                JSON.parse(
                    localStorage.getItem(
                        "pengaturanAplikasi"
                    )
                );
        } catch (error) {
            console.warn(
                "Pengaturan aplikasi tidak valid.",
                error
            );
        }
        const namaPondok =
            document.getElementById(
                "namaPondokHeader"
            );
        if (
            namaPondok &&
            pengaturan &&
            pengaturan.namaPondok
        ) {
            namaPondok.textContent =
                pengaturan.namaPondok;
        }
        const logo =
            document.getElementById(
                "logoPreviewV2"
            );
        const logoTersimpan =
            localStorage.getItem(
                "logoDashboard"
            );
        if (
            logo &&
            logoTersimpan
        ) {
            logo.src =
                logoTersimpan;
        }
        if (logo) {
            logo.onerror =
                function () {
                    localStorage.removeItem(
                        "logoDashboard"
                    );
                    logo.src =
                        "assets/logo-catatan-kas.jpg";
                };
        }
    }
);
</script>
<!-- =====================================================
     LOGIKA PEMBAYARAN
====================================================== -->
<script>
document.addEventListener(
    "DOMContentLoaded",
    function () {
        const jenis =
            document.getElementById(
                "jenis"
            );
        const tipeBeras =
            document.getElementById(
                "tipeBeras"
            );
        const berasPilihan =
            document.getElementById(
                "berasPilihan"
            );
        const nominal =
            document.getElementById(
                "nominal"
            );
        const nominalHint =
            document.getElementById(
                "nominalHint"
            );
        if (
            !jenis ||
            !tipeBeras ||
            !berasPilihan ||
            !nominal
        ) {
            return;
        }
        function pilihPembayaran() {
            const nilai =
                jenis.value;
            berasPilihan.style.display =
                "none";
            nominal.value =
                "";
            nominal.step =
                "1";
            nominal.placeholder =
                "Masukkan nominal";
            if (nominalHint) {
                nominalHint.textContent =
                    "Masukkan jumlah pembayaran.";
            }
            if (nilai === "SPP") {
                nominal.value =
                    "50000";
            }
            else if (
                nilai === "Syahriyyah"
            ) {
                nominal.value =
                    "80000";
            }
            else if (
                nilai === "Kas"
            ) {
                nominal.value =
                    "30000";
            }
            else if (
                nilai === "Beras"
            ) {
                berasPilihan.style.display =
                    "block";
                aturBeras();
            }
        }
        function aturBeras() {
            if (
                jenis.value !== "Beras"
            ) {
                return;
            }
            const tipe =
                tipeBeras.value;
            if (
                tipe === "uang"
            ) {
                nominal.value =
                    "120000";
                nominal.step =
                    "1";
                nominal.placeholder =
                    "Masukkan nominal";
                if (nominalHint) {
                    nominalHint.textContent =
                        "Masukkan nominal pembayaran beras dalam rupiah.";
                }
            }
            else {
                nominal.value =
                    "";
                nominal.step =
                    "0.1";
                nominal.placeholder =
                    "Masukkan jumlah liter";
                if (nominalHint) {
                    nominalHint.textContent =
                        "Masukkan jumlah beras dalam liter.";
                }
            }
        }
        jenis.addEventListener(
            "change",
            pilihPembayaran
        );
        tipeBeras.addEventListener(
            "change",
            aturBeras
        );
    }
);
</script>

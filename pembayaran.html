    <!-- =====================================================
         STYLE KHUSUS HALAMAN PEMBAYARAN

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #212529;

            padding-bottom: 110px;

            background:
                linear-gradient(
                    135deg,
                    #d8e2dc 0%,
                    #fefae0 100%
                );

            background-size: 200% 200%;

            animation:
                gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }

        /* =================================================
           CONTAINER
        ================================================== */

        .mobile-container {

            width: 100% !important;

            max-width: 100% !important;

            margin: 0 auto;

            padding-left: 20px !important;

            padding-right: 20px !important;

            padding-bottom: 120px !important;
        }

        /* =================================================
           CARD
        ================================================== */

        .custom-card {

            border: none;

            border-radius: 18px;

            box-shadow:
                0 4px 14px
                rgba(0, 0, 0, .06);

            background:
                rgba(255, 255, 255, .92);

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            margin-bottom: 20px;
        }

        /* =================================================
           HEADER
        ================================================== */

        .ck-topbar {

            display: flex;

            align-items: center;

            gap: 14px;

            background:
                rgba(255, 255, 255, .94);

            border-radius: 18px;

            padding: 14px;

            margin-bottom: 20px;

            box-shadow:
                0 4px 14px
                rgba(0, 0, 0, .05);

            transition:
                background .2s ease,
                color .2s ease;
        }

        .ck-logo {

            width: 56px;

            height: 56px;

            min-width: 56px;

            object-fit: contain;

            border-radius: 14px;

            background: #fff;

            border:
                1px solid #eee;
        }

        .ck-title {

            margin: 0;

            color: #198754;

            font-weight: 800;

            font-size: 1.1rem;
        }

        .ck-subtitle {

            color: #6c757d;

            font-size: .8rem;
        }

        /* =================================================
           TOMBOL KEMBALI
        ================================================== */

        .ck-back {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            color: #198754;

            text-decoration: none;

            font-weight: 700;

            margin-bottom: 15px;
        }

        .ck-back:hover {

            color: #146c43;
        }

        /* =================================================
           FORM
        ================================================== */

        .form-label {

            color: #495057;

            font-weight: 600;
        }

        .form-control,
        .form-select {

            min-height: 48px;

            border-radius: 12px;

            border:
                1px solid
                rgba(0, 0, 0, .10);

            box-shadow: none;

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease,
                color .2s ease;
        }

        .form-control:focus,
        .form-select:focus {

            border-color:
                #198754;

            box-shadow:
                0 0 0 .2rem
                rgba(25, 135, 84, .12);
        }

        /* =================================================
           NOMINAL HINT
        ================================================== */

        #nominalHint {

            font-size: .78rem;

            color: #6c757d;
        }

        /* =================================================
           TOMBOL SIMPAN
        ================================================== */

        #btnSimpanPembayaran {

            min-height: 50px;

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        #btnSimpanPembayaran:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 6px 15px
                rgba(25, 135, 84, .20);
        }

        #btnSimpanPembayaran:active {

            transform:
                translateY(0);
        }

        /* =================================================
           RIWAYAT
        ================================================== */

        #riwayat {

            border-radius: 12px;

            overflow: hidden;
        }

        #riwayat .list-group-item {

            background:
                transparent;

            transition:
                background .2s ease;
        }

        #riwayat .list-group-item:hover {

            background:
                rgba(25, 135, 84, .05);
        }

        .riwayat-nama {

            color: #212529;

            font-weight: 700;
        }

        .riwayat-nominal {

            color: #198754;

            font-weight: 800;

            white-space: nowrap;
        }

        /* =================================================
           BOTTOM NAVIGATION
        ================================================== */

        .ck-bottom {

            position: fixed;

            left: 0;

            right: 0;

            bottom: 0;

            z-index: 1050;

            background:
                rgba(255, 255, 255, .97);

            border-top:
                1px solid #dee2e6;

            box-shadow:
                0 -3px 15px
                rgba(0, 0, 0, .08);

            padding:
                6px 8px;

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);
        }

        .ck-bottom-inner {

            width: 100% !important;

            max-width: 100% !important;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 4px;
        }

        .ck-bottom a {

            text-decoration: none !important;

            color: #6c757d;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 3px;

            font-size: .68rem;

            padding:
                5px 2px;

            border-radius: 10px;

            transition:
                .2s ease;
        }

        .ck-bottom a i {

            font-size: 1.15rem;
        }

        .ck-bottom a:hover {

            color: #198754;

            background:
                rgba(25, 135, 84, .08);
        }

        .ck-bottom a.active {

            color:
                #198754 !important;

            font-weight: 700;
        }

        /* =================================================
           TABLET
        ================================================== */

        @media (min-width: 768px) {

            .mobile-container {

                padding-left:
                    35px !important;

                padding-right:
                    35px !important;
            }

            .ck-back {

            }

            .custom-card {

                border-radius: 20px;

            .custom-card .card-body {

            .form-label {

            .ck-bottom a {

            }

            .ck-subtitle {

            .custom-card .card-body {

            .ck-logo {

                min-width: 50px;
            }

            .ck-subtitle {

                font-size: .75rem;
            }

            .ck-bottom a {

            }

        }

        /* =================================================
           DARK MODE
           MODE GELAP AKAN AKTIF HANYA JIKA theme.js
           MENAMBAHKAN CLASS dark-mode

        body.dark-mode {

            background:

            color:

        }

        body.dark-mode .custom-card {

        body.dark-mode .ck-bottom a {

        body.dark-mode .ck-bottom a.active {

        }

        body.dark-mode .form-control,

            border-color:

        body.dark-mode .form-control::placeholder {

        body.dark-mode .text-muted {

        body.dark-mode .list-group-item {

                #f1f1f1 !important;

        }

            border-color:

        }

    </style>
</head>

<body>

<!-- =====================================================
     PENGATURAN NAMA & LOGO
====================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        /* =========================================
           NAMA PONDOK
        ========================================= */

        const namaPondok =
            document.getElementById(
                "namaPondokHeader"
            );

        try {

            const pengaturan =
                JSON.parse(
                    localStorage.getItem(
                        "pengaturanAplikasi"
                    )
                ) || {};

            if (
                namaPondok &&
                pengaturan.namaPondok
            ) {

                namaPondok.textContent =
                    pengaturan.namaPondok;
            }

        } catch (error) {

            console.warn(
                "Pengaturan aplikasi tidak valid.",
                error
            );

        }


        /* =========================================
           LOGO DASHBOARD
        ========================================= */

        const logo =
            document.getElementById(
                "logoPreviewV2"
            );

        const logoDefault =
            "assets/logo-catatan-kas.jpg";

        let logoTersimpan = null;

        try {

            logoTersimpan =
                localStorage.getItem(
                    "logoDashboard"
                );

        } catch (error) {

            console.warn(
                "Logo tidak dapat dibaca.",
                error
            );

        }

        if (
            logo &&
            logoTersimpan
        ) {

            logo.src =
                logoTersimpan;
        }

        if (logo) {

            logo.onerror =
                function () {

                    try {

                        localStorage.removeItem(
                            "logoDashboard"
                        );

                    } catch (error) {}

                    logo.src =
                        logoDefault;
                };
        }

    }

);

</script>


<!-- =====================================================
     LOGIKA INPUT PEMBAYARAN
====================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const jenis =
            document.getElementById(
                "jenis"
            );

        const tipeBeras =
            document.getElementById(
                "tipeBeras"
            );

        const berasPilihan =
            document.getElementById(
                "berasPilihan"
            );

        const nominal =
            document.getElementById(
                "nominal"
            );

        const nominalHint =
            document.getElementById(
                "nominalHint"
            );


        if (
            !jenis ||
            !tipeBeras ||
            !berasPilihan ||
            !nominal
        ) {

            return;
        }


        /* =========================================
           PILIH PEMBAYARAN
        ========================================= */

        function pilihPembayaran() {

            const nilai =
                jenis.value;


            berasPilihan.style.display =
                "none";


            nominal.value =
                "";

            nominal.step =
                "1";

            nominal.placeholder =
                "Masukkan nominal";


            if (nominalHint) {

                nominalHint.textContent =
                    "Masukkan jumlah pembayaran.";
            }


            if (nilai === "SPP") {

                nominal.value =
                    "50000";
            }

            else if (
                nilai === "Syahriyyah"
            ) {

                nominal.value =
                    "80000";
            }

            else if (
                nilai === "Kas"
            ) {

                nominal.value =
                    "30000";
            }

            else if (
                nilai === "Beras"
            ) {

                berasPilihan.style.display =
                    "block";

                aturBeras();
            }

        }


        /* =========================================
           MODE BERAS
        ========================================= */

        function aturBeras() {

            if (
                jenis.value !== "Beras"
            ) {

                return;
            }


            const tipe =
                tipeBeras.value;


            if (
                tipe === "uang"
            ) {

                nominal.value =
                    "120000";

                nominal.step =
                    "1";

                nominal.placeholder =
                    "Masukkan nominal";


                if (nominalHint) {

                    nominalHint.textContent =
                        "Masukkan nominal pembayaran beras dalam rupiah.";
                }

            }

            else {

                nominal.value =
                    "";

                nominal.step =
                    "0.1";

                nominal.placeholder =
                    "Masukkan jumlah liter";


                if (nominalHint) {

                    nominalHint.textContent =
                        "Masukkan jumlah beras dalam liter.";
                }

            }

        }


        /* =========================================
           EVENT
        ========================================= */

        jenis.addEventListener(
            "change",
            pilihPembayaran
        );

        tipeBeras.addEventListener(
            "change",
            aturBeras
        );

    }

);

</script>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#198754">
<meta name="description" content="Pembayaran Santri - Catatan Kas">
<title>Pembayaran Santri | Catatan Kas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;padding-bottom:100px;background:linear-gradient(135deg,#d8e2dc 0%,#fefae0 100%);background-size:200% 200%;animation:gradientShift 15s ease infinite}@keyframes gradientShift{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}html.dark-mode,html.dark-mode body{background:#121212!important;color:#f1f1f1!important;animation:none}.mobile-container{width:100%;max-width:100%;margin:0 auto;padding:20px 20px 120px}.custom-card{border:0;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.06);background:rgba(255,255,255,.94);backdrop-filter:blur(8px);margin-bottom:20px}html.dark-mode .custom-card{background:#1e1e1e!important;color:#f1f1f1!important;border-color:#333!important}.ck-topbar{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.94);border-radius:18px;padding:14px;margin-bottom:20px;box-shadow:0 4px 14px rgba(0,0,0,.05)}html.dark-mode .ck-topbar{background:#1e1e1e!important;color:#f1f1f1!important}.ck-logo{width:56px;height:56px;min-width:56px;object-fit:contain;border-radius:14px;background:#fff;border:1px solid #eee}.ck-title{margin:0;color:#198754;font-weight:800;font-size:1.1rem}.ck-subtitle{color:#6c757d;font-size:.8rem}.ck-back{display:inline-flex;align-items:center;gap:6px;color:#198754;text-decoration:none;font-weight:700;margin-bottom:15px}.form-label{font-weight:600}.form-control,.form-select{min-height:48px;border-radius:12px}.btn{border-radius:12px}.ck-bottom{position:fixed;left:0;right:0;bottom:0;z-index:1050;background:rgba(255,255,255,.97);border-top:1px solid #dee2e6;box-shadow:0 -3px 15px rgba(0,0,0,.08);padding:6px 8px}.ck-bottom-inner{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.ck-bottom a{text-decoration:none!important;color:#6c757d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;padding:5px 2px;border-radius:10px}.ck-bottom a i{font-size:1.15rem}.ck-bottom a.active{color:#198754!important;font-weight:700}html.dark-mode .ck-bottom{background:#1e1e1e!important;border-top-color:#333!important}html.dark-mode .ck-bottom a{color:#aaa}.ck-history-payment{width:100%;overflow:hidden}.ck-history-head{display:grid;grid-template-columns:1fr 1.15fr 2fr 1.5fr;gap:10px;padding:9px 12px;font-size:.68rem;font-weight:800;color:#728078;border-bottom:1px solid rgba(31,72,55,.12)}.ck-history-row{display:grid;grid-template-columns:1fr 1.15fr 2fr 1.5fr;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid rgba(31,72,55,.1)}.ck-history-date{font-size:.72rem;color:#728078}.ck-history-kind{font-size:.72rem;font-weight:800;color:#198754}.ck-history-name{font-size:.78rem;font-weight:800;overflow-wrap:anywhere}.ck-history-right{text-align:right}.ck-history-amount{font-size:.84rem;font-weight:900;color:#198754;white-space:nowrap}.ck-history-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:5px}.ck-history-actions .btn{font-size:.68rem;padding:4px 9px;border-radius:8px}@media(max-width:699px){.ck-history-head{display:none}.ck-history-row{grid-template-columns:1fr 1fr;gap:6px 12px;padding:12px}.ck-history-kind{text-align:right}.ck-history-name,.ck-history-right{grid-column:1/-1}.ck-history-right{text-align:left}.ck-history-actions{justify-content:flex-start}}@media(min-width:768px){.mobile-container{padding-left:35px;padding-right:35px}.ck-logo{width:72px;height:72px;min-width:72px}.ck-title{font-size:1.35rem}}
</style>
</head>
<body>
<div class="mobile-container">
  <div class="ck-topbar">
    <img id="logoPembayaran" class="ck-logo" src="icon-192.png" alt="Logo">
    <div><h1 class="ck-title">Pembayaran Santri</h1><div class="ck-subtitle">Catatan pemasukan dan pembayaran</div></div>
  </div>
  <a class="ck-back" href="index.html"><i class="bi bi-arrow-left"></i> Kembali</a>
  <div class="card custom-card">
    <div class="card-body p-3 p-md-4">
      <h4 class="mb-3"><i class="bi bi-cash-coin text-success"></i> Tambah Pembayaran</h4>
      <div class="mb-3" style="position:relative">
        <label class="form-label" for="namaSantriPemasukan">Nama Santri / Keterangan</label>
        <input id="namaSantriPemasukan" class="form-control" type="text" autocomplete="off" placeholder="Ketik nama, misalnya A">
      </div>
      <div class="mb-3">
        <label class="form-label" for="jenis">Jenis Pembayaran</label>
        <select id="jenis" class="form-select">
          <option value="">Pilih jenis pembayaran</option>
          <option value="SPP">SPP</option><option value="Syahriyyah">Syahriyyah</option><option value="Infaq">Infaq</option><option value="Kas">Kas</option><option value="Beras">Beras</option><option value="Lainnya">Lainnya</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label" for="nominal">Nominal</label>
        <input id="nominal" class="form-control" type="number" min="0" inputmode="numeric" placeholder="Masukkan nominal">
        <div id="nominalHint" class="form-text">Masukkan nominal dalam Rupiah.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="tanggalPembayaran">Tanggal</label>
        <input id="tanggalPembayaran" class="form-control" type="date">
      </div>
      <button id="btnSimpanPembayaran" type="button" class="btn btn-success w-100 py-3"><i class="bi bi-save"></i> Simpan Pembayaran</button>
    </div>
  </div>
  <div class="card custom-card">
    <div class="card-body p-3 p-md-4">
      <h5 class="mb-3"><i class="bi bi-clock-history text-success"></i> Riwayat Pembayaran</h5>
      <div id="daftarPembayaran"><div class="text-center text-muted p-4">Memuat...</div></div>
    </div>
  </div>
</div>
<nav class="ck-bottom"><div class="ck-bottom-inner">
<a href="index.html"><i class="bi bi-house"></i><span>Dashboard</span></a>
<a class="active" href="pembayaran.html"><i class="bi bi-cash-stack"></i><span>Pembayaran</span></a>
<a href="pengeluaran.html"><i class="bi bi-wallet2"></i><span>Pengeluaran</span></a>
<a href="santri.html"><i class="bi bi-people"></i><span>Santri</span></a>
<a href="pengaturan.html"><i class="bi bi-gear"></i><span>Pengaturan</span></a>
</div></nav>
<script type="module" src="pembayaran.js?v=5"></script>
</body>
</html>

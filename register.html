<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#dfe8d5">
<title>Daftar | Alfattah Finance</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<style>
*{box-sizing:border-box}:root{--sage:#789b83;--sage-dark:#4f7560;--cream:#f5efdc;--ink:#20342a}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--cream),#e5ead9,var(--sage));background-size:300% 300%;animation:bgMove 18s ease-in-out infinite;color:var(--ink)}.container-app{width:100%;max-width:430px;text-align:center}.logo{width:88px;height:88px;object-fit:cover;border-radius:22px;border:4px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(35,70,50,.2);background:#fff;animation:pop .8s ease}.title{margin-top:15px}.title h1{font-size:27px;font-weight:800;color:var(--sage-dark);margin:0 0 6px}.title p{margin:0;color:#5f6e65;font-size:14px}.card-app{margin-top:22px;background:rgba(255,255,255,.93);padding:24px 22px;border-radius:24px;box-shadow:0 14px 40px rgba(31,55,41,.14);backdrop-filter:blur(8px);animation:up .8s ease}.input{position:relative;margin-bottom:13px}.input>i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--sage-dark);z-index:2}.input input{width:100%;border:1px solid #d7dfd7;border-radius:14px;padding:14px 48px 14px 44px;outline:none;background:#fff}.input input:focus{border-color:var(--sage);box-shadow:0 0 0 4px rgba(120,155,131,.14)}.toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#6b7d72;padding:7px}.btn-main{width:100%;border:0;background:var(--sage-dark);color:#fff;padding:14px;border-radius:14px;font-weight:700}.btn-main:disabled{opacity:.65}.message{display:none;padding:11px 12px;border-radius:12px;margin-bottom:14px;font-size:13px;text-align:left}.error{color:#9f3030;background:#fff0f0;border:1px solid #f0c8c8}.info{color:#3e604d;background:#edf7ef;border:1px solid #cfe5d4}.back{margin-top:14px;border:0;background:transparent;color:var(--sage-dark);font-weight:700}.loading{display:none;margin-top:11px;color:#64736a;font-size:13px}.note{font-size:12px;color:#718078;margin:14px 2px 0;line-height:1.5}.footer{margin-top:17px;color:rgba(32,52,42,.65);font-size:12px}@keyframes bgMove{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}@keyframes pop{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){body,.logo,.card-app{animation:none}}
</style>
</head>
<body>
<div class="container-app">
<img src="IMG_1091.jpeg" class="logo" alt="Logo" onerror="this.onerror=null;this.src='logo-catatan-kas.jpg'">
<div class="title"><h1>Buat Akun</h1><p>Daftar untuk menggunakan Alfattah Finance</p></div>
<div class="card-app">
<div id="message" class="message"></div>
<div class="input"><i class="bi bi-person-fill"></i><input id="name" type="text" placeholder="Nama pengguna" autocomplete="name"></div>
<div class="input"><i class="bi bi-envelope-fill"></i><input id="email" type="email" placeholder="Gmail" autocomplete="email" inputmode="email"></div>
<div class="input"><i class="bi bi-lock-fill"></i><input id="password" type="password" placeholder="Kata sandi (minimal 6 karakter)" autocomplete="new-password"><button type="button" class="toggle" id="toggle1"><i class="bi bi-eye"></i></button></div>
<div class="input"><i class="bi bi-shield-lock-fill"></i><input id="confirm" type="password" placeholder="Ulangi kata sandi" autocomplete="new-password"><button type="button" class="toggle" id="toggle2"><i class="bi bi-eye"></i></button></div>
<button id="register" class="btn-main"><i class="bi bi-person-plus-fill"></i> Daftar Akun</button>
<div id="loading" class="loading"><span class="spinner-border spinner-border-sm"></span> Membuat akun...</div>
<div class="note">Akun dibuat menggunakan Firebase Authentication. Data akun tidak mengganti atau menghapus akun lama.</div>
<button id="back" class="back"><i class="bi bi-arrow-left"></i> Kembali ke Login</button>
</div>
<div class="footer">© 2026 Alfattah Finance</div>
</div>
<script type="module">
import {auth} from "./firebase-config.js";
import {createUserWithEmailAndPassword,updateProfile,setPersistence,browserLocalPersistence,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
const nameInput=document.getElementById("name"),emailInput=document.getElementById("email"),passwordInput=document.getElementById("password"),confirmInput=document.getElementById("confirm"),button=document.getElementById("register"),loading=document.getElementById("loading"),message=document.getElementById("message");
function show(text,type="error"){message.textContent=text;message.className=`message ${type}`;message.style.display="block"}
function err(e){const c=e?.code||"";if(c.includes("network-request-failed"))return"Tidak dapat terhubung ke Firebase. Pastikan internet aktif.";if(c.includes("email-already-in-use"))return"Gmail tersebut sudah terdaftar. Silakan kembali ke Login.";if(c.includes("invalid-email"))return"Format Gmail tidak valid.";if(c.includes("weak-password"))return"Kata sandi terlalu lemah. Gunakan minimal 6 karakter.";if(c.includes("operation-not-allowed"))return"Pendaftaran email/password belum diaktifkan di Firebase Authentication.";return`Pendaftaran gagal (${c||"error tidak diketahui"}).`}
function toggle(input,btn){btn.addEventListener("click",()=>{const v=input.type==="text";input.type=v?"password":"text";btn.innerHTML=v?'<i class="bi bi-eye"></i>':'<i class="bi bi-eye-slash"></i>'})}
toggle(passwordInput,document.getElementById("toggle1"));toggle(confirmInput,document.getElementById("toggle2"));
async function daftar(){message.style.display="none";const name=nameInput.value.trim(),email=emailInput.value.trim().toLowerCase(),pass=passwordInput.value,confirm=confirmInput.value;if(!name){show("Nama pengguna harus diisi.");return}if(!email||!email.includes("@")){show("Masukkan Gmail yang valid.");return}if(pass.length<6){show("Kata sandi minimal 6 karakter.");return}if(pass!==confirm){show("Ulangi kata sandi harus sama.");return}button.disabled=true;loading.style.display="block";try{await setPersistence(auth,browserLocalPersistence);const credential=await createUserWithEmailAndPassword(auth,email,pass);await updateProfile(credential.user,{displayName:name});show("Akun berhasil dibuat. Membuka Dashboard...","info");setTimeout(()=>window.location.replace("index.html"),600)}catch(e){console.error("REGISTER ERROR:",e);show(err(e));button.disabled=false;loading.style.display="none"}}
button.addEventListener("click",daftar);[nameInput,emailInput,passwordInput,confirmInput].forEach(x=>x.addEventListener("keydown",e=>{if(e.key==="Enter")daftar()}));document.getElementById("back").addEventListener("click",()=>window.location.replace("login.html"));
onAuthStateChanged(auth,user=>{if(user&&window.location.pathname.endsWith("register.html")){/* akun yang baru dibuat akan diarahkan oleh daftar(); jangan mengganggu halaman sebelum tombol ditekan */}});
</script>
</body>
</html>

<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#198754"><meta name="description" content="Keuangan - Dashboard Keuangan"><title>Keuangan | Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css"><style>*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;padding-bottom:90px;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#d8e2dc 0%,#f5f1e6 100%);background-size:200% 200%;animation:gradientShift 20s ease infinite;color:#212529}@keyframes gradientShift{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}html.dark-mode,html.dark-mode body{background:#121212!important;color:#f1f1f1!important;animation:none}.mobile-container{width:100%;max-width:100%;padding:16px 20px 100px;margin:auto}.custom-card{border:0;border-radius:18px;box-shadow:0 4px 15px rgba(0,0,0,.06);background:rgba(255,255,255,.88);backdrop-filter:blur(8px)}.app-header{background:rgba(255,255,255,.94)!important}.logo-wrapper{width:68px;height:68px;min-width:68px;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#198754}.app-logo{width:68px!important;height:68px!important;object-fit:contain;border-radius:18px;background:#fff}.app-name{font-size:1.15rem}.app-subtitle{font-size:.82rem;color:#6c757d!important}.form-select{min-height:46px;border-radius:12px}.summary-title{font-size:.95rem;font-weight:800;color:#245d4b}.saldo-card{border:0!important;background:linear-gradient(135deg,#198754,#0f6f57)!important;color:#fff!important;box-shadow:0 8px 22px rgba(25,135,84,.22)!important}.saldo-card #totalSaldo{font-size:1.8rem;font-weight:800}.stat-card{min-height:110px}.stat-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:1.1rem}.income-icon{background:rgba(25,135,84,.12);color:#198754}.expense-icon{background:rgba(220,53,69,.12);color:#dc3545}.menu-btn{background:#fff;border:1px solid #d4d8d4;border-radius:16px;padding:20px 10px;width:100%;min-height:112px;text-align:center;color:#333;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.03)}.menu-btn:hover{background:#eaf0ed;color:#198754;border-color:#198754}.menu-btn i{font-size:2rem;color:#198754}.menu-btn.red-icon i{color:#dc3545}.menu-btn h6{margin:0;font-size:.9rem;font-weight:600}.settings-btn{min-height:70px;flex-direction:row;gap:15px;padding:15px}.settings-btn i{font-size:1.5rem}.dashboard-footer{text-align:center;font-size:.75rem;color:#6c757d;padding:4px 0 20px}.ck-bottom{position:fixed;left:0;right:0;bottom:0;z-index:1050;background:rgba(255,255,255,.97);border-top:1px solid #dee2e6;box-shadow:0 -3px 15px rgba(0,0,0,.08);padding:6px 15px;backdrop-filter:blur(8px)}.ck-bottom-inner{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.ck-bottom a{text-decoration:none!important;color:#6c757d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;padding:5px 2px;border-radius:10px}.ck-bottom a i{font-size:1.15rem}.ck-bottom a.active{color:#198754!important;font-weight:700}html.dark-mode .custom-card,html.dark-mode .app-header{background:#1e1e1e!important;color:#f1f1f1!important;border-color:#333!important}html.dark-mode .app-subtitle{color:#adb5bd!important}html.dark-mode .dashboard-footer{color:#adb5bd!important}html.dark-mode .menu-btn{background:#1e1e1e;color:#f1f1f1;border-color:#444}html.dark-mode .form-select{background:#2b2b2b;color:#fff;border-color:#555}html.dark-mode .ck-bottom{background:#1e1e1e!important;border-top-color:#333}html.dark-mode .ck-bottom a{color:#aaa}@media(min-width:768px){.mobile-container{padding-left:35px;padding-right:35px}.logo-wrapper,.app-logo{width:78px!important;height:78px!important;min-width:78px}.app-name{font-size:1.35rem}.menu-btn{min-height:125px}}</style></head><body><div class="container-fluid mobile-container"><div class="card custom-card app-header mb-3"><div class="card-body d-flex align-items-center gap-3"><div class="logo-wrapper"><img id="logoDashboard" class="app-logo" src="logo-catatan-kas.jpg" alt="Logo Keuangan"></div><div class="flex-grow-1"><div class="app-name fw-bold text-success" data-app-name>Keuangan</div><div class="app-subtitle text-muted" data-app-subtitle>Dashboard Keuangan</div></div></div></div><div class="card custom-card mb-3"><div class="card-body"><label for="filterKategori" class="form-label fw-bold">Kategori</label><select id="filterKategori" class="form-select"><option value="Semua">Semua kategori</option></select></div></div><div class="summary-title mb-2">Ringkasan Keuangan</div><div class="row g-3 mb-3"><div class="col-12"><div class="card saldo-card"><div class="card-body"><small>Saldo Saat Ini</small><div id="totalSaldo">Rp0</div></div></div></div><div class="col-6"><div class="card custom-card stat-card"><div class="card-body text-center"><div class="stat-icon income-icon"><i class="bi bi-arrow-down-circle"></i></div><small class="text-muted">Total Pemasukan</small><div id="totalMasuk" class="fw-bold text-success">Rp0</div></div></div></div><div class="col-6"><div class="card custom-card stat-card"><div class="card-body text-center"><div class="stat-icon expense-icon"><i class="bi bi-arrow-up-circle"></i></div><small class="text-muted">Total Pengeluaran</small><div id="totalKeluar" class="fw-bold text-danger">Rp0</div></div></div></div></div><div class="row g-3 mb-4"><div class="col-6"><a href="santri.html" class="menu-btn"><i class="bi bi-people-fill"></i><h6>Data Peserta Didik</h6></a></div><div class="col-6"><a href="pembayaran.html" class="menu-btn"><i class="bi bi-cash-stack"></i><h6>Pembayaran</h6></a></div><div class="col-6"><a href="pengeluaran.html" class="menu-btn red-icon"><i class="bi bi-wallet2"></i><h6>Pengeluaran</h6></a></div><div class="col-6"><a href="laporan.html" class="menu-btn"><i class="bi bi-bar-chart-fill"></i><h6>Laporan Keuangan</h6></a></div><div class="col-12"><a href="pengaturan.html" class="menu-btn settings-btn"><i class="bi bi-gear-fill"></i><h6>Pengaturan Aplikasi</h6></a></div></div><div class="dashboard-footer">Keuangan • Dashboard Keuangan</div></div><nav class="ck-bottom"><div class="ck-bottom-inner"><a href="index.html" class="active"><i class="bi bi-house-fill"></i><span>Beranda</span></a><a href="santri.html"><i class="bi bi-people-fill"></i><span>Peserta Didik</span></a><a href="pembayaran.html"><i class="bi bi-cash-stack"></i><span>Bayar</span></a><a href="pengeluaran.html"><i class="bi bi-wallet2"></i><span>Keluar</span></a><a href="laporan.html"><i class="bi bi-bar-chart-fill"></i><span>Laporan</span></a></div></nav><script type="module" src="auth-guard.js"></script><script src="theme.js"></script><script type="module" src="app.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script></body></html>

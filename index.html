    <!-- =====================================================
         STYLE DASHBOARD

    <style>

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #d8e2dc 0%,
                    #f5f1e6 100%
                );

            background-size: 200% 200%;

            animation:
                gradientShift 20s ease infinite;

            color: #212529;

        }


        @keyframes gradientShift {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        /* =================================================
           DARK MODE
        ================================================= */

        body.dark-mode {

            background: #121212 !important;

            animation: none;

            color: #f1f1f1;

        }


        body.dark-mode .custom-card {

            background:
                rgba(30, 30, 30, .95) !important;

            color: #f1f1f1;

        }


        body.dark-mode .app-header {

            background:
                rgba(30, 30, 30, .95) !important;

        }


        body.dark-mode .menu-btn {

            background: #1e1e1e;

            color: #f1f1f1;

            border-color: #444;

        }


        body.dark-mode .menu-btn:hover {

            background: #292929;

        }


        body.dark-mode .form-select {

            background-color: #1e1e1e;

            color: #fff;

            border-color: #555;

        }


        body.dark-mode .text-muted,
        body.dark-mode .text-secondary {

            color: #adb5bd !important;

        }


        /* =================================================
           CONTAINER
        ================================================= */

        .mobile-container {

            width: 100%;

            max-width: 600px;

            margin-left: auto;

            margin-right: auto;

        }


        /* =================================================
           CARD
        ================================================= */

        .custom-card {

            border: none;

            border-radius: 18px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, .06);

            background:
                rgba(255, 255, 255, .84);

            backdrop-filter: blur(8px);

            -webkit-backdrop-filter: blur(8px);

        }


        /* =================================================
           APP HEADER
        ================================================= */

        .app-header {

            border: 0 !important;

            overflow: hidden;

            background:
                rgba(255, 255, 255, .94) !important;

        }


        .app-logo {

            width: 68px !important;

            height: 68px !important;

            min-width: 68px;

            object-fit: contain;

            border-radius: 18px !important;

            flex: 0 0 68px;

            display: block;

            background: #ffffff;

            border: 1px solid
                rgba(0, 0, 0, .05);

        }


        .app-name {

            font-size: 1.15rem;

            letter-spacing: -.2px;

        }


        .app-subtitle {

            font-size: .82rem;

        }


        /* =================================================
           FILTER
        ================================================= */

        .filter-card {

            padding: 2px;

        }


        .form-label {

            color: #245d4b;

        }


        body.dark-mode .form-label {

            color: #8fd3b4;

        }


        .form-select {

            border-radius: 12px;

            min-height: 46px;

            border-color:
                rgba(0, 0, 0, .12);

            box-shadow: none;

        }


        .form-select:focus {

            border-color: #198754;

            box-shadow:
                0 0 0 .2rem

        }


        /* =================================================
           RINGKASAN
        ================================================= */

            font-size: .95rem;

            font-weight: 800;

            color: #245d4b;

        }


        body.dark-mode .summary-title {

            color: #8fd3b4;

        }


        /* =================================================
           SALDO
        ================================================= */

        .saldo-card {

            border: 0 !important;

            background:
                linear-gradient(
                    135deg,
                    #198754,
                    #0f6f57

            box-shadow:
                0 8px 22px

            color: #fff !important;

        }


        .saldo-card #totalSaldo {

            font-size: 1.8rem;

            font-weight: 800;

            letter-spacing: -.5px;

        }


        /* =================================================
           KARTU PEMASUKAN / PENGELUARAN
        ================================================= */

        .stat-card {

            min-height: 110px;

            transition:
                transform .2s ease,
                box-shadow .2s ease;

        }


        .stat-card:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 18px
                rgba(0, 0, 0, .08);

        }


        .stat-icon {

            width: 38px;

            height: 38px;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 8px;

            font-size: 1.1rem;

        }


        .income-icon {

            background:
                rgba(25, 135, 84, .12);

            color: #198754;

        }


        .expense-icon {

            background:
                rgba(220, 53, 69, .12);

            color: #dc3545;

        }


        /* =================================================
           MENU
        ================================================= */

        .menu-btn {

            background: #ffffff;

            border:
                1px solid #d4d8d4;

            border-radius: 16px;

            padding: 20px 10px;

            width: 100%;

            min-height: 112px;

            height: 100%;

            text-align: center;

            color: #333;

            transition:
                all .25s ease;

            text-decoration: none;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 10px;

            box-shadow:
                0 2px 8px

        }


        .menu-btn:hover {

            background: #eaf0ed;

            color: #198754;

            border-color: #198754;

            transform:
                translateY(-3px);

            box-shadow:
                0 7px 18px
                rgba(25, 135, 84, .12);

        }


        .menu-btn:active {

            transform:

        }


        .menu-btn i {

            font-size: 2rem;

            color: #198754;

        }


        .menu-btn.red-icon i {

            color: #dc3545;

        }


        .menu-btn h6 {

            font-size: .9rem;

            font-weight: 600;

           PENGATURAN

            min-height: 70px;

<!-- =====================================================
     SCRIPT LOGO
====================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const logo = document.getElementById("logoDashboard");

    if (!logo) return;

    const logoDefault =
        "assets/logo-catatan-keuangan.png";

    const tersimpan =
        localStorage.getItem("logoDashboard");

    // Gunakan logo yang tersimpan
    if (tersimpan) {
        logo.src = tersimpan;
    }

    // Jika logo gagal dimuat
    logo.onerror = function () {

        console.warn(
            "Logo gagal dimuat. Menggunakan logo default."
        );

        // Hapus logo lama yang rusak
        localStorage.removeItem("logoDashboard");

        // Kembali ke logo default
        logo.src = logoDefault;

    };

});

</script>

<!-- =====================================================
     SCRIPT TAHUN OTOMATIS
====================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const select =
            document.getElementById(
                "tahunDashboard"
            );

        if (!select) return;


        const currentYear =
            new Date()
                .getFullYear()
                .toString();


        const sudahAda =
            [...select.options]
                .some(
                    option =>
                        option.value === currentYear
                );


        if (!sudahAda) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                currentYear;

            option.textContent =
                currentYear;

            select.appendChild(
                option
            );

        }


        select.value =
            currentYear;

    }
);

</script>



<!-- =====================================================
     SCRIPT MODE BERAS
====================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const jenis =
            document.getElementById(
                "jenisDashboard"
            );

        const modeDiv =
            document.getElementById(
                "modeBerasDiv"
            );


        if (!jenis || !modeDiv) {
            return;
        }


        function tampilkanModeBeras() {

            if (
                jenis.value === "beras"
            ) {

                modeDiv.style.display =
                    "block";

            } else {

                modeDiv.style.display =
                    "none";

            }

        }


        jenis.addEventListener(
            "change",
            tampilkanModeBeras
        );


        tampilkanModeBeras();

    }
);

</script>



<!-- =====================================================
     PENGATURAN APLIKASI
====================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        let data = null;


        try {

            data =
                JSON.parse(
                    localStorage.getItem(
                        "pengaturanAplikasi"
                    )
                );

        } catch (error) {

            console.error(
                "Data pengaturan tidak valid:",
                error
            );

            return;

        }


        if (!data) return;


        const namaPondok =
            document.getElementById(
                "namaPondokDashboard"
            );


        const subJudul =
            document.getElementById(
                "subJudulDashboard"
            );


        if (
            namaPondok &&
            data.namaPondok
        ) {

            namaPondok.textContent =
                data.namaPondok;

        }


        if (
            subJudul &&
            data.subJudul
        ) {

            subJudul.textContent =
                data.subJudul;

        }

    }
);

</script>

<!-- =====================================================
     LOGOUT
====================================================== -->

<script type="module">

import { auth }
    from "./js/firebase-config.js";

import {
    signOut
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


if (logoutButton) {

    logoutButton.addEventListener(
        "click",
        async () => {

            const yakin =
                confirm(
                    "Apakah kamu yakin ingin logout?"
                );


            if (!yakin) return;


            try {

                await signOut(auth);


                window.location.replace(
                    "login.html"
                );


            } catch (error) {

                console.error(
                    "Logout gagal:",
                    error
                );


                alert(
                    "Logout gagal. Silakan coba lagi."
                );

            }

        }
    );

}

</script>

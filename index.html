<!-- =====================================================
     TEMA AWAL
====================================================== -->

<script>
(function () {
    try {
        const data =
            JSON.parse(
                localStorage.getItem("pengaturanAplikasi")
            ) || {};

        const tema = data.tema || "light";

        let dark = false;

        if (tema === "dark") {
            dark = true;
        } else if (tema === "system") {
            dark =
                window.matchMedia(
                    "(prefers-color-scheme: dark)"
                ).matches;
        }

        if (dark) {
            document.documentElement.classList.add("dark-mode");
        }

    } catch (error) {
        console.warn(
            "Tema awal tidak dapat dibaca:",
            error
        );
    }
})();
</script>

</div><!-- =====================================================
     FIREBASE DASHBOARD
====================================================== --><script type="module">

import {
    db
} from "./firebase-config.js";

import {
    collection,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =====================================================
   ELEMENT
===================================================== */

const totalMasukElement =
    document.getElementById("totalMasuk");

const totalKeluarElement =
    document.getElementById("totalKeluar");

const totalSaldoElement =
    document.getElementById("totalSaldo");

const filterElement =
    document.getElementById("filterKategori");


/* =====================================================
   DATA
===================================================== */

let semuaPemasukan = [];

let semuaPengeluaran = [];


/* =====================================================
   FORMAT RUPIAH
===================================================== */

function rupiah(nilai) {

    const angka =
        Number(nilai) || 0;

    return (
        "Rp " +
        angka.toLocaleString("id-ID")
    );
}


/* =====================================================
   AMBIL NOMINAL
===================================================== */

function ambilNominal(data) {

    const nilai =
        data.nominal ??
        data.jumlah ??
        data.total ??
        data.harga ??
        0;

    if (typeof nilai === "number") {
        return nilai;
    }

    if (typeof nilai === "string") {

        const bersih =
            nilai
                .replace(/Rp/gi, "")
                .replace(/\s/g, "")
                .replace(/\./g, "")
                .replace(/,/g, "");

        const angka =
            Number(bersih);

        return Number.isFinite(angka)
            ? angka
            : 0;
    }

    return 0;
}


/* =====================================================
   AMBIL KATEGORI
===================================================== */

function ambilKategori(data) {

    return String(
        data.kategori ??
        data.jenis ??
        data.category ??
        ""
    ).trim();
}


/* =====================================================
   HITUNG DASHBOARD
===================================================== */

function hitungDashboard() {

    const filter =
        filterElement
            ? filterElement.value
            : "Semua";


    let pemasukan =
        semuaPemasukan;

    let pengeluaran =
        semuaPengeluaran;


    if (filter !== "Semua") {

        pemasukan =
            pemasukan.filter(
                function (item) {

                    return (
                        ambilKategori(item)
                            .toLowerCase()
                        ===
                        filter.toLowerCase()
                    );

                }
            );


        pengeluaran =
            pengeluaran.filter(
                function (item) {

                    return (
                        ambilKategori(item)
                            .toLowerCase()
                        ===
                        filter.toLowerCase()
                    );

                }
            );

    }


    let totalMasuk = 0;

    pemasukan.forEach(
        function (item) {

            totalMasuk +=
                ambilNominal(item);

        }
    );


    let totalKeluar = 0;

    pengeluaran.forEach(
        function (item) {

            totalKeluar +=
                ambilNominal(item);

        }
    );


    const saldo =
        totalMasuk -
        totalKeluar;


    if (totalMasukElement) {

        totalMasukElement.textContent =
            rupiah(totalMasuk);

    }


    if (totalKeluarElement) {

        totalKeluarElement.textContent =
            rupiah(totalKeluar);

    }


    if (totalSaldoElement) {

        totalSaldoElement.textContent =
            rupiah(saldo);

    }

}


/* =====================================================
   FIRESTORE PEMASUKAN
===================================================== */

onSnapshot(

    collection(
        db,
        "payments"
    ),

    function (snapshot) {

        semuaPemasukan = [];

        snapshot.forEach(
            function (item) {

                semuaPemasukan.push(
                    item.data()
                );

            }
        );


        console.log(
            "Dashboard pemasukan:",
            semuaPemasukan.length
        );


        hitungDashboard();

    },

    function (error) {

        console.error(
            "Gagal membaca payments:",
            error
        );

        if (totalMasukElement) {

            totalMasukElement.textContent =
                "Rp 0";

        }

        hitungDashboard();

    }

);


/* =====================================================
   FIRESTORE PENGELUARAN
===================================================== */

onSnapshot(

    collection(
        db,
        "expenses"
    ),

    function (snapshot) {

        semuaPengeluaran = [];

        snapshot.forEach(
            function (item) {

                semuaPengeluaran.push(
                    item.data()
                );

            }
        );


        console.log(
            "Dashboard pengeluaran:",
            semuaPengeluaran.length
        );


        hitungDashboard();

    },

    function (error) {

        console.error(
            "Gagal membaca expenses:",
            error
        );

        if (totalKeluarElement) {

            totalKeluarElement.textContent =
                "Rp 0";

        }

        hitungDashboard();

    }

);


/* =====================================================
   FILTER
===================================================== */

if (filterElement) {

    filterElement.addEventListener(
        "change",
        hitungDashboard
    );

}

</script><!-- =====================================================
     LOGO DASHBOARD
====================================================== --><script>

(function () {

    /*
     * Karena file logo berada di ROOT repository,
     * bukan di folder assets.
     */

    const LOGO_DEFAULT =
        "logo-catatan-kas.jpg";


    function tampilkanLogoDashboard() {

        const logo =
            document.getElementById(
                "logoDashboard"
            );


        if (!logo) {
            return;
        }


        let savedLogo = null;


        try {

            savedLogo =
                localStorage.getItem(
                    "logoDashboard"
                );

        } catch (error) {

            console.warn(
                "Gagal membaca logo:",
                error
            );

        }


        /*
         * Jika ada logo dari Pengaturan,
         * gunakan logo tersebut.
         *
         * Jika tidak ada,
         * gunakan logo bawaan di ROOT.
         */

        const logoDipakai =
            savedLogo || LOGO_DEFAULT;


        logo.onerror = function () {

            console.warn(
                "Logo tersimpan tidak dapat ditampilkan."
            );


            /*
             * Jangan biarkan gambar rusak.
             */

            if (
                savedLogo &&
                savedLogo !== LOGO_DEFAULT
            ) {

                try {

                    localStorage.removeItem(
                        "logoDashboard"
                    );

                } catch (error) {}

            }


            logo.onerror = null;

            logo.src =
                LOGO_DEFAULT;

        };


        logo.src =
            logoDipakai;

    }


    tampilkanLogoDashboard();


    document.addEventListener(
        "DOMContentLoaded",
        tampilkanLogoDashboard
    );


    window.addEventListener(
        "pageshow",
        tampilkanLogoDashboard
    );


    window.addEventListener(
        "storage",
        function (event) {

            if (
                event.key ===
                "logoDashboard"
            ) {

                tampilkanLogoDashboard();

            }

        }
    );


    window.muatLogoDashboard =
        tampilkanLogoDashboard;

})();

</script><!-- =====================================================
     INFORMASI PENGATURAN
====================================================== --><script>

(function () {

    function muatInformasiPondok() {

        try {

            const data =
                JSON.parse(
                    localStorage.getItem(
                        "pengaturanAplikasi"
                    )
                ) || {};


            const nama =
                data.namaPondok ||
                "Ribath Madrasah Al-Fattah";


            const subJudul =
                data.subJudul ||
                "Dashboard Keuangan Pondok";


            const namaElement =
                document.getElementById(
                    "namaPondokHeader"
                );


            const subElement =
                document.getElementById(
                    "subJudulHeader"
                );


            if (namaElement) {

                namaElement.textContent =
                    nama;

            }


            if (subElement) {

                subElement.textContent =
                    subJudul;

            }

        } catch (error) {

            console.warn(
                "Gagal memuat pengaturan:",
                error
            );

        }

    }


    muatInformasiPondok();


    document.addEventListener(
        "DOMContentLoaded",
        muatInformasiPondok
    );


    window.addEventListener(
        "pageshow",
        muatInformasiPondok
    );

})();

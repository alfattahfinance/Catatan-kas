 <!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script>(function(){try{const d=JSON.parse(localStorage.getItem('pengaturanAplikasi')||'{}');let t=d.tema||'light';if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);if(t==='dark')document.documentElement.classList.add('dark-mode')}catch(e){}})();</script><meta name="theme-color" content="#198754"><title>Daftar Nama | Catatan keuangan</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/theme.css"><style>html{min-height:100%;background:#d8e2dc}html.dark-mode{background:#121212}body{margin:0;min-height:100vh;padding-bottom:100px;font-family:Arial,Helvetica,sans-serif;color:#212529;background:linear-gradient(135deg,#d8e2dc 0%,#fefae0 100%);transition:background .25s ease,color .25s ease;touch-action:manipulation;-webkit-tap-highlight-color:transparent}html.dark-mode body{background:#121212!important;color:#f1f1f1!important}.mobile-container{width:100%!important;max-width:100%!important;margin:0 auto;padding:20px!important}.ck-topbar,.custom-card{background:rgba(255,255,255,.96);border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:20px}.ck-topbar{display:flex;align-items:center;gap:14px;padding:14px}.ck-logo{width:56px;height:56px;min-width:56px;object-fit:contain;border-radius:14px;background:#fff;border:1px solid #eee}.ck-title{margin:0;color:#198754;font-weight:800;font-size:1.1rem}.ck-subtitle{color:#6c757d;font-size:.8rem}.back-btn{display:inline-flex;align-items:center;gap:6px;margin-bottom:15px;text-decoration:none;color:#198754;font-weight:600;touch-action:manipulation}.page-title{color:#212529}.page-title i{color:#198754}.custom-card{border:none;overflow:hidden}.form-label{color:#245d4b}.form-control{border-radius:12px;min-height:46px}.btn-success{border-radius:12px;min-height:46px}.table{margin-bottom:0;--bs-table-bg:transparent;--bs-table-color:#212529;--bs-table-border-color:#dee2e6}.nama-siswa/siswi{font-weight:700}.kelas-siswa/siswi{color:#6c757d}.empty-siswa/siswi{padding:35px 15px!important}.empty-siswa/siswi i{font-size:3rem;opacity:.45}.btn-action{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:none;touch-action:manipulation}.ck-bottom{position:fixed;left:0;right:0;bottom:0;z-index:9999!important;pointer-events:auto!important;background:rgba(255,255,255,.98);border-top:1px solid #dee2e6;box-shadow:0 -3px 15px rgba(0,0,0,.08);padding:6px 8px;touch-action:manipulation}.ck-bottom-inner{width:100%!important;max-width:100%!important;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;pointer-events:auto!important}.ck-bottom a{position:relative;z-index:10000;pointer-events:auto!important;touch-action:manipulation!important;text-decoration:none!important;color:#6c757d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;padding:7px 2px;border-radius:10px}.ck-bottom a i{font-size:1.15rem}.ck-bottom a.active{color:#198754!important;font-weight:700}.ck-bottom a:active{transform:scale(.97)}html.dark-mode .ck-topbar,html.dark-mode .custom-card{background:rgba(30,30,30,.97)!important;color:#f1f1f1!important}html.dark-mode .ck-title,html.dark-mode .page-title,html.dark-mode .page-title i{color:#51cf66!important}html.dark-mode .ck-subtitle,html.dark-mode .text-muted{color:#aaa!important}html.dark-mode .form-label{color:#b9e6ca!important}html.dark-mode .form-control{background:#292929!important;color:#fff!important;border-color:#444!important}html.dark-mode .table{--bs-table-color:#eee!important;--bs-table-border-color:#3b3b3b!important;color:#eee!important}html.dark-mode .table thead,.table-light{--bs-table-bg:#292929!important;--bs-table-color:#eee!important;color:#eee!important}html.dark-mode .ck-bottom{background:rgba(25,25,25,.99)!important;border-top-color:#333!important}html.dark-mode .ck-bottom a{color:#aaa!important}html.dark-mode .ck-bottom a.active{color:#51cf66!important}@media(min-width:768px){.mobile-container{padding-left:35px!important;padding-right:35px!important}.ck-topbar{padding:20px}.ck-logo{width:72px;height:72px;min-width:72px}.ck-title{font-size:1.35rem}.ck-subtitle{font-size:1rem}.form-control,.btn{min-height:52px}.table{font-size:1rem}.ck-bottom{padding:8px 25px}.ck-bottom a{font-size:.8rem;padding:8px 4px}.ck-bottom a i{font-size:1.35rem}}</style></head><body><div class="container-fluid mobile-container py-3"><div class="ck-topbar"><img id="logoPreviewV2" src="Photoroom_20260812_224807.png" class="ck-logo" alt="Logo Catatan Kas"><div><p class="ck-title">Catatan Keuangan</p><span class="ck-subtitle" id="namaSekolahHeader">nama sekolah</span></div></div><a href="index.html" class="back-btn"><i class="bi bi-arrow-left"></i>Kembali</a><div class="mb-3"><h4 class="fw-bold mb-0 page-title"><i class="bi bi-people-fill"></i> Daftar Nama</h4><small class="text-muted">Kelola daftar nama</small></div><div class="card custom-card"><div class="card-body"><h5 class="fw-bold mb-3 text-success">Tambah Nama Baru</h5><div class="mb-3"><label class="form-label fw-semibold" for="namaSantri">Nama Lengkap / Keterangan</label><input type="text" class="form-control" id="namaSiswa/Siswi" placeholder="Masukkan nama" autocomplete="name"></div><div class="mb-3"><label class="form-label fw-semibold" for="kelasSantri">Kelas / Keterangan</label><input type="text" class="form-control" id="kelasSantri" placeholder="Contoh: 1 Ula / 7 A"></div><div class="mb-3"><label class="form-label fw-semibold" for="hpSantri">No. HP / Telepon</label><input type="tel" class="form-control" id="hpSiswa/Siswi" placeholder="Contoh: 08***********" autocomplete="tel" inputmode="tel"></div><button type="button" class="btn btn-success w-100 py-2 fw-bold" id="btnSimpanNama/Keterangan"><i class="bi bi-plus-circle"></i> Tambah Nama/Keterangan</button></div></div><div class="card custom-card"><div class="card-body"><div class="d-flex justify-content-between align-items-center mb-3"><div><h5 class="fw-bold mb-0 text-success">Daftar Nama</h5><small class="text-muted" id="jumlahSiswa/Siswi">0 nama/keterangan</small></div><i class="bi bi-people-fill text-success fs-4"></i></div><div class="table-responsive"><table class="table table-hover align-middle" id="tabelSantri"><thead class="table-light"><tr><th>No</th><th>Nama/Keterangan</th><th>Kelas</th><th class="text-center">Aksi</th></tr></thead><tbody id="tbodySiswa/Siswi"><tr><td colspan="4" class="text-center text-muted py-4">Memuat...</td></tr></tbody></table></div></div></div></div><div class="ck-bottom"><div class="ck-bottom-inner"><a href="index.html"><i class="bi bi-house-fill"></i><span>Beranda</span></a><a href="siswa-siswi.html" class="active" aria-current="page"><i class="bi bi-people-fill"></i><span>Daftar Nama/Keterangan</span></a><a href="pembayaran.html"><i class="bi bi-cash-stack"></i><span>Masuk</span></a><a href="pengeluaran.html"><i class="bi bi-wallet2"></i><span>Keluar</span></a><a href="laporan.html"><i class="bi bi-bar-chart-fill"></i><span>Laporan</span></a></div></div><script src="theme.js"></script><script>document.addEventListener('DOMContentLoaded',function(){try{const p=JSON.parse(localStorage.getItem('pengaturanAplikasi')||'{}');const h=document.getElementById('namaSekolahHeader');if(h&&p.namaSekolah)h.textContent=p.namaSekolah}catch(e){}const logo=document.getElementById('logoPreviewV2');if(logo){const saved=localStorage.getItem('logoDashboard');if(saved)logo.src=saved;logo.onerror=function(){localStorage.removeItem('logoDashboard');logo.src='Photoroom_20260812_224807.png'}}tampilkanSiswa_Siswi();const tombol=document.getElementById('btnSimpanSiswa/Siswi');if(tombol)tombol.addEventListener('click',simpanNama)});function ambilNama(){try{const d=JSON.parse(localStorage.getItem('daftarNama/Keterangan')||'null');return Array.isArray(d)?d:[]}catch(e){return[]}}function simpanNama_Keterangan(){const n=document.getElementById('namaSiswa/Siswi'),k=document.getElementById('kelasSiswa/Siswi'),h=document.getElementById('hpSantri');const nama=n.value.trim(),kelas=k.value.trim(),hp=h.value.trim();if(!nama/keterangan){alert('Nama/keterangan belum diisi.');n.focus();return}if(!kelas){alert('Kelas / keterangan belum diisi.');k.focus();return}const d=ambilNama_Keterangan();if(d.some(x=>String(x.nama||'').trim().toLowerCase()===nama.toLowerCase())){alert('Nama tersebut sudah terdaftar.');return}d.push({id:Date.now(),nama_keterangan,kelas,hp});localStorage.setItem('daftarNama/Keterangan',JSON.stringify(d));n.value='';k.value='';h.value='';tampilkanNama_Keterangan();alert('✅ Nama berhasil ditambahkan.')}function tampilkanNama_Keterangan(){const tbody=document.getElementById('tbodySiswa/Siswi'),jumlah=document.getElementById('jumlahSiswa/Siswi');if(!tbody)return;const d=ambilNama_Keterangan();if(jumlah)jumlah.textContent=d.length+' nama/keterangan';if(!d.length){tbody.innerHTML='<tr><td colspan="4" class="text-center text-muted empty-Siswa/Siswi py-4"><i class="bi bi-people d-block mb-2"></i><strong>Belum ada daftar nama/keterangan</strong><br><small>Silakan tambahkan nama/keterangan baru.</small></td></tr>';return}tbody.innerHTML='';d.forEach((item,index)=>{const tr=document.createElement('tr');const nama=escapeHtml(item.nama||'-'),kelas=escapeHtml(item.kelas||'-'),hp=escapeHtml(item.hp||'');tr.innerHTML='<td>'+(index+1)+'</td><td><div class="nama-siswa-siswi">'+nama/Keterangan+'</div>'+(hp?'<small class="text-muted"><i class="bi bi-telephone"></i> '+hp+'</small>':'')+'</td><td><span class="kelas-Siswa/Siswi">'+kelas+'</span></td><td class="text-center"><button type="button" class="btn btn-outline-primary btn-action me-1" title="Edit" onclick="editNama_Keterangan('+index+')"><i class="bi bi-pencil"></i></button><button type="button" class="btn btn-outline-danger btn-action" title="Hapus" onclick="hapusNama_Keterangan('+index+')"><i class="bi bi-trash"></i></button></td>';tbody.appendChild(tr)})}function editNama_Keterangan(i){const d=ambilNama();if(!d[i])return;const x=d[i],n=prompt('Nama Lengkap:',x.nama||'');if(n===null)return;if(!n.trim()){alert('Nama/Keterangan tidak boleh kosong.');return}const k=prompt('Kelas / Keterangan:',x.kelas||'');if(k===null)return;if(!k.trim()){alert('Kelas / Keterangan tidak boleh kosong.');return}const h=prompt('No. HP / Telepon:',x.hp||'');if(h===null)return;x.nama=n.trim();x.kelas=k.trim();x.hp=h.trim();localStorage.setItem('daftarNama',JSON.stringify(d));tampilkanSantri();alert('✅ Data berhasil diperbarui.')}function hapusSantri(i){const d=ambilSantri();if(!d[i])return;if(!confirm('Hapus data ini?'))return;d.splice(i,1);localStorage.setItem('daftarNama',JSON.stringify(d));tampilkanNama();alert('🗑️ Data berhasil dihapus.')}function escapeHtml(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script></body></html>

<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#198754"><title>Daftar Nama | Catatan Kas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css"><style>body{min-height:100vh;padding-bottom:100px}.mobile-container{width:100%;max-width:100%;padding:20px}.ck-topbar,.custom-card{background:rgba(255,255,255,.96);border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:20px}.ck-topbar{display:flex;align-items:center;gap:14px;padding:14px}.ck-logo{width:56px;height:56px;object-fit:contain;border-radius:14px}.ck-title{margin:0;color:#198754;font-weight:800;font-size:1.1rem}.ck-subtitle{color:#6c757d;font-size:.8rem}.back-btn{display:inline-flex;align-items:center;gap:6px;margin-bottom:15px;text-decoration:none;color:#198754;font-weight:600}.form-control{border-radius:12px;min-height:46px}.btn-success{border-radius:12px;min-height:46px}.btn-action{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px}.ck-bottom{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:rgba(255,255,255,.98);border-top:1px solid #dee2e6;padding:6px 8px}.ck-bottom-inner{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.ck-bottom a{color:#6c757d;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;padding:7px 2px}.ck-bottom a i{font-size:1.15rem}.ck-bottom a.active{color:#198754;font-weight:700}html.dark-mode .ck-topbar,html.dark-mode .custom-card{background:#1e1e1e!important;color:#f1f1f1!important}html.dark-mode .ck-bottom{background:#191919!important;border-color:#333}html.dark-mode .ck-bottom a{color:#aaa}html.dark-mode .ck-bottom a.active{color:#51cf66}@media(min-width:768px){.mobile-container{padding-left:35px;padding-right:35px}.ck-logo{width:72px;height:72px}.ck-title{font-size:1.35rem}}
/* Pastikan Daftar Nama mengikuti tema global, termasuk mode Ikuti Sistem/Ponsel. */
html.dark-mode body,html[data-theme="dark"] body{background:#121212!important;color:#f1f1f1!important}html.dark-mode .ck-topbar,html.dark-mode .custom-card,html[data-theme="dark"] .ck-topbar,html[data-theme="dark"] .custom-card{background:#1e1e1e!important;color:#f1f1f1!important;border-color:#333!important}html.dark-mode .page-title,html[data-theme="dark"] .page-title{color:#f1f1f1!important}html.dark-mode .form-label,html[data-theme="dark"] .form-label{color:#b9e6ca!important}html.dark-mode .form-control,html[data-theme="dark"] .form-control{background:#292929!important;color:#fff!important;border-color:#444!important}html.dark-mode .table,html[data-theme="dark"] .table{--bs-table-color:#eee!important;--bs-table-border-color:#3b3b3b!important;color:#eee!important}html.dark-mode .table-light,html[data-theme="dark"] .table-light{--bs-table-bg:#292929!important;--bs-table-color:#eee!important;color:#eee!important}html.dark-mode .text-muted,html[data-theme="dark"] .text-muted{color:#aaa!important}html.dark-mode .ck-bottom,html[data-theme="dark"] .ck-bottom{background:#191919!important;border-color:#333!important}html.dark-mode .ck-bottom a,html[data-theme="dark"] .ck-bottom a{color:#aaa!important}html.dark-mode .ck-bottom a.active,html[data-theme="dark"] .ck-bottom a.active{color:#51cf66!important}
</style></head><body><div class="mobile-container"><div class="ck-topbar"><img id="logoPreviewV2" class="ck-logo" src="Photoroom_20260812_224807.png?v=20260826" alt="Logo Catatan Kas"><div><p class="ck-title">Catatan Keuangan</p><span class="ck-subtitle" id="namaSekolahHeader">nama sekolah</span></div></div><a href="index.html" class="back-btn"><i class="bi bi-arrow-left"></i>Kembali</a><div class="mb-3"><h4 class="fw-bold mb-0 page-title"><i class="bi bi-people-fill text-success"></i> Daftar Nama</h4><small class="text-muted">Kelola daftar nama</small></div><div class="card custom-card"><div class="card-body"><h5 class="fw-bold mb-3 text-success">Tambah Nama Baru</h5><div class="mb-3"><label class="form-label fw-semibold" for="namaSiswaSiswi">Nama Lengkap / Keterangan</label><input type="text" class="form-control" id="namaSiswaSiswi" placeholder="Masukkan nama" autocomplete="off"></div><div class="mb-3"><label class="form-label fw-semibold" for="kelasSantri">Kelas / Keterangan</label><input type="text" class="form-control" id="kelasSantri" placeholder="Contoh: 1 Ula / 7 A"></div><div class="mb-3"><label class="form-label fw-semibold" for="hpSantri">No. HP / Telepon</label><input type="tel" class="form-control" id="hpSantri" placeholder="Contoh: 08***********" autocomplete="tel" inputmode="tel"></div><button type="button" class="btn btn-success w-100 fw-bold" id="btnSimpanNama"><i class="bi bi-plus-circle"></i> Tambah Nama</button></div></div><div class="card custom-card"><div class="card-body"><div class="d-flex justify-content-between align-items-center mb-3"><div><h5 class="fw-bold mb-0 text-success">Daftar Nama</h5><small class="text-muted" id="jumlahSiswaSiswi">0 nama</small></div><i class="bi bi-people-fill text-success fs-4"></i></div><div class="table-responsive"><table class="table table-hover align-middle"><thead class="table-light"><tr><th>No</th><th>Nama/Keterangan</th><th>Kelas</th><th class="text-center">Aksi</th></tr></thead><tbody id="tbodySiswaSiswi"><tr><td colspan="4" class="text-center text-muted py-4">Memuat...</td></tr></tbody></table></div></div></div></div><nav class="ck-bottom"><div class="ck-bottom-inner"><a href="index.html"><i class="bi bi-house-fill"></i><span>Beranda</span></a><a href="siswa-siswi.html" class="active"><i class="bi bi-people-fill"></i><span>Daftar Nama</span></a><a href="pemasukan.html"><i class="bi bi-cash-stack"></i><span>Masuk</span></a><a href="pengeluaran.html"><i class="bi bi-wallet2"></i><span>Keluar</span></a><a href="laporan.html"><i class="bi bi-bar-chart-fill"></i><span>Laporan</span></a></div></nav><script src="theme.js"></script><script src="logo-sync.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{try{const p=JSON.parse(localStorage.getItem('pengaturanAplikasi')||'{}');if(p.namaSekolah)document.getElementById('namaSekolahHeader').textContent=p.namaSekolah}catch(_){}});</script><script type="module">
import {db,auth} from './firebase-config.js';
import {collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot,query,where,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
let user=null,unsub=null,list=[];const $=id=>document.getElementById(id);const key=()=>user?.uid?'daftarNama_'+user.uid:'daftarNama';
function local(){try{const x=JSON.parse(localStorage.getItem(key())||'[]');return Array.isArray(x)?x:[]}catch(_){return[]}}function save(x){try{localStorage.setItem(key(),JSON.stringify(x))}catch(_){} }
function norm(x){return{id:x.id||'',nama:String(x.nama||x.namaSiswaSiswi||x.namaSiswa||x.nama_siswa_siswi||x.keterangan||'').trim(),kelas:String(x.kelas||x.kelasSantri||'').trim(),hp:String(x.hp||x.noHp||x.telepon||'').trim(),uid:x.uid||user?.uid||''}}
function render(){const tb=$('tbodySiswaSiswi');if(!tb)return;$('jumlahSiswaSiswi').textContent=list.length+' nama';if(!list.length){tb.innerHTML='<tr><td colspan="4" class="text-center text-muted py-4"><i class="bi bi-people d-block mb-2" style="font-size:3rem;opacity:.45"></i><strong>Belum ada daftar nama</strong></td></tr>';return}tb.innerHTML='';list.forEach((x,i)=>{const tr=document.createElement('tr');const a=document.createElement('td');a.textContent=i+1;const b=document.createElement('td');const strong=document.createElement('div');strong.className='fw-bold';strong.textContent=x.nama||'-';b.appendChild(strong);if(x.hp){const sm=document.createElement('small');sm.className='text-muted';sm.textContent=x.hp;b.appendChild(sm)}const c=document.createElement('td');c.textContent=x.kelas||'-';const d=document.createElement('td');d.className='text-center';const e=document.createElement('button');e.className='btn btn-outline-primary btn-action me-1';e.innerHTML='<i class="bi bi-pencil"></i>';e.onclick=()=>edit(i);const h=document.createElement('button');h.className='btn btn-outline-danger btn-action';h.innerHTML='<i class="bi bi-trash"></i>';h.onclick=()=>remove(i);d.append(e,h);tr.append(a,b,c,d);tb.appendChild(tr)});window.dispatchEvent(new CustomEvent('daftarNamaBerubah',{detail:{nama:list,uid:user?.uid||null}}))}
async function add(){if(!user)return alert('Silakan login terlebih dahulu.');const n=$('namaSiswaSiswi'),k=$('kelasSantri'),p=$('hpSantri'),nama=n.value.trim(),kelas=k.value.trim(),hp=p.value.trim();if(!nama)return alert('Nama belum diisi.');if(!kelas)return alert('Kelas / keterangan belum diisi.');if(list.some(x=>x.nama.toLowerCase()===nama.toLowerCase()))return alert('Nama tersebut sudah terdaftar.');const data={nama,namaSiswaSiswi:nama,namaSiswa:nama,nama_siswa_siswi:nama,keterangan:nama,kelas,kelasSantri:kelas,hp,uid:user.uid,akunEmail:user.email||'',createdAt:serverTimestamp(),updatedAt:serverTimestamp()};try{const r=await addDoc(collection(db,'santri'),data);list.push({...norm(data),id:r.id});save(list);render();n.value=k.value=p.value='';alert('✅ Nama berhasil disimpan.')}catch(e){console.error(e);list.push({...norm(data),id:'local_'+Date.now()});save(list);render();n.value=k.value=p.value='';alert('Nama disimpan di perangkat. Firebase belum dapat dihubungi.')}}
async function edit(i){const x=list[i];if(!x)return;const nama=prompt('Nama Lengkap / Keterangan:',x.nama);if(nama===null)return;if(!nama.trim())return alert('Nama tidak boleh kosong.');const kelas=prompt('Kelas / Keterangan:',x.kelas);if(kelas===null)return;if(!kelas.trim())return alert('Kelas / keterangan tidak boleh kosong.');const hp=prompt('No. HP / Telepon:',x.hp||'');if(hp===null)return;const n={...x,nama:nama.trim(),kelas:kelas.trim(),hp:hp.trim()};try{if(!String(x.id).startsWith('local_'))await updateDoc(doc(db,'santri',x.id),{nama:n.nama,namaSiswaSiswi:n.nama,namaSiswa:n.nama,nama_siswa_siswi:n.nama,keterangan:n.nama,kelas:n.kelas,kelasSantri:n.kelas,hp:n.hp,updatedAt:serverTimestamp()});list[i]=n;save(list);render();alert('✅ Data berhasil diperbarui.')}catch(e){alert('Gagal memperbarui data di Firebase.')}}
async function remove(i){const x=list[i];if(!x||!confirm('Hapus data ini?'))return;try{if(!String(x.id).startsWith('local_'))await deleteDoc(doc(db,'santri',x.id));list.splice(i,1);save(list);render()}catch(e){alert('Gagal menghapus data dari Firebase.')}}
function start(){unsub?.();list=local().map(norm).filter(x=>x.nama);render();if(!user)return;unsub=onSnapshot(query(collection(db,'santri'),where('uid','==',user.uid)),s=>{const remote=s.docs.map(d=>norm({id:d.id,...d.data()}));const m=new Map();remote.forEach(x=>m.set(x.id,x));list.forEach(x=>{if(!m.has(x.id))m.set(x.id,x)});list=[...m.values()].filter(x=>x.nama).sort((a,b)=>a.nama.localeCompare(b.nama,'id'));save(list);render()},e=>console.error('Daftar Nama Firebase:',e))}
$('btnSimpanNama').addEventListener('click',add);onAuthStateChanged(auth,u=>{user=u||null;start()});
</script></body></html>

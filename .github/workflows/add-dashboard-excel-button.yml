name: Add Dashboard Excel Button

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-button:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Dashboard Excel button to main dashboard
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'dashboard-excel-button'
          if marker in s:
              print('Dashboard Excel button already exists.')
              raise SystemExit(0)

          anchor = '''    <div class="col-6">\n\n        <a\n            href="laporan.html"'''
          button = '''    <!-- dashboard-excel-button -->\n    <div class="col-6">\n\n        <a\n            href="dashboard-excel.html"\n            class="menu-btn"\n            aria-label="Dashboard Excel"\n        >\n\n            <i class="bi bi-file-earmark-spreadsheet-fill"></i>\n\n            <h6>\n                Dashboard Excel\n            </h6>\n\n        </a>\n\n    </div>\n\n\n'''
          if anchor not in s:
              raise SystemExit('Anchor menu Laporan Keuangan tidak ditemukan.')
          s = s.replace(anchor, button + anchor, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit button
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Tambahkan tombol Dashboard Excel ke dashboard utama [skip ci]"
            git push
          fi

name: Apply account scope patch

on:
  push:
    branches:
      - feature/multi-akun-data-isolation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[scope-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch santri account query
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('santri.js')
          s=p.read_text(encoding='utf-8')
          old='import { collection, addDoc, getDocs, updateDoc, deleteDoc, doc, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";'
          new='import { collection, addDoc, getDocs, updateDoc, deleteDoc, doc, serverTimestamp, writeBatch, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";'
          if old in s:
              s=s.replace(old,new,1)
          old2='const snapshot = await getDocs(collection(db, "santri"));'
          new2='const snapshot = await getDocs(query(collection(db, "santri"), where("uid", "==", auth.currentUser.uid)));'
          if old2 in s:
              s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit scoped santri patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add -- santri.js
          git commit -m "Fix santri account-scoped lookup [scope-patch]"
          git push

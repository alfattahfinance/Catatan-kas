name: Build Catatan Kas APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Keuangan APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 - <<'PY'
          import json
          with open('version.json', encoding='utf-8') as f:
              print(json.load(f).get('version', '2.4'))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Create Android project structure
        shell: bash
        run: mkdir -p app/src/main/java/com/catatankas/app app/src/main/res/values app/src/main/res/drawable app/src/main/assets
      - name: Create Gradle project
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'Keuangan'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
      - name: Create app Gradle configuration
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION_CODE=$(python3 - <<'PY'
          import os
          raw=os.environ.get('APP_VERSION','2.4').lstrip('v')
          nums=[]
          for p in raw.split('.'):
              try: nums.append(int(p))
              except: nums.append(0)
          while len(nums)<3: nums.append(0)
          print(nums[0]*10000+nums[1]*100+nums[2])
          PY
          )
          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace 'com.catatankas.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.catatankas.app'
                  minSdk 23
                  targetSdk 35
                  versionCode ${VERSION_CODE}
                  versionName '${APP_VERSION}'
              }
              buildTypes { release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'androidx.activity:activity:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.13.0'
          }
          EOF
          printf '%s\n' '# No custom rules.' > app/proguard-rules.pro
      - name: Copy web application
        shell: bash
        run: |
          set -euo pipefail
          for f in *.html *.js *.css *.json *.png *.jpg *.jpeg; do [ -f "$f" ] && cp "$f" app/src/main/assets/ || true; done
          for d in js css assets images img; do [ -d "$d" ] && cp -r "$d" app/src/main/assets/ || true; done
      - name: Create Android resources
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#198754</item><item name="android:navigationBarColor">#121212</item><item name="android:statusBarColor">#121212</item></style></resources>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#198754" android:pathData="M0,0L108,0L108,108L0,108Z"/><path android:fillColor="#FFFFFF" android:pathData="M27,27L81,27L81,81L27,81Z"/></vector>
          EOF
      - name: Create Android manifest and activity
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:allowBackup="true" android:usesCleartextTraffic="true" android:label="Keuangan" android:theme="@style/AppTheme" android:icon="@drawable/ic_launcher" android:resizeableActivity="false">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="unspecified" android:resizeableActivity="false" android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/catatankas/app/MainActivity.java <<'EOF'
          package com.catatankas.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            private WebView webView;
            @Override public void onCreate(Bundle b) {
              super.onCreate(b); webView=new WebView(this); webView.setLayoutParams(new ViewGroup.LayoutParams(-1,-1)); setContentView(webView);
              WebSettings s=webView.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setUseWideViewPort(false); s.setLoadWithOverviewMode(false); s.setSupportZoom(false); s.setBuiltInZoomControls(false); s.setDisplayZoomControls(false);
              webView.setWebViewClient(new WebViewClient()); webView.setWebChromeClient(new WebChromeClient()); webView.loadUrl("file:///android_asset/index.html");
            }
            @Override public void onBackPressed(){ if(webView!=null&&webView.canGoBack())webView.goBack();else super.onBackPressed(); }
            @Override protected void onDestroy(){if(webView!=null)webView.destroy();super.onDestroy();}
          }
          EOF
      - name: Build Debug APK
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Prepare APK artifact
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/Keuangan-v${APP_VERSION}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keuangan-v${{ steps.version.outputs.version }}
          path: output/Keuangan-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

# FINAL BUILD VERIFICATION TRIGGER

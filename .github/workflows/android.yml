name: Build Catatan Kas APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "MENYIAPKAN PROJECT ANDROID CATATAN KAS"
          echo "======================================"

          mkdir -p app/src/main/java/com/catatankas/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # ----------------------------------
          # settings.gradle
          # ----------------------------------

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CatatanKas"
          include(":app")
          EOF

          # ----------------------------------
          # build.gradle
          # ----------------------------------

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          # ----------------------------------
          # app/build.gradle
          # ----------------------------------

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.catatankas.app"
              compileSdk 35

              defaultConfig {
                  applicationId "com.catatankas.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }

          dependencies {
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "androidx.webkit:webkit:1.12.1"
          }
          EOF

          # ----------------------------------
          # gradle.properties
          # ----------------------------------

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # ----------------------------------
          # MainActivity
          # ----------------------------------

          if [ ! -f MainActivity.java ]; then
            echo "ERROR: MainActivity.java tidak ditemukan!"
            exit 1
          fi

          cp MainActivity.java \
            app/src/main/java/com/catatankas/app/MainActivity.java

          # ----------------------------------
          # AndroidManifest
          # ----------------------------------

          if [ ! -f AndroidManifest.xml ]; then
            echo "ERROR: AndroidManifest.xml tidak ditemukan!"
            exit 1
          fi

          cp AndroidManifest.xml \
            app/src/main/AndroidManifest.xml

          # ----------------------------------
          # styles.xml
          # ----------------------------------

          if [ -f styles.xml ]; then
            cp styles.xml \
              app/src/main/res/values/styles.xml
          fi

          # ----------------------------------
          # HTML
          # ----------------------------------

          echo "Menyalin file HTML..."

          find . -maxdepth 1 -type f \
            \( -name "*.html" -o -name "*.htm" \) \
            -exec cp {} app/src/main/assets/ \;

          # ----------------------------------
          # JavaScript
          # ----------------------------------

          if [ -d js ]; then
            echo "Menyalin folder js..."
            cp -R js app/src/main/assets/
          fi

          # ----------------------------------
          # CSS
          # ----------------------------------

          if [ -d css ]; then
            echo "Menyalin folder css..."
            cp -R css app/src/main/assets/
          fi

          # ----------------------------------
          # ASSETS
          # PENTING:
          # folder assets dipertahankan namanya
          # ----------------------------------

          if [ -d assets ]; then
            echo "Menyalin folder assets..."
            cp -R assets app/src/main/assets/
          else
            echo "Folder assets belum ada."
            mkdir -p app/src/main/assets/assets
          fi

          # ----------------------------------
          # LOGO ROOT
          # Jika logo berada di root repository,
          # masukkan ke assets/assets/
          # ----------------------------------

          if [ -f logo-catatan-kas.png ]; then
            echo "Logo PNG ditemukan di root."
            cp logo-catatan-kas.png \
              app/src/main/assets/assets/logo-catatan-kas.png
          fi

          if [ -f logo-catatan-kas.jpg ]; then
            echo "Logo JPG ditemukan di root."

            # Simpan juga versi JPG
            cp logo-catatan-kas.jpg \
              app/src/main/assets/assets/logo-catatan-kas.jpg
          fi

          # ----------------------------------
          # CEK LOGO
          # ----------------------------------

          echo ""
          echo "======================================"
          echo "PEMERIKSAAN LOGO"
          echo "======================================"

          if [ -f app/src/main/assets/assets/logo-catatan-kas.png ]; then
            echo "OK: logo-catatan-kas.png ditemukan."
          elif [ -f app/src/main/assets/assets/logo-catatan-kas.jpg ]; then
            echo "OK: logo-catatan-kas.jpg ditemukan."
          else
            echo "PERINGATAN: Logo belum ditemukan!"
          fi

          echo ""
          echo "Isi assets Android:"
          find app/src/main/assets -maxdepth 3 -type f | sort

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "MEMBANGUN APK CATATAN KAS"
          echo "======================================"

          gradle assembleDebug --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"
            exit 1
          fi

          cp "$APK" output/Catatan-Kas-APK.apk

          echo "APK berhasil dibuat:"
          ls -lh output/Catatan-Kas-APK.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Catatan-Kas-APK
          path: output/Catatan-Kas-APK.apk
          if-no-files-found: error

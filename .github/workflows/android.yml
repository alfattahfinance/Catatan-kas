name: Build Catatan Kas APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - '**.json'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Keuangan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 - <<'PY'
          import json
          with open('version.json', encoding='utf-8') as f:
              print(json.load(f).get('version', '2.4'))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/catatankas/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Keuangan"
          include(":app")
          EOF

      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Create app build.gradle
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION_CODE=$(python3 - <<'PY'
          import os
          raw=os.environ.get('APP_VERSION','2.4').lstrip('v')
          parts=[]
          for x in raw.split('.'):
              try: parts.append(int(x))
              except ValueError: parts.append(0)
          while len(parts)<3: parts.append(0)
          print(parts[0]*10000 + parts[1]*100 + parts[2])
          PY
          )
          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace 'com.catatankas.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.catatankas.app'
                  minSdk 23
                  targetSdk 35
                  versionCode ${VERSION_CODE}
                  versionName '${APP_VERSION}'
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.activity:activity:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.13.0'
          }
          EOF

      - name: Create proguard rules
        shell: bash
        run: printf '%s\n' '# No custom ProGuard rules required.' > app/proguard-rules.pro

      - name: Copy application files
        shell: bash
        run: |
          set -euo pipefail
          for file in *.html *.js *.css *.json *.png *.jpg *.jpeg; do
            [ -f "$file" ] && cp "$file" app/src/main/assets/
          done
          [ -d js ] && cp -r js app/src/main/assets/
          [ -d assets ] && cp -r assets app/src/main/assets/
          [ -d images ] && cp -r images app/src/main/assets/
          [ -d img ] && cp -r img app/src/main/assets/

      - name: Inject global UI and landscape CSS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/assets')
          theme_tag = '<script src="theme.js"></script>'
          general_tag = '<script src="js/general-ui.js"></script>'
          css = '''\n/* APK responsive landscape fix */\nhtml, body { width:100% !important; min-width:100% !important; max-width:none !important; }\nbody { overflow-x:hidden !important; }\n.mobile-container, .page-container, .ck-page, .wrap, .container, .container-fluid { width:100% !important; max-width:none !important; min-width:0 !important; margin-left:auto !important; margin-right:auto !important; }\n@media (orientation: landscape) and (min-width:700px) {\n  .mobile-container, .page-container, .ck-page, .wrap, .container, .container-fluid { padding-left:24px !important; padding-right:24px !important; }\n  .ck-topbar, .custom-card, .pengeluaran-card, .cardx { width:100% !important; max-width:none !important; }\n}\n'''
          for p in root.glob('*.html'):
              text = p.read_text(encoding='utf-8')
              if 'src="theme.js"' not in text and "src='theme.js'" not in text:
                  text = text.replace('</head>', f'{theme_tag}\n</head>', 1)
              if 'src="js/general-ui.js"' not in text and "src='js/general-ui.js'" not in text:
                  text = text.replace('</head>', f'{general_tag}\n</head>', 1)
              if 'APK responsive landscape fix' not in text:
                  text = text.replace('</head>', f'<style>{css}</style>\n</head>', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Copy Catatan Kas logo
        shell: bash
        run: |
          if [ -f "logo-catatan-kas.jpg" ]; then cp "logo-catatan-kas.jpg" "app/src/main/res/drawable/logo_catatan_kas.jpg"; fi
          if [ -f "logo-catatan-kas.png" ]; then cp "logo-catatan-kas.png" "app/src/main/res/drawable/logo_catatan_kas.png"; fi

      - name: Create fallback icon
        shell: bash
        run: |
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#198754" android:pathData="M0,0 L108,0 L108,108 L0,108 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M27,27 L81,27 L81,81 L27,81 Z" />
          </vector>
          EOF

      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <supports-screens
                  android:smallScreens="true"
                  android:normalScreens="true"
                  android:largeScreens="true"
                  android:xlargeScreens="true"
                  android:anyDensity="true"
                  android:resizeable="true" />
              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="Keuangan"
                  android:theme="@style/AppTheme"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:resizeableActivity="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified"
                      android:resizeableActivity="false"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create Android styles
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#198754</item>
                  <item name="android:navigationBarColor">#121212</item>
                  <item name="android:statusBarColor">#121212</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

      - name: Create MainActivity.java
        shell: bash
        run: |
          cat > app/src/main/java/com/catatankas/app/MainActivity.java <<'EOF'
          package com.catatankas.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              @SuppressLint("SetJavaScriptEnabled")
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setUseWideViewPort(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }
              @Override protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          find app -type f | sort

      - name: Build Debug APK
        shell: bash
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/Keuangan-v${APP_VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keuangan-v${{ steps.version.outputs.version }}
          path: output/Keuangan-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

name: Build Catatan Kas APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Keuangan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android project structure
        run: |
          mkdir -p app/src/main/java/com/catatankas/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Keuangan"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.catatankas.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.catatankas.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 24
                  versionName '2.4'
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Create proguard rules
        run: |
          cat > app/proguard-rules.pro <<'EOF'
          # No custom ProGuard rules required.
          EOF

      - name: Create Gradle wrapper
        run: |
          gradle --version
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Copy application files
        run: |
          echo "Copying web application files..."
          for file in *.html *.js *.css *.json *.png *.jpg *.jpeg; do
            if [ -f "$file" ]; then
              cp "$file" app/src/main/assets/
            fi
          done
          echo "Assets:"
          find app/src/main/assets -maxdepth 1 -type f -print

      - name: Copy Catatan Kas logo
        run: |
          if [ -f "logo-catatan-kas.jpg" ]; then
            cp "logo-catatan-kas.jpg" "app/src/main/res/drawable/logo_catatan_kas.jpg"
          elif [ -f "logo-catatan-kas.png" ]; then
            cp "logo-catatan-kas.png" "app/src/main/res/drawable/logo_catatan_kas.png"
          fi

      - name: Create fallback icon
        run: |
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#198754" android:pathData="M0,0 L108,0 L108,108 L0,108 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M27,27 L81,27 L81,81 L27,81 Z" />
          </vector>
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="Keuangan"
                  android:theme="@style/AppTheme"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create Android styles
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#198754</item>
                  <item name="android:navigationBarColor">#121212</item>
                  <item name="android:statusBarColor">#121212</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/catatankas/app/MainActivity.java <<'EOF'
          package com.catatankas.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Check Android project
        run: |
          java -version
          ./gradlew --version
          find app -type f | sort

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Keuangan-v2.4.apk
          ls -lh output/Keuangan-v2.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keuangan-v2.4-APK
          path: output/Keuangan-v2.4.apk
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "BUILD KEUANGAN SELESAI"
          echo "Nama aplikasi : Keuangan"
          echo "Version       : 2.4"
          echo "Package       : com.catatankas.app"
          ls -lh output/Keuangan-v2.4.apk

name: Build Catatan Kas APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          echo "Membuat struktur Android..."

          mkdir -p app/src/main/java/com/catatankas/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          echo "Membuat settings.gradle..."

          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            '' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '}' \
            '' \
            'rootProject.name = "CatatanKas"' \
            'include(":app")' \
            > settings.gradle

          echo "Membuat build.gradle..."

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application" version "8.7.3" apply false' \
            '}' \
            > build.gradle

          echo "Membuat app/build.gradle..."

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application"' \
            '}' \
            '' \
            'android {' \
            '    namespace "com.catatankas.app"' \
            '    compileSdk 35' \
            '' \
            '    defaultConfig {' \
            '        applicationId "com.catatankas.app"' \
            '        minSdk 23' \
            '        targetSdk 35' \
            '        versionCode 1' \
            '        versionName "1.0"' \
            '    }' \
            '}' \
            '' \
            'dependencies {' \
            '    implementation "androidx.appcompat:appcompat:1.7.0"' \
            '    implementation "androidx.webkit:webkit:1.12.1"' \
            '}' \
            '' \
            'configurations.all {' \
            '    resolutionStrategy.eachDependency { dependency ->' \
            '        if (dependency.requested.group == "org.jetbrains.kotlin") {' \
            '            dependency.useVersion "1.8.22"' \
            '        }' \
            '    }' \
            '}' \
            > app/build.gradle

          echo "Mengaktifkan AndroidX..."

          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            > gradle.properties

          echo "Menyalin MainActivity..."

          cp MainActivity.java \
            app/src/main/java/com/catatankas/app/MainActivity.java

          echo "Menyalin AndroidManifest..."

          cp AndroidManifest.xml \
            app/src/main/AndroidManifest.xml

          if [ -f styles.xml ]; then
            cp styles.xml app/src/main/res/values/styles.xml
          fi

          echo "Menyalin file HTML..."

          find . -maxdepth 1 -type f \
            \( -name "*.html" -o -name "*.htm" \) \
            -exec cp {} app/src/main/assets/ \;

          echo "Menyalin JavaScript..."

          if [ -d js ]; then
            cp -r js app/src/main/assets/
          fi

          echo "Menyalin CSS..."

          if [ -d css ]; then
            cp -r css app/src/main/assets/
          fi

          echo "Menyalin gambar..."

          if [ -d assets ]; then
            cp -r assets/* app/src/main/assets/ 2>/dev/null || true
          fi


      - name: Prepare Android assets
        run: |
          echo "Menyiapkan folder assets Android..."

          mkdir -p app/src/main/assets

          if [ -d assets ]; then
            echo "Menyalin assets..."
            cp -R assets/. app/src/main/assets/
          fi

          if [ -f logo-catatan-kas.png ]; then
            echo "Logo PNG ditemukan."
            cp logo-catatan-kas.png app/src/main/assets/logo-catatan-kas.png
          elif [ -f logo-catatan-kas.jpg ]; then
            echo "Logo JPG ditemukan."
            cp logo-catatan-kas.jpg app/src/main/assets/logo-catatan-kas.jpg
          else
            echo "Logo belum ditemukan."
          fi

          echo "Isi folder assets:"
          ls -lah app/src/main/assets

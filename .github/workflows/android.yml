name: Build Catatan Kas APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Keuangan APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. SETUP JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ==========================================================
      # 3. SETUP GRADLE
      # ==========================================================

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==========================================================
      # 4. SETUP ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================================
      # 5. INSTALL ANDROID SDK
      # ==========================================================

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================================
      # 6. CREATE ANDROID PROJECT STRUCTURE
      # ==========================================================

      - name: Create Android project structure
        run: |
          mkdir -p app/src/main/java/com/catatankas/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/assets


      # ==========================================================
      # 7. CREATE SETTINGS GRADLE
      # ==========================================================

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Keuangan"
          include(":app")
          EOF


      # ==========================================================
      # 8. CREATE ROOT BUILD GRADLE
      # ==========================================================

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      # ==========================================================
      # 9. CREATE GRADLE PROPERTIES
      # ==========================================================

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF


      # ==========================================================
      # 10. CREATE APP BUILD GRADLE
      # ==========================================================

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.catatankas.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.catatankas.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 24
                  versionName '2.4'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF


      # ==========================================================
      # 11. CREATE PROGUARD FILE
      # ==========================================================

      - name: Create proguard rules
        run: |
          cat > app/proguard-rules.pro <<'EOF'
          # Catatan Kas / Keuangan
          # No custom ProGuard rules required.
          EOF


      # ==========================================================
      # 12. COPY WEBSITE FILES TO ANDROID ASSETS
      # ==========================================================

      - name: Copy application files
        run: |
          echo "Copying Catatan Kas web application..."

          for file in index.html; do
            if [ -f "$file" ]; then
              cp "$file" app/src/main/assets/
            fi
          done

          for file in *.html; do
            if [ -f "$file" ]; then
              cp "$file" app/src/main/assets/
            fi
          done

          for file in *.js; do
            if [ -f "$file" ]; then
              cp "$file" app/src/main/assets/
            fi
          done

          for file in *.css; do
            if [ -f "$file" ]; then
              cp "$file" app/src/main/assets/
            fi
          done

          for file in *.json; do
            if [ -f "$file" ]; then
              cp "$file" app/src/main/assets/
            fi
          done

          for file in *.png; do
            if [ -f "$file" ]; then
              cp "$file" app/src/main/assets/
            fi
          done

          for file in *.jpg; do
            if [ -f "$file" ]; then
              cp "$file" app/src/main/assets/
            fi
          done

          for file in *.jpeg; do
            if [ -f "$file" ]; then
              cp "$file" app/src/main/assets/
            fi
          done

          echo "Files copied:"
          find app/src/main/assets -maxdepth 1 -type f -print


      # ==========================================================
      # 13. COPY LOGO
      # ==========================================================

      - name: Copy Catatan Kas logo
        run: |
          if [ -f "logo-catatan-kas.jpg" ]; then
            cp "logo-catatan-kas.jpg" \
              "app/src/main/res/drawable/logo_catatan_kas.jpg"
            echo "Logo Catatan Kas ditemukan."
          elif [ -f "logo-catatan-kas.png" ]; then
            cp "logo-catatan-kas.png" \
              "app/src/main/res/drawable/logo_catatan_kas.png"
            echo "Logo Catatan Kas PNG ditemukan."
          else
            echo "Logo tidak ditemukan, menggunakan icon bawaan."
          fi


      # ==========================================================
      # 14. CREATE FALLBACK ICON
      # ==========================================================

      - name: Create fallback icon
        run: |
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#198754"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M27,27 L81,27 L81,81 L27,81 Z" />
          </vector>
          EOF


      # ==========================================================
      # 15. CREATE ANDROID MANIFEST
      # ==========================================================

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="Keuangan"
                  android:theme="@style/AppTheme"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ==========================================================
      # 16. CREATE APP STYLE
      # ==========================================================

      - name: Create Android styles
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#198754</item>
                  <item name="android:navigationBarColor">#121212</item>
                  <item name="android:statusBarColor">#121212</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF


      # ==========================================================
      # 17. CREATE MAIN ACTIVITY
      # ==========================================================

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/catatankas/app/MainActivity.java <<'EOF'
          package com.catatankas.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF


      # ==========================================================
      # 18. CHECK ANDROID PROJECT
      # ==========================================================

      - name: Check Android project
        run: |
          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          find app -type f | sort

          echo ""
          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          gradle --version


      # ==========================================================
      # 19. BUILD DEBUG APK
      # ==========================================================

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon


      # ==========================================================
      # 20. PREPARE APK
      # ==========================================================

      - name: Prepare APK
        run: |
          mkdir -p output

          cp app/build/outputs/apk/debug/app-debug.apk \
             output/Keuangan-v2.4.apk

          echo "APK berhasil dibuat:"
          ls -lh output/Keuangan-v2.4.apk


      # ==========================================================
      # 21. UPLOAD APK
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keuangan-v2.4-APK
          path: output/Keuangan-v2.4.apk
          if-no-files-found: error


      # ==========================================================
      # 22. BUILD SUMMARY
      # ==========================================================

      - name: Build summary
        run: |
          echo "=========================================="
          echo "      BUILD KEUANGAN SELESAI"
          echo "=========================================="
          echo ""
          echo "Nama aplikasi : Keuangan"
          echo "Version       : 2.4"
          echo "Package       : com.catatankas.app"
          echo "SDK           : Android 35"
          echo "Java          : 17"
          echo "Gradle        : 8.9"
          echo ""
          echo "APK:"
          ls -lh output/Keuangan-v2.4.apk
          echo ""
          echo "=========================================="

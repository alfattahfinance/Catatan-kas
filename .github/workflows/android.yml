name: Build Catatan Kas APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4


      - name: Cek file aplikasi
        run: |
          echo "=== CEK ASSETS ==="

          ls -la app/src/main/assets || true

          echo ""
          echo "=== CEK FILE HTML ==="

          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/pengeluaran.html
          test -f app/src/main/assets/santri.html
          test -f app/src/main/assets/pembayaran.html
          test -f app/src/main/assets/laporan.html

          echo ""
          echo "Semua file HTML ditemukan."


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'


      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Catatan-Kas-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

name: Build Catatan Kas APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout project
        uses: actions/checkout@v4


      # ==========================================
      # SETUP JAVA
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ==========================================
      # SETUP ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"


      # ==========================================
      # BUAT STRUKTUR PROJECT ANDROID
      # ==========================================

      - name: Buat project Android
        run: |
          mkdir -p app/src/main/java/com/catatankas/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets


      # ==========================================
      # SALIN FILE APLIKASI WEB
      # ==========================================

      - name: Salin file aplikasi ke assets
        run: |
          echo "=== MENYALIN FILE WEB ==="

          # HTML
          find . -maxdepth 1 -type f -name "*.html" \
            -exec cp {} app/src/main/assets/ \;

          # JavaScript
          find . -maxdepth 1 -type f -name "*.js" \
            -exec cp {} app/src/main/assets/ \;

          # CSS
          find . -maxdepth 1 -type f -name "*.css" \
            -exec cp {} app/src/main/assets/ \;

          # Folder JS
          if [ -d "js" ]; then
            cp -r js app/src/main/assets/
          fi

          # Folder Js
          if [ -d "Js" ]; then
            cp -r Js app/src/main/assets/
          fi

          # Folder css
          if [ -d "css" ]; then
            cp -r css app/src/main/assets/
          fi

          # Folder images/assets jika ada
          if [ -d "images" ]; then
            cp -r images app/src/main/assets/
          fi

          if [ -d "img" ]; then
            cp -r img app/src/main/assets/
          fi

          echo ""
          echo "=== ISI ASSETS ==="
          find app/src/main/assets -maxdepth 3 -type f | sort


      # ==========================================
      # CEK FILE HTML
      # ==========================================

      - name: Cek file aplikasi
        run: |
          echo "=== CEK ASSETS ==="

          ls -lah app/src/main/assets

          echo ""
          echo "=== CEK HTML ==="

          if [ ! -f "app/src/main/assets/index.html" ]; then
            echo "ERROR: index.html tidak ditemukan"
            exit 1
          fi

          if [ ! -f "app/src/main/assets/pengeluaran.html" ]; then
            echo "ERROR: pengeluaran.html tidak ditemukan"
            exit 1
          fi

          if [ ! -f "app/src/main/assets/laporan.html" ]; then
            echo "ERROR: laporan.html tidak ditemukan"
            exit 1
          fi

          echo ""
          echo "Semua file utama ditemukan."


      # ==========================================
      # SETTINGS GRADLE
      # ==========================================

      - name: Buat settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CatatanKas"
          include(":app")
          EOF


      # ==========================================
      # ROOT BUILD GRADLE
      # ==========================================

      - name: Buat build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      # ==========================================
      # APP BUILD GRADLE
      # ==========================================

      - name: Buat app/build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.catatankas.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.catatankas.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF


      # ==========================================
      # ANDROID MANIFEST
      # ==========================================

      - name: Buat AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Catatan Kas"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ==========================================
      # THEME
      # ==========================================

      - name: Buat theme
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#dc3545</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>

              </style>

          </resources>
          EOF


      # ==========================================
      # MAIN ACTIVITY
      # ==========================================

      - name: Buat MainActivity.java
        run: |
          cat > app/src/main/java/com/catatankas/app/MainActivity.java <<'EOF'
          package com.catatankas.app;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import androidx.appcompat.app.AppCompatActivity;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClient;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);

                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(true);

                  WebViewAssetLoader assetLoader =
                          new WebViewAssetLoader.Builder()
                                  .addPathHandler(
                                          "/assets/",
                                          new WebViewAssetLoader.AssetsPathHandler(this)
                                  )
                                  .build();

                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public android.webkit.WebResourceResponse shouldInterceptRequest(
                                      WebView view,
                                      android.webkit.WebResourceRequest request
                              ) {
                                  return assetLoader.shouldInterceptRequest(
                                          request.getUrl()
                                  );
                              }

                              @Override
                              public android.webkit.WebResourceResponse shouldInterceptRequest(
                                      WebView view,
                                      String url
                              ) {
                                  return assetLoader.shouldInterceptRequest(url);
                              }
                          }
                  );

                  webView.loadUrl(
                          "https://appassets.androidplatform.net/assets/index.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF


      # ==========================================
      # CEK PROJECT
      # ==========================================

      - name: Cek struktur Android
        run: |
          echo "=== STRUKTUR PROJECT ==="
          find app/src/main -maxdepth 4 -type f | sort

          echo ""
          echo "=== CEK INDEX ==="
          test -f app/src/main/assets/index.html

          echo ""
          echo "INDEX.HTML OK"


      # ==========================================
      # SETUP GRADLE
      # ==========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug


      # ==========================================
      # CEK APK
      # ==========================================

      - name: Cek hasil APK
        run: |
          ls -lah app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Catatan-Kas-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

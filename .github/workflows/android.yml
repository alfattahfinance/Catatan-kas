name: Build Catatan Kas APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT PROJECT
      # ==========================================
      - name: Checkout project
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP JAVA
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================
      # 3. SETUP ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # 4. INSTALL ANDROID SDK
      # ==========================================
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================
      # 5. BUAT FOLDER ANDROID
      # ==========================================
      - name: Create Android project folders
        run: |
          mkdir -p app/src/main/java/com/catatankas/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets


      # ==========================================
      # 6. SALIN SEMUA FILE WEB
      # ==========================================
      - name: Copy web application files
        run: |
          echo "======================================"
          echo "MENYALIN FILE CATATAN KAS"
          echo "======================================"

          # --------------------------------------
          # File HTML di root
          # --------------------------------------
          find . -maxdepth 1 -type f -name "*.html" \
            -exec cp {} app/src/main/assets/ \;

          # --------------------------------------
          # File JavaScript di root
          # --------------------------------------
          find . -maxdepth 1 -type f -name "*.js" \
            -exec cp {} app/src/main/assets/ \;

          # --------------------------------------
          # File CSS di root
          # --------------------------------------
          find . -maxdepth 1 -type f -name "*.css" \
            -exec cp {} app/src/main/assets/ \;

          # --------------------------------------
          # manifest.json
          # --------------------------------------
          if [ -f "manifest.json" ]; then
            cp manifest.json app/src/main/assets/
          fi

          # --------------------------------------
          # Folder js
          # --------------------------------------
          if [ -d "js" ]; then
            cp -r js app/src/main/assets/
          fi

          # --------------------------------------
          # Folder Js
          # --------------------------------------
          if [ -d "Js" ]; then
            cp -r Js app/src/main/assets/
          fi

          # --------------------------------------
          # Folder css
          # --------------------------------------
          if [ -d "css" ]; then
            cp -r css app/src/main/assets/
          fi

          # --------------------------------------
          # Folder assets
          # --------------------------------------
          if [ -d "assets" ]; then
            cp -r assets app/src/main/assets/
          fi

          # --------------------------------------
          # Folder images
          # --------------------------------------
          if [ -d "images" ]; then
            cp -r images app/src/main/assets/
          fi

          # --------------------------------------
          # Folder img
          # --------------------------------------
          if [ -d "img" ]; then
            cp -r img app/src/main/assets/
          fi

          echo ""
          echo "======================================"
          echo "ISI ASSETS APK"
          echo "======================================"

          find app/src/main/assets -maxdepth 5 -type f | sort


      # ==========================================
      # 7. CEK FILE WAJIB
      # ==========================================
      - name: Validate web files
        run: |
          echo "======================================"
          echo "MEMERIKSA FILE WAJIB"
          echo "======================================"

          REQUIRED_FILES="
          index.html
          "

          for file in $REQUIRED_FILES; do
            if [ ! -f "app/src/main/assets/$file" ]; then
              echo "ERROR: $file tidak ditemukan!"
              exit 1
            fi

            echo "OK: $file"
          done

          echo ""
          echo "======================================"
          echo "MEMERIKSA HALAMAN TAMBAHAN"
          echo "======================================"

          for file in \
            pengaturan.html \
            santri.html \
            pembayaran.html \
            pengeluaran.html \
            laporan.html
          do
            if [ -f "app/src/main/assets/$file" ]; then
              echo "OK: $file"
            else
              echo "INFO: $file tidak ditemukan"
            fi
          done

          echo ""
          echo "======================================"
          echo "MEMERIKSA JAVASCRIPT"
          echo "======================================"

          if [ -f "app/src/main/assets/app.js" ]; then
            echo "OK: app.js"
          fi

          if [ -f "app/src/main/assets/firebase-config.js" ]; then
            echo "OK: firebase-config.js"
          fi

          if [ -f "app/src/main/assets/js/app.js" ]; then
            echo "OK: js/app.js"
          fi

          if [ -f "app/src/main/assets/js/firebase-config.js" ]; then
            echo "OK: js/firebase-config.js"
          fi

          echo ""
          echo "======================================"
          echo "MEMERIKSA ASSETS / LOGO"
          echo "======================================"

          if [ -f "app/src/main/assets/assets/logo-catatan-kas.jpg" ]; then
            echo "OK: assets/logo-catatan-kas.jpg"
          elif [ -f "app/src/main/assets/assets/logo-catatan-keuangan.png" ]; then
            echo "OK: assets/logo-catatan-keuangan.png"
          else
            echo "INFO: Logo tidak ditemukan di folder assets."
          fi

          echo ""
          echo "Validasi file selesai."


      # ==========================================
      # 8. SETTINGS GRADLE
      # ==========================================
      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CatatanKas"

          include(":app")
          EOF


      # ==========================================
      # 9. ROOT BUILD GRADLE
      # ==========================================
      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      # ==========================================
      # 10. APP BUILD GRADLE
      # ==========================================
      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.catatankas.app'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.catatankas.app'

                  minSdk 24

                  targetSdk 35

                  versionCode 1

                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.16.0'
          }
          EOF


      # ==========================================
      # 11. ANDROID MANIFEST
      # ==========================================
      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Internet untuk Firebase -->
              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Catatan Kas"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ==========================================
      # 12. STYLE ANDROID
      # ==========================================
      - name: Create styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">
                      #198754
                  </item>

                  <item name="android:statusBarColor">
                      #198754
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>
          EOF


      # ==========================================
      # 13. MAIN ACTIVITY
      # ==========================================
      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/catatankas/app/MainActivity.java <<'EOF'
          package com.catatankas.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  setContentView(webView);

                  WebSettings settings =
                          webView.getSettings();

                  // JavaScript
                  settings.setJavaScriptEnabled(true);

                  // LocalStorage
                  settings.setDomStorageEnabled(true);

                  // Database
                  settings.setDatabaseEnabled(true);

                  // Zoom
                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  // Allow media
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  // Keamanan file
                  settings.setAllowFileAccess(false);

                  settings.setAllowContentAccess(false);

                  /*
                   * WebViewAssetLoader membuat file HTML,
                   * CSS, JavaScript dan assets dapat dibuka
                   * menggunakan:
                   *
                   * https://appassets.androidplatform.net/assets/
                   */

                  final WebViewAssetLoader assetLoader =
                          new WebViewAssetLoader.Builder()
                                  .addPathHandler(
                                          "/assets/",
                                          new WebViewAssetLoader.AssetsPathHandler(this)
                                  )
                                  .build();


                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public WebResourceResponse
                              shouldInterceptRequest(
                                      WebView view,
                                      WebResourceRequest request) {

                                  Uri uri =
                                          request.getUrl();

                                  WebResourceResponse response =
                                          assetLoader.shouldInterceptRequest(uri);

                                  return response;
                              }

                          }
                  );


                  // Buka dashboard
                  webView.loadUrl(
                          "https://appassets.androidplatform.net/assets/index.html"
                  );
              }


              @Override
              public void onBackPressed() {

                  if (
                          webView != null &&
                          webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }
              }
          }
          EOF


      # ==========================================
      # 14. TAMPILKAN STRUKTUR APK
      # ==========================================
      - name: Show final project structure
        run: |
          echo "======================================"
          echo "STRUKTUR PROJECT ANDROID"
          echo "======================================"

          find app/src/main -maxdepth 5 -type f | sort


      # ==========================================
      # 15. SETUP GRADLE
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"


      # ==========================================
      # 16. CLEAN PROJECT
      # ==========================================
      - name: Clean project
        run: |
          gradle --no-daemon clean


      # ==========================================
      # 17. BUILD DEBUG APK
      # ==========================================
      - name: Build Debug APK
        run: |
          gradle --no-daemon :app:assembleDebug


      # ==========================================
      # 18. CEK APK
      # ==========================================
      - name: Check APK
        run: |
          echo "======================================"
          echo "MEMERIKSA APK"
          echo "======================================"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak berhasil dibuat!"
            exit 1
          fi

          echo ""
          echo "APK BERHASIL DIBUAT:"
          ls -lh "$APK"


      # ==========================================
      # 19. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Catatan-Kas-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

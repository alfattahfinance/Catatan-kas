name: Build Keuangan APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 - <<'PY'
          import json
          with open('version.json', encoding='utf-8') as f:
              print(json.load(f)['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Check runner tools
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          command -v sdkmanager || true

      - name: Decode permanent keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keuangan-release.jks
          keytool -list -keystore keuangan-release.jks \
            -storepass '${{ secrets.KEYSTORE_PASSWORD }}' \
            -alias '${{ secrets.KEY_ALIAS }}' >/dev/null
          echo "Permanent keystore OK."

      - name: Prepare Android SDK without external action
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ]; then
            for candidate in "$HOME/Android/Sdk" "/usr/local/lib/android/sdk" "/opt/android-sdk"; do
              if [ -d "$candidate" ]; then SDK="$candidate"; break; fi
            done
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "Android SDK tidak ditemukan di runner."
            exit 1
          fi
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          SDKMANAGER=""
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager tidak ditemukan."
            exit 1
          fi

      - name: Create Android project folders
        run: |
          mkdir -p app/src/main/java/com/catatankas/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

      - name: Copy web files
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name "*.html" -exec cp {} app/src/main/assets/ \;
          find . -maxdepth 1 -type f -name "*.js" -exec cp {} app/src/main/assets/ \;
          find . -maxdepth 1 -type f -name "*.css" -exec cp {} app/src/main/assets/ \;
          if [ -d "js" ]; then cp -r js app/src/main/assets/; fi
          if [ -d "Js" ]; then cp -r Js app/src/main/assets/; fi
          if [ -d "css" ]; then cp -r css app/src/main/assets/; fi
          if [ -d "assets" ]; then cp -r assets app/src/main/assets/; fi
          if [ -d "images" ]; then cp -r images app/src/main/assets/; fi
          if [ -d "img" ]; then cp -r img app/src/main/assets/; fi
          if [ -f "logo-catatan-kas.jpg" ]; then cp logo-catatan-kas.jpg app/src/main/assets/logo-catatan-kas.jpg; fi
          if [ -f "icon-192.png" ]; then cp icon-192.png app/src/main/assets/icon-192.png; fi
          if [ -f "icon-512.png" ]; then cp icon-512.png app/src/main/assets/icon-512.png; fi
          test -f app/src/main/assets/logo-catatan-kas.jpg
          echo "Logo APK:" app/src/main/assets/logo-catatan-kas.jpg

      - name: Set version inside update checker
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -f "app/src/main/assets/js/update-check.js" ]; then
            sed -i -E 's/window\.APP_VERSION \|\| "[^"]*"/window.APP_VERSION || "'"$APP_VERSION"'"/' app/src/main/assets/js/update-check.js
          fi

      - name: Install app icon
        run: |
          test -f "Photoroom_20260812_224807.png"
          cp "Photoroom_20260812_224807.png" app/src/main/res/drawable/ic_keuangan.png

      - name: Create gradle.properties
        run: |
          printf "android.useAndroidX=true\nandroid.enableJetifier=false\n" > gradle.properties
          printf "android.useAndroidX=true\nandroid.enableJetifier=false\n" > app/gradle.properties

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Keuangan"
          include(":app")
          GRADLE

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          GRADLE

      - name: Create app build.gradle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION_CODE=$(python3 - <<'PY'
          import os
          parts=[int(x) if x.isdigit() else 0 for x in os.environ['APP_VERSION'].lstrip('v').split('.')]
          while len(parts) < 3: parts.append(0)
          print(parts[0]*10000 + parts[1]*100 + parts[2])
          PY
          )
          cat > app/build.gradle <<GRADLE
          plugins { id 'com.android.application' }
          android {
              namespace 'com.catatankas.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.catatankas.app'
                  minSdk 24
                  targetSdk 35
                  versionCode ${VERSION_CODE}
                  versionName '${APP_VERSION}'
              }
              signingConfigs {
                  release {
                      storeFile file('../keuangan-release.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.16.0' }
          GRADLE

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="Keuangan"
                  android:icon="@drawable/ic_keuangan"
                  android:roundIcon="@drawable/ic_keuangan"
                  android:theme="@style/AppTheme"
                  android:resizeableActivity="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="unspecified"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

      - name: Create styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#198754</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
              </style>
          </resources>
          XML

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/catatankas/app/MainActivity.java <<'JAVA'
          package com.catatankas.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private static final int FILE_CHOOSER_REQUEST = 4101;
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(false);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = callback;
                          Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("image/*");
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, false);
                          try { startActivityForResult(intent, FILE_CHOOSER_REQUEST); return true; }
                          catch (Exception error) { filePathCallback = null; return false; }
                      }
                  });
                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }
              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_CHOOSER_REQUEST || filePathCallback == null) return;
                  Uri[] results = null;
                  if (resultCode == RESULT_OK && data != null && data.getData() != null) results = new Uri[]{data.getData()};
                  filePathCallback.onReceiveValue(results);
                  filePathCallback = null;
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }
          }
          JAVA

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean
          gradle --no-daemon :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "Keuangan-v${{ steps.version.outputs.version }}.apk"
          ls -lh "Keuangan-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keuangan-v${{ steps.version.outputs.version }}-release-apk
          path: Keuangan-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "BUILD KEUANGAN SELESAI"
          echo "Nama aplikasi : Keuangan"
          echo "Version       : ${{ steps.version.outputs.version }}"
          echo "Package       : com.catatankas.app"

name: Build Keuangan APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.json'
      - 'theme.js'
      - 'logo-sync.js'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Keuangan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 - <<'PY'
          import json
          with open('version.json', encoding='utf-8') as f:
              print(json.load(f).get('version', '2.4'))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Prepare Android project
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/catatankas/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -exec cp {} app/src/main/assets/ \;
          for dir in js Js css assets images img; do
            if [ -d "$dir" ]; then cp -r "$dir" app/src/main/assets/; fi
          done

          # Pastikan file logo aplikasi tersedia sebagai asset.
          if [ -f "logo-catatan-kas.jpg" ]; then cp "logo-catatan-kas.jpg" app/src/main/assets/; fi
          if [ -f "logo-catatan-kas.png" ]; then cp "logo-catatan-kas.png" app/src/main/assets/; fi

          # Gunakan ikon proyek jika ada; jika tidak, gunakan icon-192.png.
          if [ -f "Photoroom_20260812_224807.png" ]; then
            cp "Photoroom_20260812_224807.png" app/src/main/res/drawable/ic_keuangan.png
          elif [ -f "icon-192.png" ]; then
            cp "icon-192.png" app/src/main/res/drawable/ic_keuangan.png
          else
            echo "Ikon APK tidak ditemukan."
            exit 1
          fi

          # Inject theme.js ke setiap halaman APK yang belum memuatnya.
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/assets')
          tag = '<script src="theme.js"></script>'
          css = '''
          /* APK responsive fix */
          html, body { width:100% !important; max-width:none !important; }
          body { overflow-x:hidden !important; }
          @media (orientation: landscape) and (min-width:700px) {
            .mobile-container, .page-container, .ck-page, .wrap, .container, .container-fluid {
              width:100% !important; max-width:none !important; min-width:0 !important;
              margin-left:0 !important; margin-right:0 !important;
              padding-left:24px !important; padding-right:24px !important;
            }
          }
          '''
          for p in root.glob('*.html'):
              text = p.read_text(encoding='utf-8')
              if 'src="theme.js"' not in text and "src='theme.js'" not in text:
                  if '</head>' in text:
                      text = text.replace('</head>', tag + '\n</head>', 1)
                  else:
                      text += '\n' + tag + '\n'
              if 'APK responsive fix' not in text and '</head>' in text:
                  text = text.replace('</head>', '<style>' + css + '</style>\n</head>', 1)
              p.write_text(text, encoding='utf-8')
          PY

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'Keuangan'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=false
          PROPS

          VERSION_CODE=$(python3 - <<'PY'
          import os
          raw=os.environ.get('APP_VERSION','2.4').lstrip('v')
          parts=[]
          for x in raw.split('.'):
              try: parts.append(int(x))
              except ValueError: parts.append(0)
          while len(parts)<3: parts.append(0)
          print(parts[0]*10000 + parts[1]*100 + parts[2])
          PY
          )

          cat > app/build.gradle <<GRADLE
          plugins { id 'com.android.application' }
          android {
              namespace 'com.catatankas.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.catatankas.app'
                  minSdk 24
                  targetSdk 35
                  versionCode ${VERSION_CODE}
                  versionName '${APP_VERSION}'
              }
              buildTypes {
                  debug { minifyEnabled false }
                  release { minifyEnabled false; shrinkResources false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <supports-screens android:smallScreens="true" android:normalScreens="true" android:largeScreens="true" android:xlargeScreens="true" android:anyDensity="true" android:resizeable="true" />
              <application
                  android:allowBackup="true"
                  android:label="Keuangan"
                  android:icon="@drawable/ic_keuangan"
                  android:roundIcon="@drawable/ic_keuangan"
                  android:theme="@style/AppTheme"
                  android:resizeableActivity="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#198754</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          XML

          cat > app/src/main/java/com/catatankas/app/MainActivity.java <<'JAVA'
          package com.catatankas.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setUseWideViewPort(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }
              @Override protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          JAVA

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/theme.js
          test -f app/src/main/res/drawable/ic_keuangan.png
          java -version
          gradle --version
          find app/src/main -maxdepth 3 -type f | sort

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean :app:assembleDebug --stacktrace
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/Keuangan-v${{ steps.version.outputs.version }}-debug.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Keuangan-v${{ steps.version.outputs.version }}-debug-apk
          path: output/Keuangan-v${{ steps.version.outputs.version }}-debug.apk
          if-no-files-found: error

      - name: Build signed Release APK when keystore secrets are available
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        env:
          HAS_RELEASE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keuangan-release.jks
          keytool -list -keystore keuangan-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          s=s.replace("buildTypes {", "signingConfigs { release { storeFile file('../keuangan-release.jks'); storePassword System.getenv('KEYSTORE_PASSWORD'); keyAlias System.getenv('KEY_ALIAS'); keyPassword System.getenv('KEY_PASSWORD') } }\n              buildTypes {")
          s=s.replace("release { minifyEnabled false; shrinkResources false }", "release { minifyEnabled false; shrinkResources false; signingConfig signingConfigs.release }")
          p.write_text(s)
          PY
          gradle --no-daemon :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "output/Keuangan-v${{ steps.version.outputs.version }}-release.apk"

      - name: Upload Release APK
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        env:
          HAS_RELEASE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Keuangan-v${{ steps.version.outputs.version }}-release-apk
          path: output/Keuangan-v${{ steps.version.outputs.version }}-release.apk
          if-no-files-found: error

      - name: Build summary
        shell: bash
        run: |
          echo "BUILD KEUANGAN SELESAI"
          echo "Nama aplikasi : Keuangan"
          echo "Version       : ${{ steps.version.outputs.version }}"
          echo "Package       : com.catatankas.app"
          ls -lh output/

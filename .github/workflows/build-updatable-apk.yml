name: Build Keuangan APK - Updatable Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'UpdatableMainActivity.java'
      - 'web-update.json'
      - 'pengaturan.html'
      - 'js/update-check.js'
      - '.github/workflows/build-updatable-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build APK dengan Update Dalam Aplikasi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare isolated Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/catatankas/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -exec cp {} app/src/main/assets/ \;
          for dir in js css assets images img; do
            if [ -d "$dir" ]; then cp -r "$dir" app/src/main/assets/; fi
          done

          cp UpdatableMainActivity.java app/src/main/java/com/catatankas/app/UpdatableMainActivity.java

          cat > app/src/main/java/com/catatankas/app/MainActivity.java <<'JAVA'
          package com.catatankas.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              protected WebView webView;
              protected static final int FILE_CHOOSER_REQUEST = 1001;
              private ValueCallback<Uri[]> pendingFileCallback;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(false);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          WebResourceResponse response = loader.shouldInterceptRequest(request.getUrl());
                          return response != null ? response : super.shouldInterceptRequest(view, request);
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          pendingFileCallback = callback;
                          Intent intent = params.createIntent();
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("image/*");
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                              return true;
                          } catch (Exception e) {
                              pendingFileCallback = null;
                              callback.onReceiveValue(null);
                              return false;
                          }
                      }
                  });
                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST && pendingFileCallback != null) {
                      Uri[] result = null;
                      if (resultCode == RESULT_OK && data != null && data.getData() != null) result = new Uri[]{data.getData()};
                      pendingFileCallback.onReceiveValue(result);
                      pendingFileCallback = null;
                  }
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }

              @Override protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          JAVA

          cp icon-192.png app/src/main/res/drawable/ic_keuangan.png

          cat > settings.gradle <<'GRADLE'
          import org.gradle.api.initialization.resolve.RepositoriesMode
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'Keuangan'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          GRADLE

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=false
          PROPS

          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.catatankas.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.catatankas.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 20400
                  versionName '2.4'
              }
              buildTypes {
                  debug { minifyEnabled false }
                  release { minifyEnabled false; shrinkResources false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.13.0'
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <supports-screens android:smallScreens="true" android:normalScreens="true" android:largeScreens="true" android:xlargeScreens="true" android:anyDensity="true" android:resizeable="true" />
              <application android:allowBackup="true" android:label="Keuangan" android:icon="@drawable/ic_keuangan" android:roundIcon="@drawable/ic_keuangan" android:theme="@style/AppTheme" android:resizeableActivity="true">
                  <activity android:name=".UpdatableMainActivity" android:exported="true" android:screenOrientation="unspecified" android:resizeableActivity="true" android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#198754</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          XML

      - name: Verify updater sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'app/src/main/java/com/catatankas/app/MainActivity.java': ['onShowFileChooser'],
              'app/src/main/java/com/catatankas/app/UpdatableMainActivity.java': ['AndroidWebUpdater', 'extends MainActivity'],
              'app/src/main/assets/web-update.json': ['"version"', '"files"'],
              'app/src/main/assets/js/update-check.js': ['cekUpdateButton', 'AndroidWebUpdater'],
              'app/src/main/assets/pengaturan.html': ['cekUpdateButton'],
              'app/src/main/AndroidManifest.xml': ['.UpdatableMainActivity', 'android.intent.category.LAUNCHER'],
          }
          errors = []
          for name, needles in checks.items():
              p = Path(name)
              if not p.is_file() or p.stat().st_size == 0:
                  errors.append(f'MISSING FILE: {name}')
                  continue
              text = p.read_text(encoding='utf-8', errors='replace')
              for needle in needles:
                  if needle not in text:
                      errors.append(f'MISSING TEXT: {needle!r} in {name}')
          if errors:
              print('UPDATER VERIFICATION FAILED')
              for e in errors:
                  print(' -', e)
              raise SystemExit(1)
          print('UPDATER VERIFICATION OK')
          print('MainActivity: stable WebView + file chooser')
          print('UpdatableMainActivity: updater embedded')
          print('Manifest: UpdatableMainActivity is launcher')
          print('Pengaturan: update button present')
          PY

      - name: Build Debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keuangan-APK-Updatable-Web
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Keuangan APK - Updatable Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'UpdatableMainActivity.java'
      - 'web-update.json'
      - 'pengaturan.html'
      - 'js/update-check.js'
      - '.github/workflows/build-updatable-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build APK dengan Update Dalam Aplikasi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/catatankas/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -exec cp {} app/src/main/assets/ \;
          for dir in js css assets images img; do
            if [ -d "$dir" ]; then cp -r "$dir" app/src/main/assets/; fi
          done

          cp UpdatableMainActivity.java app/src/main/java/com/catatankas/app/UpdatableMainActivity.java

          cp icon-192.png app/src/main/res/drawable/ic_keuangan.png

          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'Keuangan'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          GRADLE

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=false
          PROPS

          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.catatankas.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.catatankas.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 20400
                  versionName '2.4'
              }
              buildTypes {
                  debug { minifyEnabled false }
                  release { minifyEnabled false; shrinkResources false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.activity:activity:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.13.0'
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <supports-screens android:smallScreens="true" android:normalScreens="true" android:largeScreens="true" android:xlargeScreens="true" android:anyDensity="true" android:resizeable="true" />
              <application
                  android:allowBackup="true"
                  android:label="Keuangan"
                  android:icon="@drawable/ic_keuangan"
                  android:roundIcon="@drawable/ic_keuangan"
                  android:theme="@style/AppTheme"
                  android:resizeableActivity="true">
                  <activity
                      android:name=".UpdatableMainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#198754</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          XML

      - name: Verify updater sources
        run: |
          test -s app/src/main/java/com/catatankas/app/UpdatableMainActivity.java
          test -s app/src/main/assets/web-update.json
          test -s app/src/main/assets/js/update-check.js
          grep -q "AndroidWebUpdater" app/src/main/java/com/catatankas/app/UpdatableMainActivity.java
          grep -q "cekUpdateButton" app/src/main/assets/js/update-check.js

      - name: Build Debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keuangan-APK-Updatable-Web
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

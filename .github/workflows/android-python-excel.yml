name: Build Catatan Kas APK + Python Excel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-python-excel:
    name: Build APK dengan Python Excel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python - <<'PY'
          import json
          with open('version.json', encoding='utf-8') as f:
              print(json.load(f).get('version', '2.4'))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Create Android project structure
        shell: bash
        run: mkdir -p app/src/main/java/com/catatankas/app app/src/main/res/values app/src/main/res/drawable app/src/main/assets app/src/main/python
      - name: Create Gradle project with Chaquopy
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'Keuangan'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'com.chaquo.python' version '17.0.0' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
      - name: Create app Gradle configuration
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION_CODE=$(python - <<'PY'
          import os
          raw=os.environ.get('APP_VERSION','2.4').lstrip('v')
          nums=[]
          for p in raw.split('.'):
              try: nums.append(int(p))
              except: nums.append(0)
          while len(nums)<3: nums.append(0)
          print(nums[0]*10000+nums[1]*100+nums[2])
          PY
          )
          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
              id 'com.chaquo.python'
          }
          android {
              namespace 'com.catatankas.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.catatankas.app'
                  minSdk 24
                  targetSdk 35
                  versionCode ${VERSION_CODE}
                  versionName '${APP_VERSION}'
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
              }
              buildTypes { release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          chaquopy {
              defaultConfig {
                  version = '3.10'
                  buildPython 'python'
                  pip { install 'openpyxl==3.1.5' }
              }
          }
          dependencies {
              implementation 'androidx.activity:activity:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.13.0'
          }
          EOF
          printf '%s\n' '# No custom rules.' > app/proguard-rules.pro
      - name: Copy complete web application
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='app/' --exclude='output/' ./ app/src/main/assets/
          cp python/rekap_pembayaran.py app/src/main/python/rekap_pembayaran.py
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/dashboard-excel.html
          test -f app/src/main/assets/firebase-config.js
          test -f app/src/main/python/rekap_pembayaran.py
      - name: Enable Python Excel button only in this APK build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          page=Path('app/src/main/assets/dashboard-excel.html')
          text=page.read_text(encoding='utf-8')
          marker='<script type="module" src="js/dashboard-excel-python.js"></script>'
          if marker not in text:
              text=text.replace('</body>', marker+'\n</body>', 1)
          page.write_text(text, encoding='utf-8')
          PY
      - name: Add auth guard to protected pages in APK
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/assets')
          public={'login.html','register.html'}
          marker='<script type="module" src="auth-guard.js"></script>'
          for page in root.glob('*.html'):
              if page.name in public: continue
              text=page.read_text(encoding='utf-8')
              if marker not in text:
                  text=text.replace('</body>', marker+'\n</body>', 1)
                  page.write_text(text,encoding='utf-8')
          PY
      - name: Create Android resources
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#198754</item><item name="android:navigationBarColor">#121212</item><item name="android:statusBarColor">#121212</item></style></resources>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#198754" android:pathData="M0,0L108,0L108,108L0,108Z"/><path android:fillColor="#FFFFFF" android:pathData="M27,27L81,27L81,81L27,81Z"/></vector>
          EOF
      - name: Create Android manifest and Python bridge activity
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:allowBackup="true" android:usesCleartextTraffic="true" android:label="Keuangan" android:theme="@style/AppTheme" android:icon="@drawable/ic_launcher" android:resizeableActivity="false">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="unspecified" android:resizeableActivity="false" android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/catatankas/app/MainActivity.java <<'EOF'
          package com.catatankas.app;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.view.ViewGroup;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;
          import com.chaquo.python.Python;
          import com.chaquo.python.android.AndroidPlatform;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import android.util.Base64;
          public class MainActivity extends Activity {
            private WebView webView;
            private WebViewAssetLoader assetLoader;
            private Python python;
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              if (!Python.isStarted()) Python.start(new AndroidPlatform(this));
              python = Python.getInstance();
              webView = new WebView(this);
              webView.setLayoutParams(new ViewGroup.LayoutParams(-1,-1));
              setContentView(webView);
              assetLoader = new WebViewAssetLoader.Builder().addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true);
              s.setAllowFileAccess(false); s.setAllowContentAccess(false); s.setSupportZoom(false); s.setBuiltInZoomControls(false); s.setDisplayZoomControls(false);
              webView.addJavascriptInterface(new PythonExcelBridge(), "AndroidPython");
              webView.setWebViewClient(new WebViewClient(){ @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r){ return assetLoader.shouldInterceptRequest(r.getUrl()); } });
              webView.setWebChromeClient(new WebChromeClient());
              webView.loadUrl("https://appassets.androidplatform.net/assets/login.html");
            }
            private class PythonExcelBridge {
              @JavascriptInterface public String exportExcel(String payload) {
                try {
                  String encoded = python.getModule("rekap_pembayaran").callAttr("export_excel_base64", payload).toJava(String.class);
                  byte[] bytes = Base64.decode(encoded, Base64.DEFAULT);
                  String filename = "Rekap-Pembayaran-" + System.currentTimeMillis() + ".xlsx";
                  saveDownload(filename, bytes);
                  return filename;
                } catch (Exception e) { return ""; }
              }
            }
            private void saveDownload(String filename, byte[] bytes) throws Exception {
              if (Build.VERSION.SDK_INT >= 29) {
                ContentValues values = new ContentValues();
                values.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                values.put(MediaStore.Downloads.MIME_TYPE, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
                values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                android.net.Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                if (uri == null) throw new IllegalStateException("Gagal membuat file Download");
                try (OutputStream out = getContentResolver().openOutputStream(uri)) { out.write(bytes); }
              } else {
                File dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                if (dir == null) throw new IllegalStateException("Folder Download tidak tersedia");
                if (!dir.exists()) dir.mkdirs();
                try (FileOutputStream out = new FileOutputStream(new File(dir, filename))) { out.write(bytes); }
              }
            }
            @Override public void onBackPressed(){ if(webView!=null&&webView.canGoBack()) webView.goBack(); else super.onBackPressed(); }
            @Override protected void onDestroy(){ if(webView!=null) webView.destroy(); super.onDestroy(); }
          }
          EOF
      - name: Build Debug APK
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Prepare APK artifact
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/Keuangan-Python-Excel-v${APP_VERSION}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keuangan-Python-Excel-v${{ steps.version.outputs.version }}
          path: output/Keuangan-Python-Excel-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

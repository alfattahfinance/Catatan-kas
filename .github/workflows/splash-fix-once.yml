name: One-time Splash Fix
on:
  push:
    branches: [main]
    paths: ['splash-fix-trigger.txt']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply splash animation fix
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f splash-fix-trigger.txt ]; then
            rm -f .github/workflows/splash-fix-once.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'chore: remove one-time splash fixer' || true
            git push
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('UpdatableMainActivity.java')
          s=p.read_text(encoding='utf-8')
          marker='        getWindow().setBackgroundDrawable(new android.graphics.drawable.ColorDrawable(APP_BG));\n'
          if 'showReliableSplash();' not in s:
              s=s.replace(marker, marker+'        showReliableSplash();\n',1)
          method=r'''\n    private void showReliableSplash() {\n        final android.view.ViewGroup decor = (android.view.ViewGroup)getWindow().getDecorView();\n        final android.widget.FrameLayout overlay = new android.widget.FrameLayout(this);\n        overlay.setBackgroundColor(Color.rgb(18,23,22));\n        android.widget.LinearLayout box = new android.widget.LinearLayout(this);\n        box.setOrientation(android.widget.LinearLayout.VERTICAL);\n        box.setGravity(android.view.Gravity.CENTER);\n        int pad = Math.round(28 * getResources().getDisplayMetrics().density);\n        box.setPadding(pad,pad,pad,pad);\n        android.graphics.drawable.GradientDrawable bg = new android.graphics.drawable.GradientDrawable(android.graphics.drawable.GradientDrawable.Orientation.TL_BR,new int[]{Color.rgb(18,55,45),Color.rgb(27,39,35)});\n        bg.setCornerRadius(Math.round(24 * getResources().getDisplayMetrics().density));\n        box.setBackground(bg);\n        android.widget.TextView logo = new android.widget.TextView(this);\n        logo.setText("✓"); logo.setTextColor(Color.WHITE); logo.setTextSize(34); logo.setGravity(android.view.Gravity.CENTER); logo.setTypeface(android.graphics.Typeface.DEFAULT,android.graphics.Typeface.BOLD);\n        android.graphics.drawable.GradientDrawable lb = new android.graphics.drawable.GradientDrawable(); lb.setShape(android.graphics.drawable.GradientDrawable.OVAL); lb.setColor(Color.rgb(25,135,84)); logo.setBackground(lb);\n        box.addView(logo,new android.widget.LinearLayout.LayoutParams(dpSplash(76),dpSplash(76)));\n        android.widget.TextView title=new android.widget.TextView(this); title.setText("Keuangan"); title.setTextColor(Color.WHITE); title.setTextSize(27); title.setGravity(android.view.Gravity.CENTER); title.setTypeface(android.graphics.Typeface.DEFAULT,android.graphics.Typeface.BOLD); title.setPadding(0,dpSplash(16),0,0); box.addView(title,new android.widget.LinearLayout.LayoutParams(-1,-2));\n        android.widget.TextView sub=new android.widget.TextView(this); sub.setText("Kelola keuangan lebih mudah"); sub.setTextColor(Color.rgb(195,215,205)); sub.setTextSize(12); sub.setGravity(android.view.Gravity.CENTER); sub.setPadding(0,dpSplash(4),0,dpSplash(22)); box.addView(sub,new android.widget.LinearLayout.LayoutParams(-1,-2));\n        android.widget.TextView status=new android.widget.TextView(this); status.setText("Menyiapkan aplikasi..."); status.setTextColor(Color.rgb(220,230,225)); status.setTextSize(11); status.setGravity(android.view.Gravity.CENTER); box.addView(status,new android.widget.LinearLayout.LayoutParams(-1,-2));\n        overlay.addView(box,new android.widget.FrameLayout.LayoutParams(-1,dpSplash(300),android.view.Gravity.CENTER));\n        decor.addView(overlay,new android.view.ViewGroup.LayoutParams(-1,-1));\n        logo.setScaleX(0.45f); logo.setScaleY(0.45f); logo.setAlpha(0f); box.setAlpha(0f);\n        logo.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(550).setInterpolator(new android.view.animation.OvershootInterpolator()).start();\n        box.animate().alpha(1f).setStartDelay(180).setDuration(500).start();\n        new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> status.setText("Memuat antarmuka..."),650);\n        new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> status.setText("Menyiapkan data..."),1050);\n        new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> status.setText("Hampir siap..."),1400);\n        new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> overlay.animate().alpha(0f).setDuration(300).withEndAction(() -> decor.removeView(overlay)).start(),1850);\n    }\n    private int dpSplash(int n){return Math.round(n*getResources().getDisplayMetrics().density);}\n'''
          if 'private void showReliableSplash()' not in s:
              s=s.replace('\n    public class AndroidWebUpdater {',method+'\n    public class AndroidWebUpdater {',1)
          p.write_text(s,encoding='utf-8')
          PY
          rm splash-fix-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UpdatableMainActivity.java splash-fix-trigger.txt
          git commit -m 'fix: restore visible animated splash screen'
          git push

# Build trigger: animated 1-100 splash
name: Build Keuangan APK - Updatable Python Excel (Stable)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'UpdatableMainActivity.java'
      - 'web-update.json'
      - 'firebase-config.js'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'images/**'
      - 'img/**'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - 'python/**'
      - '.github/workflows/build-updatable-python-stable.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Keuangan APK (Updatable + Python Excel Stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/catatankas/app app/src/main/res/values app/src/main/res/drawable app/src/main/assets app/src/main/python
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='app/' --exclude='output/' ./ app/src/main/assets/
          cp python/rekap_pembayaran.py app/src/main/python/rekap_pembayaran.py
          cp UpdatableMainActivity.java app/src/main/java/com/catatankas/app/UpdatableMainActivity.java
          test -s icon-192.png
          cp icon-192.png app/src/main/res/drawable/ic_keuangan.png
          cat > settings.gradle <<'GRADLE'
          import org.gradle.api.initialization.resolve.RepositoriesMode
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='Keuangan'; include ':app'
          GRADLE
          cat > build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.7.3' apply false; id 'com.chaquo.python' version '17.0.0' apply false }
          GRADLE
          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          PROPS
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application'; id 'com.chaquo.python' }
          android {
            namespace 'com.catatankas.app'
            compileSdk 35
            defaultConfig {
              applicationId 'com.catatankas.app'
              minSdk 24
              targetSdk 35
              versionCode 20500
              versionName '2.5'
              ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            }
            buildTypes { debug { minifyEnabled false }; release { minifyEnabled false; shrinkResources false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          chaquopy { defaultConfig { version='3.10'; buildPython 'python'; pip { install 'openpyxl==3.1.5' } } }
          dependencies {
            implementation 'androidx.activity:activity:1.10.1'
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'androidx.webkit:webkit:1.13.0'
          }
          GRADLE
          cat > app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#198754</item>
              <item name="android:windowBackground">#121716</item>
              <item name="android:windowActionModeOverlay">true</item>
              <item name="android:windowNoTitle">true</item>
              <item name="android:statusBarColor">#121716</item>
              <item name="android:navigationBarColor">#121716</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
            </style>
          </resources>
          XML
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="true" android:usesCleartextTraffic="true" android:label="Keuangan" android:theme="@style/AppTheme" android:icon="@drawable/ic_keuangan" android:resizeableActivity="true"><activity android:name=".UpdatableMainActivity" android:exported="true" android:screenOrientation="unspecified" android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          XML
          cat > app/src/main/java/com/catatankas/app/MainActivity.java <<'JAVA'
          package com.catatankas.app;
          import android.app.Activity; import android.content.ContentValues; import android.content.Intent; import android.net.Uri; import android.os.Build; import android.os.Bundle; import android.os.Environment; import android.provider.MediaStore; import android.util.Base64; import android.webkit.JavascriptInterface; import android.webkit.WebChromeClient; import android.webkit.WebResourceRequest; import android.webkit.WebResourceResponse; import android.webkit.WebSettings; import android.webkit.WebView; import android.view.Gravity; import android.view.View; import android.view.ViewGroup; import android.graphics.Color; import android.graphics.Typeface; import android.graphics.drawable.GradientDrawable; import android.os.Handler; import android.os.Looper; import android.widget.FrameLayout; import android.widget.LinearLayout; import android.widget.ProgressBar; import android.widget.TextView; import androidx.webkit.WebViewAssetLoader; import com.chaquo.python.Python; import com.chaquo.python.android.AndroidPlatform; import java.io.File; import java.io.FileOutputStream; import java.io.OutputStream;
          public class MainActivity extends Activity {
            protected WebView webView; private Python python; private Uri lastExcelUri; private final Handler splashHandler=new Handler(Looper.getMainLooper()); private FrameLayout root; private View splash;
            @Override protected void onCreate(Bundle b){ super.onCreate(b); getWindow().setBackgroundDrawable(new android.graphics.drawable.ColorDrawable(Color.rgb(18,23,22))); if(!Python.isStarted()) Python.start(new AndroidPlatform(this)); python=Python.getInstance(); root=new FrameLayout(this); root.setBackgroundColor(Color.rgb(18,23,22)); webView=new WebView(this); webView.setLayoutParams(new ViewGroup.LayoutParams(-1,-1)); root.addView(webView); setContentView(root); webView.setVisibility(View.INVISIBLE); setupSplash(); WebSettings s=webView.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true); s.setAllowFileAccess(false); s.setAllowContentAccess(false); final WebViewAssetLoader l=new WebViewAssetLoader.Builder().addPathHandler("/assets/",new WebViewAssetLoader.AssetsPathHandler(this)).build(); webView.addJavascriptInterface(new PythonExcelBridge(),"AndroidPython"); webView.setWebViewClient(new android.webkit.WebViewClient(){ @Override public WebResourceResponse shouldInterceptRequest(WebView v,WebResourceRequest r){WebResourceResponse x=l.shouldInterceptRequest(r.getUrl()); return x!=null?x:super.shouldInterceptRequest(v,r);} }); webView.setWebChromeClient(new WebChromeClient()); }
            private void setupSplash(){ FrameLayout overlay=new FrameLayout(this); splash=overlay; overlay.setBackgroundColor(Color.rgb(18,23,22)); root.addView(overlay,new FrameLayout.LayoutParams(-1,-1)); LinearLayout box=new LinearLayout(this); box.setOrientation(LinearLayout.VERTICAL); box.setGravity(Gravity.CENTER_HORIZONTAL); box.setPadding(dp(28),dp(30),dp(28),dp(30)); GradientDrawable bg=new GradientDrawable(GradientDrawable.Orientation.TL_BR,new int[]{Color.rgb(18,55,45),Color.rgb(27,39,35)}); bg.setCornerRadius(dp(24)); overlay.addView(box,new FrameLayout.LayoutParams(-1,dp(330),Gravity.CENTER)); TextView mark=new TextView(this); mark.setText("✓"); mark.setTextColor(Color.WHITE); mark.setTextSize(30); mark.setGravity(Gravity.CENTER); mark.setTypeface(Typeface.DEFAULT,Typeface.BOLD); GradientDrawable mb=new GradientDrawable(); mb.setShape(GradientDrawable.OVAL); mb.setColor(Color.rgb(25,135,84)); mark.setBackground(mb); box.addView(mark,new LinearLayout.LayoutParams(dp(70),dp(70))); TextView title=new TextView(this); title.setText("Keuangan"); title.setTextColor(Color.WHITE); title.setTextSize(26); title.setTypeface(Typeface.DEFAULT,Typeface.BOLD); title.setGravity(Gravity.CENTER); title.setPadding(0,dp(14),0,0); box.addView(title,new LinearLayout.LayoutParams(-1,-2)); TextView pct=new TextView(this); pct.setText("1%"); pct.setTextColor(Color.WHITE); pct.setTextSize(20); pct.setTypeface(Typeface.DEFAULT,Typeface.BOLD); pct.setGravity(Gravity.CENTER); pct.setPadding(0,dp(12),0,dp(8)); box.addView(pct,new LinearLayout.LayoutParams(-1,-2)); ProgressBar bar=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal); bar.setMax(100); bar.setProgress(1); box.addView(bar,new LinearLayout.LayoutParams(-1,dp(9))); TextView status=new TextView(this); status.setText("Menyiapkan aplikasi..."); status.setTextColor(Color.rgb(195,215,205)); status.setTextSize(11); status.setGravity(Gravity.CENTER); status.setPadding(0,dp(10),0,0); box.addView(status,new LinearLayout.LayoutParams(-1,-2)); mark.setScaleX(.7f); mark.setScaleY(.7f); mark.setAlpha(.2f); mark.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(500).start(); final int[] value={1}; final Runnable tick=new Runnable(){ public void run(){ if(value[0]<100){ value[0]++; bar.setProgress(value[0]); pct.setText(value[0]+"%"); if(value[0]<35)status.setText("Menyiapkan aplikasi..."); else if(value[0]<70)status.setText("Memuat antarmuka..."); else if(value[0]<95)status.setText("Menyiapkan data..."); else status.setText("Hampir siap..."); splashHandler.postDelayed(this,22); } else { splashHandler.postDelayed(()->{ webView.setVisibility(View.VISIBLE); root.removeView(overlay); splash=null; webView.loadUrl("https://appassets.androidplatform.net/assets/login.html"); },180); } }}; splashHandler.postDelayed(tick,18); }
            private int dp(int n){return Math.round(n*getResources().getDisplayMetrics().density);}
            private class PythonExcelBridge { @JavascriptInterface public String exportExcel(String payload){ try{ String b64=python.getModule("rekap_pembayaran").callAttr("export_excel_base64",payload).toJava(String.class); byte[] data=Base64.decode(b64,Base64.DEFAULT); if(data.length==0)throw new IllegalStateException("File Excel kosong"); String filename="Rekap-Pembayaran-"+System.currentTimeMillis()+".xlsx"; lastExcelUri=saveDownload(filename,data); return filename; }catch(Exception e){android.util.Log.e("PythonExcel","Export gagal",e);return "";} } @JavascriptInterface public boolean openLastExcel(){ try{ if(lastExcelUri==null)return false; Intent i=new Intent(Intent.ACTION_VIEW); i.setDataAndType(lastExcelUri,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"); i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(i); return true; }catch(Exception e){return false;} } }
            private Uri saveDownload(String filename,byte[] data)throws Exception{ if(Build.VERSION.SDK_INT>=29){ ContentValues v=new ContentValues(); v.put(MediaStore.Downloads.DISPLAY_NAME,filename); v.put(MediaStore.Downloads.MIME_TYPE,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"); v.put(MediaStore.Downloads.RELATIVE_PATH,Environment.DIRECTORY_DOWNLOADS); v.put(MediaStore.Downloads.IS_PENDING,1); Uri u=getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI,v); if(u==null)throw new IllegalStateException("Gagal membuat file Download"); try(OutputStream o=getContentResolver().openOutputStream(u)){o.write(data);o.flush();} ContentValues done=new ContentValues(); done.put(MediaStore.Downloads.IS_PENDING,0); getContentResolver().update(u,done,null,null); return u; } else { File d=getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS); if(d==null)throw new IllegalStateException("Folder Download tidak tersedia"); if(!d.exists()&&!d.mkdirs())throw new IllegalStateException("Folder Download tidak dapat dibuat"); File f=new File(d,filename); try(FileOutputStream o=new FileOutputStream(f)){o.write(data);o.flush();} return Uri.fromFile(f); } }
            @Override public void onBackPressed(){if(webView!=null&&webView.canGoBack())webView.goBack();else super.onBackPressed();} @Override protected void onDestroy(){splashHandler.removeCallbacksAndMessages(null);if(webView!=null)webView.destroy();super.onDestroy();}
          }
          JAVA
          # UpdatableMainActivity already has its own older splash; remove it so only the new 1-100 splash is shown.
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/catatankas/app/UpdatableMainActivity.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('        showReliableSplash();\n','')
          start=s.find('    private void showReliableSplash() {')
          if start >= 0:
              end=s.find('    private int dpSplash(int n)', start)
              if end >= 0:
                  end=s.find('\n', s.find('}', end)+1)
                  s=s[:start]+s[end+1:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Enable Python Excel and theme on Dashboard Excel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/dashboard-excel.html')
          if p.exists():
            s=p.read_text(encoding='utf-8'); a='<script type="module" src="js/dashboard-excel-python.js"></script>'
            if a not in s: s=s.replace('</body>',a+'\n</body>',1)
            if '<script src="theme.js"></script>' not in s: s=s.replace('</head>','<script src="theme.js"></script></head>',1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Verify stable Python Excel build
        run: |
          set -euo pipefail
          test -s app/src/main/python/rekap_pembayaran.py
          grep -q 'com.chaquo.python' build.gradle
          grep -q 'openpyxl==3.1.5' app/build.gradle
          grep -q 'AndroidPython' app/src/main/java/com/catatankas/app/MainActivity.java
          grep -q 'openLastExcel' app/src/main/java/com/catatankas/app/MainActivity.java
          grep -q 'IS_PENDING' app/src/main/java/com/catatankas/app/MainActivity.java
          grep -q 'arm64-v8a' app/build.gradle
          test -s app/src/main/java/com/catatankas/app/UpdatableMainActivity.java
          echo 'STABLE UPDATABLE + PYTHON + OPENPYXL + EXCEL BRIDGE + ABI OK'
      - name: Build Debug APK
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Prepare APK artifact
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Keuangan-Updatable-Python-Excel-Stable.apk
          test -s output/Keuangan-Updatable-Python-Excel-Stable.apk
          ls -lh output/Keuangan-Updatable-Python-Excel-Stable.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keuangan-APK-Updatable-Python-Excel-Stable
          path: output/Keuangan-Updatable-Python-Excel-Stable.apk
          if-no-files-found: error

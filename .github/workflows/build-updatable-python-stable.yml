# Build trigger: incremental safe build check
name: Build Keuangan APK - Updatable Python Excel (Stable)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'UpdatableMainActivity.java'
      - 'web-update.json'
      - 'firebase-config.js'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'images/**'
      - 'img/**'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - 'python/**'
      - '.github/workflows/build-updatable-python-stable.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Keuangan APK (Updatable + Python Excel Stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/catatankas/app app/src/main/res/values app/src/main/res/drawable app/src/main/assets app/src/main/python
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='app/' --exclude='output/' ./ app/src/main/assets/
          cp python/rekap_pembayaran.py app/src/main/python/rekap_pembayaran.py
          cp UpdatableMainActivity.java app/src/main/java/com/catatankas/app/UpdatableMainActivity.java
          test -s icon-192.png
          cp icon-192.png app/src/main/res/drawable/ic_keuangan.png
          cat > settings.gradle <<'GRADLE'
          import org.gradle.api.initialization.resolve.RepositoriesMode
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='Keuangan'; include ':app'
          GRADLE
          cat > build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.7.3' apply false; id 'com.chaquo.python' version '17.0.0' apply false }
          GRADLE
          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          PROPS
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application'; id 'com.chaquo.python' }
          android {
            namespace 'com.catatankas.app'
            compileSdk 35
            defaultConfig {
              applicationId 'com.catatankas.app'
              minSdk 24
              targetSdk 35
              versionCode 20500
              versionName '2.5'
              ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            }
            buildTypes { debug { minifyEnabled false }; release { minifyEnabled false; shrinkResources false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          chaquopy { defaultConfig { version='3.10'; buildPython 'python'; pip { install 'openpyxl==3.1.5' } } }
          dependencies { implementation 'androidx.activity:activity:1.10.1'; implementation 'androidx.appcompat:appcompat:1.7.0'; implementation 'androidx.webkit:webkit:1.13.0' }
          GRADLE
          cat > app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?><resources><style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#198754</item><item name="android:navigationBarColor">#121212</item><item name="android:statusBarColor">#121212</item></style></resources>
          XML
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="true" android:usesCleartextTraffic="true" android:label="Keuangan" android:theme="@style/AppTheme" android:icon="@drawable/ic_keuangan" android:resizeableActivity="true"><activity android:name=".UpdatableMainActivity" android:exported="true" android:screenOrientation="unspecified" android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          XML
          cat > app/src/main/java/com/catatankas/app/MainActivity.java <<'JAVA'
          package com.catatankas.app;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebView;
          public class MainActivity extends Activity { protected void onCreate(Bundle b){super.onCreate(b); WebView w=new WebView(this); w.getSettings().setJavaScriptEnabled(true); setContentView(w); w.loadUrl("https://appassets.androidplatform.net/assets/login.html");} }
          JAVA
      - name: Enable Python Excel and theme on Dashboard Excel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/dashboard-excel.html')
          if p.exists():
            s=p.read_text(encoding='utf-8')
            a='<script type="module" src="js/dashboard-excel-python.js"></script>'
            if a not in s: s=s.replace('</body>',a+'\n</body>',1)
            if '<script src="theme.js"></script>' not in s: s=s.replace('</head>','<script src="theme.js"></script></head>',1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Verify stable Python Excel build
        run: |
          set -euo pipefail
          test -s app/src/main/python/rekap_pembayaran.py
          grep -q 'com.chaquo.python' build.gradle
          grep -q 'openpyxl==3.1.5' app/build.gradle
          grep -q 'arm64-v8a' app/build.gradle
          echo 'STABLE UPDATABLE + PYTHON + OPENPYXL + ABI OK'
      - name: Build Debug APK
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Prepare APK artifact
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Keuangan-Updatable-Python-Excel-Stable.apk
          test -s output/Keuangan-Updatable-Python-Excel-Stable.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keuangan-APK-Updatable-Python-Excel-Stable
          path: output/Keuangan-Updatable-Python-Excel-Stable.apk
          if-no-files-found: error

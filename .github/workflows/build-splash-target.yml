name: Build Keuangan APK - Splash Target

# Final splash-only build:
# - Logo tunggal dari Photoroom_20260812_224807.png
# - icon-192.png dibuat otomatis
# - icon-512.png dibuat otomatis
# - icon APK dibuat otomatis
# - splash-logo.png dibuat otomatis
# - TIDAK mengubah mode gelap/terang
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'UpdatableMainActivity.java'
      - 'splash-logo.svg'
      - '.github/workflows/build-splash-target.yml'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'images/**'
      - 'img/**'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - 'python/**'

permissions:
  contents: read

jobs:
  build:
    name: Build APK - Final Splash
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ============================================================
      # PYTHON 3.10
      # ============================================================
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      # ============================================================
      # GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # ANDROID SDK + SVG CONVERTER
      # ============================================================
      - name: Install Android SDK and SVG converter
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin


      # ============================================================
      # PREPARE ANDROID PROJECT
      # ============================================================
      - name: Prepare Android project and final splash
        shell: bash
        run: |
          set -euo pipefail

          # --------------------------------------------------------
          # Bersihkan project Android sementara
          # --------------------------------------------------------
          rm -rf app build.gradle settings.gradle gradle.properties

          mkdir -p \
            app/src/main/java/com/catatankas/app \
            app/src/main/res/values \
            app/src/main/res/drawable \
            app/src/main/assets \
            app/src/main/python

          # --------------------------------------------------------
          # Salin seluruh project web ke assets
          # --------------------------------------------------------
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='app/' \
            --exclude='output/' \
            ./ app/src/main/assets/

          # --------------------------------------------------------
          # Python Chaquopy
          # --------------------------------------------------------
          cp python/rekap_pembayaran.py \
            app/src/main/python/rekap_pembayaran.py

          # --------------------------------------------------------
          # Main Activity
          # --------------------------------------------------------
          cp UpdatableMainActivity.java \
            app/src/main/java/com/catatankas/app/UpdatableMainActivity.java


          # ========================================================
          # LOGO TUNGGAL
          # ========================================================
          #
          # Semua logo berasal dari:
          #
          # Photoroom_20260812_224807.png
          #
          # Tidak perlu membuat icon-192/icon-512 secara manual.
          # GitHub Actions akan membuatnya otomatis.
          #
          # ========================================================

          test -s "Photoroom_20260812_224807.png"

          echo "Mempersiapkan logo utama..."

          # Install Pillow untuk membuat ukuran icon
          python -m pip install --quiet Pillow


          # ========================================================
          # BUAT SEMUA LOGO OTOMATIS
          # ========================================================
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("Photoroom_20260812_224807.png")

          if not source.exists():
              raise SystemExit(
                  "ERROR: Photoroom_20260812_224807.png tidak ditemukan"
              )

          if source.stat().st_size == 0:
              raise SystemExit(
                  "ERROR: Photoroom_20260812_224807.png kosong"
              )

          print("Logo sumber:", source)

          # --------------------------------------------------------
          # Buka logo
          # --------------------------------------------------------
          img = Image.open(source).convert("RGBA")

          print("Ukuran logo asli:", img.size)


          # --------------------------------------------------------
          # Buat canvas persegi transparan
          #
          # Tujuannya supaya logo tidak gepeng / berubah rasio.
          # --------------------------------------------------------
          size = max(img.width, img.height)

          canvas = Image.new(
              "RGBA",
              (size, size),
              (0, 0, 0, 0)
          )

          x = (size - img.width) // 2
          y = (size - img.height) // 2

          canvas.alpha_composite(img, (x, y))


          # ========================================================
          # ICON 192x192
          # ========================================================
          icon192 = canvas.resize(
              (192, 192),
              Image.Resampling.LANCZOS
          )

          icon192.save(
              "app/src/main/assets/icon-192.png",
              "PNG",
              optimize=True
          )

          print("OK: icon-192.png dibuat 192x192")


          # ========================================================
          # ICON 512x512
          # ========================================================
          icon512 = canvas.resize(
              (512, 512),
              Image.Resampling.LANCZOS
          )

          icon512.save(
              "app/src/main/assets/icon-512.png",
              "PNG",
              optimize=True
          )

          print("OK: icon-512.png dibuat 512x512")


          # ========================================================
          # ICON APK
          # ========================================================
          icon_apk = canvas.resize(
              (512, 512),
              Image.Resampling.LANCZOS
          )

          icon_apk.save(
              "app/src/main/res/drawable/ic_keuangan.png",
              "PNG",
              optimize=True
          )

          print("OK: ic_keuangan.png dibuat 512x512")


          # ========================================================
          # SPLASH LOGO
          #
          # Splash menggunakan logo asli agar kualitas tetap bagus.
          # ========================================================
          img.save(
              "app/src/main/assets/splash-logo.png",
              "PNG",
              optimize=True
          )

          print("OK: splash-logo.png dibuat dari logo asli")

          print("")
          print("==========================================")
          print("SEMUA LOGO BERHASIL DIBUAT")
          print("==========================================")
          print("Sumber      : Photoroom_20260812_224807.png")
          print("icon-192    : 192x192")
          print("icon-512    : 512x512")
          print("APK icon    : 512x512")
          print("Splash logo : ukuran asli")
          print("==========================================")
          PY


          # ========================================================
          # PERBAIKI PEMBACAAN LOGO SPLASH
          # ========================================================
          python - <<'PY'
          import re
          from pathlib import Path

          p = Path(
              'app/src/main/java/com/catatankas/app/UpdatableMainActivity.java'
          )

          s = p.read_text(encoding='utf-8')

          # Semua pembacaan asset gambar splash diarahkan
          # ke splash-logo.png
          s = re.sub(
              r'getAssets\(\)\.open\("[^"]+"\)',
              'getAssets().open("splash-logo.png")',
              s
          )


          # ========================================================
          # UKURAN LOGO SPLASH
          # ========================================================
          old = (
              'Math.min(dpSplash(185),'
              'Math.max(dpSplash(135),'
              'Math.round('
              'Math.min('
              'getResources().getDisplayMetrics().widthPixels,'
              'getResources().getDisplayMetrics().heightPixels'
              ')*0.34f)))'
          )

          new = (
              'Math.min(dpSplash(340),'
              'Math.max(dpSplash(240),'
              'Math.round('
              'getResources().getDisplayMetrics().widthPixels'
              '*0.40f)))'
          )

          s = s.replace(old, new)


          # ========================================================
          # POSISI JUDUL SPLASH
          # ========================================================
          s = s.replace(
              'textLp.topMargin=dpSplash(252);',
              'textLp.topMargin=dpSplash(405);'
          )


          # ========================================================
          # BACKGROUND SPLASH
          # ========================================================
          old_bg = (
              'final android.widget.FrameLayout overlay='
              'new android.widget.FrameLayout(this);'
              'overlay.setBackgroundColor(APP_BG);'
              'overlay.setSystemUiVisibility(0);'
          )

          new_bg = (
              'final android.widget.FrameLayout overlay='
              'new android.widget.FrameLayout(this);'
              'android.graphics.drawable.GradientDrawable splashBg='
              'new android.graphics.drawable.GradientDrawable('
              'android.graphics.drawable.GradientDrawable.Orientation.TL_BR,'
              'new int[]{'
              'Color.rgb(0,105,96),'
              'Color.rgb(1,135,121),'
              'Color.rgb(0,80,75)'
              '});'
              'overlay.setBackground(splashBg);'
              'overlay.setSystemUiVisibility(0);'
          )

          s = s.replace(old_bg, new_bg)


          # ========================================================
          # GELOMBANG BAWAH SPLASH
          # ========================================================
          old_wave = (
              'waveText.setText("∿∿∿∿∿∿∿∿∿∿∿∿∿∿∿∿∿");'
              'waveText.setTextColor(Color.argb(150,130,255,235));'
              'waveText.setTextSize(30);'
          )

          new_wave = (
              'waveText.setText(" ╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲ ");'
              'waveText.setTextColor(Color.argb(140,140,255,238));'
              'waveText.setTextSize(24);'
          )

          s = s.replace(old_wave, new_wave)


          p.write_text(s, encoding='utf-8')

          print("UpdatableMainActivity.java berhasil disesuaikan.")
          PY


          # ========================================================
          # SETTINGS GRADLE
          # ========================================================
          cat > settings.gradle <<'GRADLE'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }

          dependencyResolutionManagement {
            repositoriesMode.set(
              RepositoriesMode.FAIL_ON_PROJECT_REPOS
            )

            repositories {
              google()
              mavenCentral()
            }
          }

          rootProject.name='Keuangan'
          include ':app'
          GRADLE


          # ========================================================
          # ROOT BUILD.GRADLE
          # ========================================================
          cat > build.gradle <<'GRADLE'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
            id 'com.chaquo.python' version '17.0.0' apply false
          }
          GRADLE


          # ========================================================
          # GRADLE PROPERTIES
          # ========================================================
          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          PROPS


          # ========================================================
          # APP BUILD.GRADLE
          # ========================================================
          cat > app/build.gradle <<'GRADLE'
          plugins {
            id 'com.android.application'
            id 'com.chaquo.python'
          }

          android {
            namespace 'com.catatankas.app'

            compileSdk 35

            defaultConfig {
              applicationId 'com.catatankas.app'

              minSdk 24
              targetSdk 35

              versionCode 20700
              versionName '2.7'

              ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
              }
            }

            buildTypes {
              debug {
                minifyEnabled false
              }

              release {
                minifyEnabled false
                shrinkResources false
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }

          chaquopy {
            defaultConfig {
              version='3.10'

              buildPython 'python'

              pip {
                install 'openpyxl==3.1.5'
              }
            }
          }

          dependencies {
            implementation 'androidx.activity:activity:1.10.1'
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'androidx.webkit:webkit:1.13.0'
          }
          GRADLE


          # ========================================================
          # APP THEME
          #
          # TIDAK MENGUBAH MODE GELAP/TERANG WEB APP.
          # ========================================================
          cat > app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

            <style
              name="AppTheme"
              parent="Theme.AppCompat.NoActionBar">

              <item name="android:fontFamily">sans</item>

              <item name="android:colorAccent">#198754</item>

              <item name="android:windowBackground">#006960</item>

              <item name="android:windowNoTitle">true</item>

              <item name="android:statusBarColor">#006960</item>

              <item name="android:navigationBarColor">#006960</item>

              <item name="android:windowLightStatusBar">false</item>

              <item name="android:windowLightNavigationBar">false</item>

            </style>

          </resources>
          XML


          # ========================================================
          # ANDROID MANIFEST
          # ========================================================
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
            xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission
              android:name="android.permission.INTERNET" />

            <application
              android:allowBackup="true"
              android:usesCleartextTraffic="true"
              android:label="Keuangan"
              android:resizeableActivity="true"
              android:theme="@style/AppTheme"
              android:icon="@drawable/ic_keuangan">

              <activity
                android:name=".UpdatableMainActivity"
                android:exported="true"
                android:screenOrientation="unspecified"
                android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden">

                <intent-filter>

                  <action
                    android:name="android.intent.action.MAIN" />

                  <category
                    android:name="android.intent.category.LAUNCHER" />

                </intent-filter>

              </activity>

            </application>

          </manifest>
          XML


          # ========================================================
          # MAIN ACTIVITY
          # ========================================================
          cat > app/src/main/java/com/catatankas/app/MainActivity.java <<'JAVA'
          package com.catatankas.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {

            protected WebView webView;

            @Override
            protected void onCreate(Bundle b) {

              super.onCreate(b);

              webView = new WebView(this);

              webView.setLayoutParams(
                new ViewGroup.LayoutParams(-1, -1)
              );

              setContentView(webView);

              WebSettings s = webView.getSettings();

              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);

              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);

              final WebViewAssetLoader l =
                new WebViewAssetLoader.Builder()
                  .addPathHandler(
                    "/assets/",
                    new WebViewAssetLoader.AssetsPathHandler(this)
                  )
                  .build();

              webView.setWebViewClient(
                new android.webkit.WebViewClient() {

                  @Override
                  public WebResourceResponse shouldInterceptRequest(
                    WebView v,
                    WebResourceRequest r
                  ) {

                    WebResourceResponse x =
                      l.shouldInterceptRequest(r.getUrl());

                    return x != null
                      ? x
                      : super.shouldInterceptRequest(v, r);
                  }
                }
              );
            }

            @Override
            public void onBackPressed() {

              if (webView != null && webView.canGoBack()) {
                webView.goBack();
              } else {
                super.onBackPressed();
              }
            }

            @Override
            protected void onDestroy() {

              if (webView != null) {
                webView.destroy();
              }

              super.onDestroy();
            }
          }
          JAVA


      # ============================================================
      # VERIFY LOGO + SPLASH
      # ============================================================
      - name: Verify final splash and logo
        run: |
          set -euo pipefail

          echo "Memeriksa file logo..."

          test -s app/src/main/assets/splash-logo.png
          test -s app/src/main/assets/icon-192.png
          test -s app/src/main/assets/icon-512.png
          test -s app/src/main/res/drawable/ic_keuangan.png

          echo "Memeriksa koneksi splash..."

          grep -q 'splash-logo.png' \
            app/src/main/java/com/catatankas/app/UpdatableMainActivity.java

          echo "Memeriksa ukuran icon..."

          python - <<'PY'
          from PIL import Image

          checks = {
              "app/src/main/assets/icon-192.png": (192, 192),
              "app/src/main/assets/icon-512.png": (512, 512),
              "app/src/main/res/drawable/ic_keuangan.png": (512, 512),
          }

          for path, expected in checks.items():

              size = Image.open(path).size

              if size != expected:
                  raise SystemExit(
                      f"ERROR: {path} memiliki ukuran "
                      f"{size}, seharusnya {expected}"
                  )

              print(f"OK: {path} = {size}")

          print("")
          print("==========================================")
          print("FINAL LOGO + SPLASH VERIFIED")
          print("==========================================")
          print("")


      # ============================================================
      # BUILD DEBUG APK
      # ============================================================
      - name: Build Debug APK
        run: |
          gradle --no-daemon clean assembleDebug --stacktrace


      # ============================================================
      # PREPARE APK
      # ============================================================
      - name: Prepare APK artifact
        run: |
          set -euo pipefail

          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/Keuangan-Splash-Final.apk

          test -s output/Keuangan-Splash-Final.apk

          ls -lh output/Keuangan-Splash-Final.apk


      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: Keuangan-APK-Splash-Final
          path: output/Keuangan-Splash-Final.apk
          if-no-files-found: error

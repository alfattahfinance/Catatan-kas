name: Build Keuangan APK - Splash Target

# Satu-satunya sumber logo: Photoroom_20260812_224807.png
# icon-192, icon-512, splash-logo, dan ic_keuangan dibuat otomatis.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'UpdatableMainActivity.java'
      - '.github/workflows/build-splash-target.yml'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'images/**'
      - 'img/**'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - 'python/**'

permissions:
  contents: read

jobs:
  build:
    name: Build APK - Final Splash
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Python Pillow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Prepare Android project and final splash
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app build.gradle settings.gradle gradle.properties

          mkdir -p \
            app/src/main/java/com/catatankas/app \
            app/src/main/res/values \
            app/src/main/res/drawable \
            app/src/main/assets \
            app/src/main/python

          test -s "Photoroom_20260812_224807.png"
          test -s "python/rekap_pembayaran.py"
          test -s "UpdatableMainActivity.java"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='app/' \
            --exclude='output/' \
            ./ app/src/main/assets/

          cp python/rekap_pembayaran.py \
            app/src/main/python/rekap_pembayaran.py

          cp UpdatableMainActivity.java \
            app/src/main/java/com/catatankas/app/UpdatableMainActivity.java

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("Photoroom_20260812_224807.png")
          assets = Path("app/src/main/assets")
          drawable = Path("app/src/main/res/drawable")
          img = Image.open(source).convert("RGBA")

          def make_square_icon(size, output):
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              copy = img.copy()
              copy.thumbnail((size, size), Image.Resampling.LANCZOS)
              x = (size - copy.width) // 2
              y = (size - copy.height) // 2
              canvas.alpha_composite(copy, (x, y))
              canvas.save(output, "PNG", optimize=True)
              print(f"Created: {output} -> {size}x{size}")

          make_square_icon(192, assets / "icon-192.png")
          make_square_icon(512, assets / "icon-512.png")
          img.save(assets / "splash-logo.png", "PNG", optimize=True)
          make_square_icon(512, drawable / "ic_keuangan.png")
          print("Semua logo dibuat dari Photoroom_20260812_224807.png")
          PY

          python - <<'PY'
          import re
          from pathlib import Path

          p = Path("app/src/main/java/com/catatankas/app/UpdatableMainActivity.java")
          s = p.read_text(encoding="utf-8")

          # Source memakai getAssets() dan .open() pada baris berbeda.
          # Regex ini menangani spasi maupun newline agar benar-benar diganti.
          s = re.sub(
              r'getAssets\(\)\s*\.open\(\s*"[^"]+"\s*\)',
              'getAssets().open("splash-logo.png")',
              s,
          )

          old_size = (
              'Math.min(dpSplash(185),'
              'Math.max(dpSplash(135),'
              'Math.round('
              'Math.min('
              'getResources().getDisplayMetrics().widthPixels,'
              'getResources().getDisplayMetrics().heightPixels'
              ')*0.34f)))'
          )
          new_size = (
              'Math.min(dpSplash(340),'
              'Math.max(dpSplash(240),'
              'Math.round('
              'getResources().getDisplayMetrics().widthPixels'
              '*0.40f)))'
          )
          s = s.replace(old_size, new_size)

          s = s.replace(
              'textLp.topMargin=dpSplash(252);',
              'textLp.topMargin=dpSplash(405);',
          )

          old_bg = (
              'final android.widget.FrameLayout overlay='
              'new android.widget.FrameLayout(this);'
              'overlay.setBackgroundColor(APP_BG);'
              'overlay.setSystemUiVisibility(0);'
          )
          new_bg = (
              'final android.widget.FrameLayout overlay='
              'new android.widget.FrameLayout(this);'
              'android.graphics.drawable.GradientDrawable splashBg='
              'new android.graphics.drawable.GradientDrawable('
              'android.graphics.drawable.GradientDrawable.Orientation.TL_BR,'
              'new int[]{'
              'Color.rgb(0,105,96),'
              'Color.rgb(1,135,121),'
              'Color.rgb(0,80,75)'
              '});'
              'overlay.setBackground(splashBg);'
              'overlay.setSystemUiVisibility(0);'
          )
          s = s.replace(old_bg, new_bg)

          old_wave = (
              'waveText.setText("∿∿∿∿∿∿∿∿∿∿∿∿∿∿∿∿∿");'
              'waveText.setTextColor(Color.argb(150,130,255,235));'
              'waveText.setTextSize(30);'
          )
          new_wave = (
              'waveText.setText('
              '" ╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲ ");'
              'waveText.setTextColor('
              'Color.argb(140,140,255,238));'
              'waveText.setTextSize(24);'
          )
          s = s.replace(old_wave, new_wave)

          p.write_text(s, encoding="utf-8")
          print("UpdatableMainActivity.java berhasil disesuaikan.")
          PY

          cat > settings.gradle <<'GRADLE'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }

          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }

          rootProject.name = 'Keuangan'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
            id 'com.chaquo.python' version '17.0.0' apply false
          }
          GRADLE

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          PROPS

          cat > app/build.gradle <<'GRADLE'
          plugins {
            id 'com.android.application'
            id 'com.chaquo.python'
          }

          android {
            namespace 'com.catatankas.app'
            compileSdk 35

            defaultConfig {
              applicationId 'com.catatankas.app'
              minSdk 24
              targetSdk 35
              versionCode 20700
              versionName '2.7'
              ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
              }
            }

            buildTypes {
              debug { minifyEnabled false }
              release {
                minifyEnabled false
                shrinkResources false
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }

          chaquopy {
            defaultConfig {
              version = '3.10'
              buildPython 'python'
              pip {
                install 'openpyxl==3.1.5'
              }
            }
          }

          dependencies {
            implementation 'androidx.activity:activity:1.10.1'
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'androidx.webkit:webkit:1.13.0'
          }
          GRADLE

          cat > app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#198754</item>
              <item name="android:windowBackground">#006960</item>
              <item name="android:windowNoTitle">true</item>
              <item name="android:statusBarColor">#006960</item>
              <item name="android:navigationBarColor">#006960</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
            </style>
          </resources>
          XML

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:allowBackup="true"
              android:usesCleartextTraffic="true"
              android:label="Keuangan"
              android:resizeableActivity="true"
              android:theme="@style/AppTheme"
              android:icon="@drawable/ic_keuangan">
              <activity
                android:name=".UpdatableMainActivity"
                android:exported="true"
                android:screenOrientation="unspecified"
                android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          XML

          cat > app/src/main/java/com/catatankas/app/MainActivity.java <<'JAVA'
          package com.catatankas.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
            protected WebView webView;

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              webView = new WebView(this);
              webView.setLayoutParams(new ViewGroup.LayoutParams(-1, -1));
              setContentView(webView);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);

              final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                .build();

              webView.setWebViewClient(new android.webkit.WebViewClient() {
                @Override
                public WebResourceResponse shouldInterceptRequest(
                    WebView v, WebResourceRequest r) {
                  WebResourceResponse response = loader.shouldInterceptRequest(r.getUrl());
                  return response != null ? response : super.shouldInterceptRequest(v, r);
                }
              });
            }

            @Override
            public void onBackPressed() {
              if (webView != null && webView.canGoBack()) {
                webView.goBack();
              } else {
                super.onBackPressed();
              }
            }

            @Override
            protected void onDestroy() {
              if (webView != null) {
                webView.destroy();
              }
              super.onDestroy();
            }
          }
          JAVA

      - name: Verify final splash and logo
        shell: bash
        run: |
          set -euo pipefail

          test -s "Photoroom_20260812_224807.png"
          test -s "app/src/main/assets/splash-logo.png"
          test -s "app/src/main/assets/icon-192.png"
          test -s "app/src/main/assets/icon-512.png"
          test -s "app/src/main/res/drawable/ic_keuangan.png"

          grep -q 'splash-logo.png' \
            app/src/main/java/com/catatankas/app/UpdatableMainActivity.java

          grep -q '@drawable/ic_keuangan' \
            app/src/main/AndroidManifest.xml

          python - <<'PY'
          from PIL import Image

          checks = [
              ("app/src/main/assets/icon-192.png", (192, 192)),
              ("app/src/main/assets/icon-512.png", (512, 512)),
          ]

          for filename, expected in checks:
              size = Image.open(filename).size
              print(f"{filename}: {size[0]}x{size[1]}")
              assert size == expected, f"Ukuran salah: {filename} -> {size}"

          print("Semua logo dan icon terverifikasi.")
          PY

          echo "FINAL SPLASH VERIFIED"
          ls -lh \
            Photoroom_20260812_224807.png \
            app/src/main/assets/splash-logo.png \
            app/src/main/assets/icon-192.png \
            app/src/main/assets/icon-512.png \
            app/src/main/res/drawable/ic_keuangan.png

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk \
            output/Keuangan-Splash-Final.apk
          test -s output/Keuangan-Splash-Final.apk
          ls -lh output/Keuangan-Splash-Final.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keuangan-APK-Splash-Final
          path: output/Keuangan-Splash-Final.apk
          if-no-files-found: error

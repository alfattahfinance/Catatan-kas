name: Build Keuangan APK - Updatable Python Excel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'UpdatableMainActivity.java'
      - 'web-update.json'
      - 'firebase-config.js'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'images/**'
      - 'img/**'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '.github/workflows/build-updatable-python-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Keuangan APK (Updatable + Python Excel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/catatankas/app app/src/main/res/values app/src/main/res/drawable app/src/main/assets app/src/main/python

          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' \) -exec cp -f {} app/src/main/assets/ \;
          for dir in js css assets images img; do
            if [ -d "$dir" ]; then
              mkdir -p "app/src/main/assets/$dir"
              cp -a "$dir/." "app/src/main/assets/$dir/"
            fi
          done
          for img in *.png *.jpg *.jpeg; do
            [ -f "$img" ] && cp -f "$img" app/src/main/assets/ || true
          done

          test -s icon-192.png
          cp -f icon-192.png app/src/main/res/drawable/ic_keuangan.png
          cp -f UpdatableMainActivity.java app/src/main/java/com/catatankas/app/UpdatableMainActivity.java

          cat > app/src/main/python/excel_export.py <<'PY'
          import base64
          import io
          import json
          from openpyxl import Workbook
          from openpyxl.styles import Font, Alignment

          def export_xlsx_base64(payload_json, filename='Rekap-Pembayaran.xlsx'):
              rows = json.loads(payload_json or '[]')
              wb = Workbook()
              ws = wb.active
              ws.title = 'Rekap Pembayaran'
              headers = ['Nama', 'Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des', 'Jumlah Bulan', 'Sudah Bayar Sampai', 'Total Bayar']
              ws.append(headers)
              for cell in ws[1]:
                  cell.font = Font(bold=True)
                  cell.alignment = Alignment(horizontal='center')
              for row in rows:
                  ws.append([row.get('nama', ''), *row.get('bulan', []), row.get('jumlah_bulan', 0), row.get('sudah_bayar_sampai', 'Belum bayar'), row.get('total_bayar', 0)])
              for col in ws.columns:
                  max_len = max(len(str(c.value or '')) for c in col)
                  ws.column_dimensions[col[0].column_letter].width = min(max(max_len + 2, 10), 28)
              out = io.BytesIO()
              wb.save(out)
              return base64.b64encode(out.getvalue()).decode('ascii')
          PY

          cat > app/src/main/java/com/catatankas/app/MainActivity.java <<'JAVA'
          package com.catatankas.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;
          public class MainActivity extends Activity {
            protected WebView webView;
            protected static final int FILE_CHOOSER_REQUEST=1001;
            private ValueCallback<Uri[]> pendingFileCallback;
            @Override protected void onCreate(Bundle b){
              super.onCreate(b);
              webView=new WebView(this);
              webView.setLayoutParams(new ViewGroup.LayoutParams(-1,-1));
              setContentView(webView);
              WebSettings s=webView.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true); s.setAllowContentAccess(true);
              final WebViewAssetLoader l=new WebViewAssetLoader.Builder().addPathHandler("/assets/",new WebViewAssetLoader.AssetsPathHandler(this)).build();
              webView.setWebViewClient(new WebViewClient(){
                @Override public WebResourceResponse shouldInterceptRequest(WebView v,WebResourceRequest r){WebResourceResponse x=l.shouldInterceptRequest(r.getUrl());return x!=null?x:super.shouldInterceptRequest(v,r);}
              });
              webView.setWebChromeClient(new WebChromeClient(){
                @Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> c,FileChooserParams p){
                  pendingFileCallback=c; Intent i=p.createIntent(); i.setType("image/*"); i.addCategory(Intent.CATEGORY_OPENABLE);
                  try{startActivityForResult(i,FILE_CHOOSER_REQUEST);return true;}catch(Exception e){pendingFileCallback=null;c.onReceiveValue(null);return false;}
                }
              });
              webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
            }
            @Override protected void onActivityResult(int r,int c,Intent d){super.onActivityResult(r,c,d);if(r==FILE_CHOOSER_REQUEST&&pendingFileCallback!=null){Uri[] x=null;if(c==RESULT_OK&&d!=null&&d.getData()!=null)x=new Uri[]{d.getData()};pendingFileCallback.onReceiveValue(x);pendingFileCallback=null;}}
            @Override public void onBackPressed(){if(webView!=null&&webView.canGoBack())webView.goBack();else super.onBackPressed();}
            @Override protected void onDestroy(){if(webView!=null)webView.destroy();super.onDestroy();}
          }
          JAVA

          cat > settings.gradle <<'GRADLE'
          import org.gradle.api.initialization.resolve.RepositoriesMode
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='Keuangan'; include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
            id 'com.chaquo.python' version '15.0.1' apply false
          }
          GRADLE

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=false
          PROPS

          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application'; id 'com.chaquo.python' }
          android {
            namespace 'com.catatankas.app'
            compileSdk 35
            defaultConfig {
              applicationId 'com.catatankas.app'
              minSdk 24
              targetSdk 35
              versionCode 20600
              versionName '2.6'
              ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            }
            buildTypes { debug { minifyEnabled false }; release { minifyEnabled false; shrinkResources false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          python { version '3.10'; pip { install 'openpyxl==3.1.5' } }
          dependencies { implementation 'androidx.webkit:webkit:1.13.0' }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:allowBackup="true" android:label="Keuangan" android:icon="@drawable/ic_keuangan" android:roundIcon="@drawable/ic_keuangan" android:theme="@style/AppTheme" android:resizeableActivity="true">
              <activity android:name=".UpdatableMainActivity" android:exported="true" android:screenOrientation="unspecified" android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          XML

          cat > app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?><resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#198754</item><item name="android:navigationBarColor">#000000</item><item name="android:statusBarColor">#000000</item></style></resources>
          XML

      - name: Add Python bridge to updater activity
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/com/catatankas/app/UpdatableMainActivity.java')
          s=p.read_text()
          s=s.replace('import android.webkit.WebView;','import android.webkit.WebView;\nimport android.webkit.JavascriptInterface;\nimport com.chaquo.python.AndroidPlatform;\nimport com.chaquo.python.PyObject;\nimport com.chaquo.python.Python;')
          s=s.replace('super.onCreate(savedInstanceState);','super.onCreate(savedInstanceState);\n        if (!Python.isStarted()) Python.start(new AndroidPlatform(this));\n        if (webView != null) webView.addJavascriptInterface(new AndroidPython(), "AndroidPython");',1)
          marker='    public class AndroidWebUpdater {'
          bridge='''    public class AndroidPython {\n        @JavascriptInterface public void exportExcel(final String payload, final String filename) {\n            new Thread(() -> {\n                try {\n                    PyObject mod = Python.getInstance().getModule("excel_export");\n                    String b64 = mod.callAttr("export_xlsx_base64", payload, filename).toString();\n                    send("window.dispatchEvent(new CustomEvent('pythonExcelReady',{detail:{base64:'"+esc(b64)+"',filename:'"+esc(filename)+"'}}))");\n                } catch (Exception e) {\n                    send("window.dispatchEvent(new CustomEvent('pythonExcelError',{detail:{message:'"+esc(e.getMessage())+"'}}))");\n                }\n            }).start();\n        }\n    }\n\n'''
          s=s.replace(marker,bridge+marker,1)
          old='webView.setWebViewClient(new androidx.webkit.WebViewClientCompat() {\n            @Override public WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest request) { return loader.shouldInterceptRequest(request.getUrl()); }'
          new='webView.setWebViewClient(new androidx.webkit.WebViewClientCompat() {\n            @Override public WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest request) { return loader.shouldInterceptRequest(request.getUrl()); }\n            @Override public void onPageFinished(WebView view, String url) { super.onPageFinished(view, url); installPythonExcelHook(); }'
          s=s.replace(old,new,1)
          insert='''\n    private void installPythonExcelHook() {\n        if (webView == null) return;\n        String js = "javascript:(function(){try{if(window.__pythonExcelHook)return;window.__pythonExcelHook=true;var b=document.getElementById('browserExportExcel');if(!b)return;var c=b.cloneNode(true);b.parentNode.replaceChild(c,b);c.addEventListener('click',function(){var rows=[];document.querySelectorAll('#body tr').forEach(function(tr){var td=tr.querySelectorAll('td');if(td.length<16)return;var bulan=[];for(var i=1;i<=12;i++)bulan.push(td[i].textContent.trim());rows.push({nama:td[0].textContent.trim(),bulan:bulan,jumlah_bulan:td[13].textContent.trim(),sudah_bayar_sampai:td[14].textContent.trim(),total_bayar:td[15].textContent.replace(/[^0-9-]/g,'')});});var y=(document.getElementById('tahun')||{}).value||new Date().getFullYear();if(!rows.length){alert('Tidak ada data untuk diekspor.');return}if(window.AndroidPython&&AndroidPython.exportExcel){AndroidPython.exportExcel(JSON.stringify(rows),'Rekap-Pembayaran-'+y+'.xlsx');}});window.addEventListener('pythonExcelReady',function(e){var d=e.detail,b=atob(d.base64),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);var blob=new Blob([a],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=d.filename;a.click();setTimeout(function(){URL.revokeObjectURL(u)},2000);});window.addEventListener('pythonExcelError',function(e){alert('Export Excel gagal: '+(e.detail&&e.detail.message||'Kesalahan Python'));});}catch(e){console.error('Python Excel hook',e)}})();";\n        webView.evaluateJavascript(js, null);\n    }\n'''
          s=s.replace('    public class AndroidWebUpdater {',insert+'\n    public class AndroidWebUpdater {',1)
          p.write_text(s)

      - name: Verify Python + updater bridge
        run: |
          set -euo pipefail
          grep -q "com.chaquo.python" build.gradle app/build.gradle
          grep -q "ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }" app/build.gradle
          grep -q "openpyxl==3.1.5" app/build.gradle
          grep -q "AndroidPython" app/src/main/java/com/catatankas/app/UpdatableMainActivity.java
          test -s app/src/main/python/excel_export.py
          echo 'PYTHON + OPENPYXL + UPDATER BRIDGE VERIFICATION OK'

      - name: Build Debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Keuangan-v2.6-updatable-python.apk
          ls -lh output/Keuangan-v2.6-updatable-python.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keuangan-APK-Updatable-Python-Excel-v2.6
          path: output/Keuangan-v2.6-updatable-python.apk
          if-no-files-found: error

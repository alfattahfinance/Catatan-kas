<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#dc3545"
    >

    <meta
        name="description"
        content="Catatan Kas - Pengeluaran"
    >

    <title>Pengeluaran | Catatan Kas</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <!-- =====================================================
         CUSTOM CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/theme.css"
    >


    <!-- =====================================================
         STYLE HALAMAN
    ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            padding-bottom: 90px;

        }


        /* =================================================
           NAVBAR
        ================================================= */

        .pengeluaran-navbar {

            background:
                linear-gradient(
                    135deg,
                    #dc3545,
                    #b02a37
                ) !important;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, .12);

        }


        .pengeluaran-navbar .navbar-brand {

            font-weight: 700;

            font-size: 1.05rem;

        }


        /* =================================================
           CONTAINER
        ================================================= */

        .page-container {

            width: 100%;

            max-width: 600px;

            margin:
                0 auto;

        }


        /* =================================================
           CARD
        ================================================= */

        .pengeluaran-card {

            border: none;

            border-radius: 18px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, .07);

        }


        /* =================================================
           TOMBOL KEMBALI
        ================================================= */

        .ck-back {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            text-decoration: none;

            color: #6c757d;

            font-size: .9rem;

            margin-bottom: 18px;

        }


        .ck-back:hover {

            color: #dc3545;

        }


        /* =================================================
           FORM
        ================================================= */

        .form-label {

            font-weight: 600;

        }


        .form-select,
        .form-control {

            min-height: 46px;

            border-radius: 12px;

        }


        .form-control:focus,
        .form-select:focus {

            border-color: #dc3545;

            box-shadow:
                0 0 0 .2rem
                rgba(220, 53, 69, .12);

        }


        /* =================================================
           TOMBOL SIMPAN
        ================================================= */

        .btn-simpan {

            min-height: 48px;

            border-radius: 12px;

            font-weight: 700;

        }


        /* =================================================
           RIWAYAT
        ================================================= */

        .riwayat-title {

            font-weight: 700;

        }


        #daftarPengeluaran {

            border-radius: 12px;

            overflow: hidden;

        }


        #daftarPengeluaran
        .list-group-item {

            padding:
                15px 12px;

        }


        /* =================================================
           DARK MODE
        ================================================= */

        body.dark-mode {

            background: #121212 !important;

            color: #f1f1f1;

        }


        body.dark-mode
        .pengeluaran-card {

            background:
                #1e1e1e !important;

            color: #f1f1f1;

        }


        body.dark-mode
        .form-control,
        body.dark-mode
        .form-select {

            background:
                #242424 !important;

            color:
                #fff !important;

            border-color:
                #555 !important;

        }


        body.dark-mode
        .form-control::placeholder {

            color:
                #aaa;

        }


        body.dark-mode
        .text-muted {

            color:
                #adb5bd !important;

        }


        body.dark-mode
        #daftarPengeluaran
        .list-group-item {

            background:
                #1e1e1e;

            color:
                #f1f1f1;

            border-color:
                #444;

        }


        body.dark-mode
        .ck-back {

            color:
                #adb5bd;

        }


        body.dark-mode
        .ck-back:hover {

            color:
                #ff6b7a;

        }


        /* =================================================
           BOTTOM NAVIGATION
        ================================================= */

        .ck-bottom {

            position: fixed;

            left: 0;

            right: 0;

            bottom: 0;

            z-index: 1050;

            background:
                rgba(255, 255, 255, .97);

            border-top:
                1px solid #dee2e6;

            box-shadow:
                0 -3px 15px
                rgba(0, 0, 0, .08);

            padding:
                6px 8px;

        }


        .ck-bottom-inner {

            width: 100%;

            max-width: 600px;

            margin:
                0 auto;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 4px;

        }


        .ck-bottom a {

            text-decoration: none;

            color: #6c757d;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 3px;

            font-size: .68rem;

            padding:
                5px 2px;

            border-radius: 10px;

            transition:
                .2s ease;

        }


        .ck-bottom a i {

            font-size: 1.15rem;

        }


        .ck-bottom a:hover {

            color: #dc3545;

            background:
                rgba(220, 53, 69, .08);

        }


        .ck-bottom a.active {

            color: #dc3545;

            font-weight: 700;

        }


        body.dark-mode
        .ck-bottom {

            background:
                rgba(25, 25, 25, .98);

            border-top-color:
                #444;

        }


        body.dark-mode
        .ck-bottom a {

            color:
                #adb5bd;

        }


        body.dark-mode
        .ck-bottom a:hover,
        body.dark-mode
        .ck-bottom a.active {

            color:
                #ff6b7a;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 380px) {

            .page-container {

                padding-left:
                    10px !important;

                padding-right:
                    10px !important;

            }


            .ck-bottom a {

                font-size: .62rem;

            }


            .ck-bottom a i {

                font-size: 1.05rem;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
====================================================== -->

<nav
    class="navbar navbar-dark pengeluaran-navbar"
>

    <div class="container">

        <span class="navbar-brand">

            <i
                class="bi bi-wallet2 me-2"
            ></i>

            Pengeluaran

        </span>

    </div>

</nav>



<!-- =====================================================
     CONTAINER UTAMA
====================================================== -->

<div
    class="container page-container py-4"
>


    <!-- =================================================
         FORM INPUT
    ================================================== -->

    <div
        class="card pengeluaran-card shadow p-4"
    >


        <!-- KEMBALI -->

        <a
            href="index.html"
            class="ck-back"
        >

            <i
                class="bi bi-arrow-left"
            ></i>

            Kembali ke Dashboard

        </a>



        <!-- JUDUL -->

        <h4
            class="mb-4 fw-bold"
        >

            Input Pengeluaran

        </h4>



        <!-- =================================================
             JENIS PENGELUARAN
        ================================================== -->

        <label
            class="form-label"
            for="jenis"
        >

            Jenis Pengeluaran

        </label>


        <select
            id="jenis"
            class="form-select mb-3"
        >

            <option value="">
                Pilih Jenis
            </option>

            <option value="SPP">
                SPP
            </option>

            <option value="Syahriyyah">
                Syahriyyah
            </option>

            <option value="Infaq">
                Infaq
            </option>

            <option value="Kas">
                Kas
            </option>

            <option value="Beras">
                Beras
            </option>

            <option value="Lainnya">
                Lainnya
            </option>

        </select>



        <!-- =================================================
             KETERANGAN
        ================================================== -->

        <label
            class="form-label"
            for="keterangan"
        >

            Keterangan

        </label>


        <input
            id="keterangan"
            type="text"
            class="form-control mb-3"
            placeholder="Contoh: Belanja dapur"
            autocomplete="off"
        >



        <!-- =================================================
             TANGGAL
        ================================================== -->

        <label
            class="form-label"
            for="tanggal"
        >

            Tanggal

        </label>


        <input
            type="date"
            id="tanggal"
            class="form-control mb-3"
        >



        <!-- =================================================
             JUMLAH
        ================================================== -->

        <label
            id="labelJumlah"
            class="form-label"
            for="jumlah"
        >

            Nominal (Rp)

        </label>


        <input
            type="number"
            id="jumlah"
            class="form-control mb-3"
            placeholder="Masukkan nominal"
            min="0"
            step="any"
        >



        <!-- =================================================
             SATUAN
        ================================================== -->

        <label
            class="form-label"
            for="satuan"
        >

            Satuan

        </label>


        <select
            id="satuan"
            class="form-select mb-4"
            disabled
        >

            <option value="Rupiah">
                Rupiah
            </option>

            <option value="Liter">
                Liter
            </option>

        </select>



        <!-- =================================================
             SIMPAN
        ================================================== -->

        <button
            type="button"
            id="btnSimpanPengeluaran"
            onclick="simpanPengeluaran()"
            class="btn btn-danger btn-simpan w-100"
        >

            <i
                class="bi bi-save me-1"
            ></i>

            Simpan Pengeluaran

        </button>


    </div>



    <!-- =================================================
         RIWAYAT
    ================================================== -->

    <div
        class="card pengeluaran-card shadow p-4 mt-4"
    >


        <h5
            class="riwayat-title mb-3"
        >

            <i
                class="bi bi-clock-history me-1"
            ></i>

            Riwayat Pengeluaran

        </h5>


        <ul
            id="daftarPengeluaran"
            class="list-group"
        >

            <li
                class="list-group-item text-center text-muted"
            >

                Memuat riwayat...

            </li>

        </ul>


    </div>



    <!-- =================================================
         TOMBOL DASHBOARD
    ================================================== -->

    <a
        href="index.html"
        class="btn btn-secondary w-100 mt-3"
    >

        <i
            class="bi bi-house me-1"
        ></i>

        Kembali ke Dashboard

    </a>


</div>



<!-- =====================================================
     FUNGSI UBAH SATUAN
====================================================== -->

<script>

function ubahSatuan() {

    const jenis =
        document.getElementById("jenis");

    const satuan =
        document.getElementById("satuan");

    const label =
        document.getElementById("labelJumlah");

    const jumlah =
        document.getElementById("jumlah");


    if (
        !jenis ||
        !satuan ||
        !label ||
        !jumlah
    ) {

        return;

    }


    if (jenis.value === "Beras") {

        satuan.value =
            "Liter";

        label.textContent =
            "Jumlah (Liter)";

        jumlah.placeholder =
            "Masukkan jumlah liter";


    } else {

        satuan.value =
            "Rupiah";

        label.textContent =
            "Nominal (Rp)";

        jumlah.placeholder =
            "Masukkan nominal";

    }

}

</script>



<!-- =====================================================
     EVENT JENIS
====================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const jenis =
            document.getElementById("jenis");


        if (!jenis) return;


        jenis.addEventListener(
            "change",
            ubahSatuan
        );


        ubahSatuan();

    }
);

</script>



<!-- =====================================================
     PENGELUARAN JAVASCRIPT
====================================================== -->

<script
    type="module"

></script>

<script

<div class="ck-bottom">

    <div class="ck-bottom-inner">


        <a

        >

            <i

            <span>
                Beranda

        </a>


        <a

        </a>


        <a

            <span>

        </a>


        <a

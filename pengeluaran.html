<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pengeluaran | Catatan Kas</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-danger">
    <div class="container">
        <span class="navbar-brand">
            📉 Pengeluaran Pondok
        </span>
    </div>
</nav>

<div class="container py-4">

    <div class="card shadow p-4">

        <a href="index.html" class="ck-back"><i class="bi bi-arrow-left"></i> Kembali ke Dashboard</a>
<h4 class="mb-3">
            Input Pengeluaran
        </h4>

        <label class="form-label">
            Jenis Pengeluaran
        </label>

        <select
            id="jenis"
            class="form-select mb-3"
            onchange="ubahSatuan()">

            <option value="">Pilih Jenis</option>
<option value="SPP">SPP</option>
<option value="Syahriyyah">Syahriyyah</option>
<option value="Infaq">Infaq</option>
<option value="Kas">Kas</option>
<option value="Beras">Beras</option>
<option value="Lainnya">Lainnya</option>
            
        </select>


        <label class="form-label">
            Keterangan
        </label>

        <input
            id="keterangan"
            class="form-control mb-3"
            placeholder="Contoh: Belanja dapur">

        <label class="form-label">
    Tanggal
</label>

<input
    type="date"
    id="tanggal"
    class="form-control mb-3">
        <label
            id="labelJumlah"
            class="form-label">

            Nominal (Rp)

        </label>

        <input
            type="number"
            id="jumlah"
            class="form-control mb-3"
            placeholder="Masukkan jumlah">


        <label class="form-label">
            Satuan
        </label>

        <select
            id="satuan"
            class="form-select mb-4"
            disabled>

            <option value="Rupiah">
                Rupiah
            </option>

            <option value="Liter">
                Liter
            </option>

        </select>


        <button
            onclick="simpanPengeluaran()"
            class="btn btn-danger w-100">

            Simpan Pengeluaran

        </button>

    </div>


    <div class="card shadow p-4 mt-4">

        <h5 class="mb-3">
            📜 Riwayat Pengeluaran
        </h5>

        <ul
            id="daftarPengeluaran"
            class="list-group">

            <li class="list-group-item text-center text-muted">
                Belum ada pengeluaran.
            </li>

        </ul>

    </div>


    <a
        href="index.html"
        class="btn btn-secondary w-100 mt-3">

        ← Kembali ke Dashboard

    </a>

</div>


<script>

function ubahSatuan() {

    const jenis =
        document.getElementById("jenis").value;

    const satuan =
        document.getElementById("satuan");

    const label =
        document.getElementById("labelJumlah");

    const jumlah =
        document.getElementById("jumlah");


    if (jenis === "Beras") {

        satuan.value = "Liter";

        label.textContent = "Jumlah (Liter)";

        jumlah.placeholder =
            "Masukkan jumlah liter";

    } else {

        satuan.value = "Rupiah";

        label.textContent = "Nominal (Rp)";

        jumlah.placeholder =
            "Masukkan nominal";

    }

}

</script>


<script type="module" src="./js/Pengeluaran.js"></script>

<script src="js/theme.js"></script>

<script type="module" src="js/auth-guard.js"></script>
    
<div class="ck-bottom">
  <div class="ck-bottom-inner">
    <a href="index.html"><i class="bi bi-house-fill"></i>Beranda</a>
    <a href="santri.html"><i class="bi bi-people-fill"></i>Santri</a>
    <a href="pembayaran.html"><i class="bi bi-cash-stack"></i>Bayar</a>
    <a href="pengeluaran.html"><i class="bi bi-wallet2"></i>Keluar</a>
    <a href="laporan.html"><i class="bi bi-bar-chart-fill"></i>Laporan</a>
  </div>
</div>
</div>
</body>
</html>

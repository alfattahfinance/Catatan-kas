         TEMA AWAL
         Harus dijalankan sedini mungkin agar tidak berkedip
    ====================================================== -->
    <script>
        (function () {
            try {

                const data =
                    JSON.parse(
                        localStorage.getItem("pengaturanAplikasi")
                    ) || {};

                const tema =
                    data.tema || "light";

                let dark = false;

                if (tema === "dark") {

                    dark = true;

                } else if (tema === "system") {

                    dark =
                        window.matchMedia(
                            "(prefers-color-scheme: dark)"
                        ).matches;

                }

                document.documentElement.setAttribute(
                    "data-theme",
                    dark ? "dark" : "light"
                );

                if (dark) {

                    document.documentElement.classList.add(
                        "dark-mode"
                    );

                } else {

                    document.documentElement.classList.remove(
                        "dark-mode"
                    );

                }

            } catch (error) {

                console.warn(
                    "Gagal memuat tema:",
                    error
                );

            }
        })();
    </script>

<!-- =====================================================
     FUNGSI UBAH SATUAN
====================================================== -->

<script>

function ubahSatuan() {

    const jenis =
        document.getElementById(
            "jenisPengeluaran"
        );

    const satuan =
        document.getElementById(
            "satuan"
        );

    const label =
        document.getElementById(
            "labelJumlah"
        );

    const jumlah =
        document.getElementById(
            "nominal"
        );


    if (
        !jenis ||
        !satuan ||
        !label ||
        !jumlah
    ) {

        return;

    }


    if (
        jenis.value === "Beras"
    ) {

        satuan.value =
            "Liter";

        label.textContent =
            "Jumlah (Liter)";

        jumlah.placeholder =
            "Masukkan jumlah liter";

        jumlah.step =
            "0.1";

    }

    else {

        satuan.value =
            "Rupiah";

        label.textContent =
            "Nominal (Rp)";

        jumlah.placeholder =
            "Masukkan nominal";

        jumlah.step =
            "any";

    }

}


/* =====================================================
   NAMA PONDOK & LOGO
====================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =========================================
           NAMA PONDOK
        ========================================= */

        const headerEl =
            document.getElementById(
                "namaPondokHeader"
            );


        try {

            const pengaturan =
                JSON.parse(
                    localStorage.getItem(
                        "pengaturanAplikasi"
                    )
                ) || {};


            if (
                headerEl &&
                pengaturan.namaPondok
            ) {

                headerEl.textContent =
                    pengaturan.namaPondok;

            }

        } catch (error) {

            console.warn(
                "Pengaturan aplikasi tidak valid.",
                error
            );

        }


        /* =========================================
           LOGO DASHBOARD
        ========================================= */

        const logoDefault =
            "assets/logo-catatan-kas.jpg";


        let savedLogo =
            null;


        try {

            savedLogo =
                localStorage.getItem(
                    "logoDashboard"
                );

        } catch (error) {

            console.warn(
                "Logo tidak dapat dibaca.",
                error
            );

        }


        const logoImgs =
            document.querySelectorAll(
                ".ck-logo, #logoPreviewV2"
            );


        if (
            savedLogo
        ) {

            logoImgs.forEach(
                function (img) {

                    img.src =
                        savedLogo;

                }
            );

        }


        logoImgs.forEach(
            function (img) {

                img.onerror =
                    function () {

                        try {

                            localStorage.removeItem(
                                "logoDashboard"
                            );

                        } catch (error) {}

                        img.src =
                            logoDefault;

                    };

            }
        );


        /* =========================================
           EVENT JENIS PENGELUARAN
        ========================================= */

        const jenis =
            document.getElementById(
                "jenisPengeluaran"
            );


        if (jenis) {

            jenis.addEventListener(
                "change",
                ubahSatuan
            );

            ubahSatuan();

        }

    }

);

</script>

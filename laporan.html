/* =====================================================
   DASAR
===================================================== */

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    background: #f8f9fa;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:

        sans-serif;

    padding-bottom: 100px;

    background:
        linear-gradient(
            135deg,
            #d8e2dc,
            #fefae0
        );

    background-size: 200% 200%;

    animation:
        gradientShift 15s ease infinite;

    color:
        #212529;

    transition:
        background .25s ease,
        color .25s ease;

}


@keyframes gradientShift {

    0% {
        background-position: 0 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0 50%;
    }

}

   CONTAINER
===================================================== */

.mobile-container {

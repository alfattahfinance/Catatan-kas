<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Excel | Keuangan</title>
</head>
<body>
<div style="padding:20px;font-family:Arial">Memuat Dashboard Excel...</div>
<script>
fetch('dashboard-excel-fixed.html?v=20260826',{cache:'no-store'})
.then(r=>{if(!r.ok)throw new Error('Dashboard Excel tidak dapat dimuat');return r.text()})
.then(html=>{
  /* Hapus seluruh engine lama dari dashboard-fixed. */
  html=html.replace(/<script\s+type=["']module["'][^>]*>[\s\S]*?<\/script>/gi,'');
  /* Jangan tampilkan hasil engine lama. Engine baru yang menentukan isi tabel. */
  html=html.replace(/<\/head>/i,'<style>#body{visibility:hidden}</style></head>');
  const guard='<script>(function(){function watch(){const b=document.getElementById("body");if(!b)return;const show=()=>{b.style.visibility="visible"};new MutationObserver(show).observe(b,{childList:true,subtree:true,characterData:true});if(b.children.length)show()}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",watch);else watch()})();<\/script>';
  const add=guard+'<script type="module" src="dashboard-excel-period.js?v=20260826"><\/script>';
  html=html.replace(/<\/body>/i,add+'</body>');
  document.open();
  document.write(html);
  document.close();
})
.catch(e=>{
  document.body.innerHTML='<div style="padding:20px;font-family:Arial;color:#b02a37"><b>Dashboard Excel gagal dimuat.</b><br>'+e.message+'</div>';
});
</script>
</body>
</html>

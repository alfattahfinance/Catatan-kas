<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Excel | Keuangan</title></head><body><div style="padding:20px;font-family:Arial">Memuat Dashboard Excel...</div><script>fetch('dashboard-excel-fixed.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Dashboard Excel tidak dapat dimuat');return r.text()}).then(html=>{const add='<script type="module" src="dashboard-excel-period.js"><\/script>';html=html.replace(/<\/body>/i,add+'</body>');document.open();document.write(html);document.close()}).catch(e=>{document.body.innerHTML='<div style="padding:20px;font-family:Arial;color:#b02a37"><b>Dashboard Excel gagal dimuat.</b><br>'+e.message+'</div>'})</script></body></html>

    <!-- =====================================================
         TEMA SEBELUM HALAMAN DITAMPILKAN
         Mencegah layar berkedip putih saat dark mode
    ====================================================== -->
    <script>
        (function () {
            try {
                const data =
                    JSON.parse(
                        localStorage.getItem("pengaturanAplikasi")
                    ) || {};

                const tema =
                    data.tema || "light";

                let dark = false;

                if (tema === "dark") {
                    dark = true;
                } else if (tema === "system") {
                    dark =
                        window.matchMedia(
                            "(prefers-color-scheme: dark)"
                        ).matches;
                }

                if (dark) {
                    document.documentElement.classList.add(
                        "dark-mode"
                    );

                    document.documentElement.setAttribute(
                        "data-theme",
                        "dark"
                    );
                } else {
                    document.documentElement.setAttribute(
                        "data-theme",
                        "light"
                    );
                }

            } catch (error) {
                console.warn(
                    "Gagal memuat tema:",
                    error
                );
            }
        })();
    </script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =================================================
           NAMA PONDOK
        ================================================== */

        const namaHeader =
            document.getElementById(
                "namaPondokHeader"
            );


        try {

            const pengaturan =
                JSON.parse(
                    localStorage.getItem(
                        "pengaturanAplikasi"
                    )
                ) || {};


            if (
                namaHeader &&
                pengaturan.namaPondok
            ) {

                namaHeader.textContent =
                    pengaturan.namaPondok;

            }

        } catch (error) {

            console.warn(
                "Data pengaturan tidak valid:",
                error
            );

        }


        /* =================================================
           LOGO DASHBOARD
        ================================================== */

        const logo =
            document.getElementById(
                "logoPreviewV2"
            );


        const logoDefault =
            "assets/logo-catatan-kas.jpg";


        if (logo) {

            const savedLogo =
                localStorage.getItem(
                    "logoDashboard"
                );


            if (savedLogo) {

                logo.src =
                    savedLogo;

            }


            logo.onerror =
                function () {

                    localStorage.removeItem(
                        "logoDashboard"
                    );

                    logo.src =
                        logoDefault;

                };

        }


        /* =================================================
           TAMPILKAN DATA SANTRI
        ================================================== */

        tampilkanSantri();


        /* =================================================
           TOMBOL TAMBAH
        ================================================== */

        const tombol =
            document.getElementById(
                "btnSimpanSantri"
            );


        if (tombol) {

            tombol.addEventListener(
                "click",
                simpanSantri
            );

        }

    }
);


/* =====================================================
   AMBIL DATA SANTRI
====================================================== */

function ambilSantri() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    "daftarSantri"
                )
            );


        if (
            Array.isArray(data)
        ) {

            return data;

        }

    } catch (error) {

        console.warn(
            "Gagal membaca data santri:",
            error
        );

    }


    return [];

}


/* =====================================================
   SIMPAN DATA SANTRI
====================================================== */

function simpanSantri() {

    const nama =
        document
            .getElementById(
                "namaSantri"
            )
            .value
            .trim();


    const kelas =
        document
            .getElementById(
                "kelasSantri"
            )
            .value
            .trim();


    const hp =
        document
            .getElementById(
                "hpSantri"
            )
            .value
            .trim();


    if (!nama) {

        alert(
            "Nama santri belum diisi."
        );

        document
            .getElementById(
                "namaSantri"
            )
            .focus();

        return;

    }


    if (!kelas) {

        alert(
            "Kelas santri belum diisi."
        );

        document
            .getElementById(
                "kelasSantri"
            )
            .focus();

        return;

    }


    const daftar =
        ambilSantri();


    const sudahAda =
        daftar.some(
            function (item) {

                return (
                    String(
                        item.nama || ""
                    )
                    .trim()
                    .toLowerCase()
                    ===
                    nama.toLowerCase()
                );

            }
        );


    if (sudahAda) {

        alert(
            "Santri dengan nama tersebut sudah terdaftar."
        );

        return;

    }


    const santriBaru = {

        id:
            Date.now(),

        nama:
            nama,

        kelas:
            kelas,

        hp:
            hp

    };


    daftar.push(
        santriBaru
    );


    localStorage.setItem(
        "daftarSantri",
        JSON.stringify(
            daftar
        )
    );


    document
        .getElementById(
            "namaSantri"
        )
        .value = "";


    document
        .getElementById(
            "kelasSantri"
        )
        .value = "";


    document
        .getElementById(
            "hpSantri"
        )
        .value = "";


    tampilkanSantri();


    alert(
        "✅ Data santri berhasil ditambahkan."
    );

}


/* =====================================================
   TAMPILKAN DATA SANTRI
====================================================== */

function tampilkanSantri() {

    const tbody =
        document.getElementById(
            "tbodySantri"
        );


    const jumlah =
        document.getElementById(
            "jumlahSantri"
        );


    if (!tbody) {

        return;

    }


    const daftar =
        ambilSantri();


    if (jumlah) {

        jumlah.textContent =
            daftar.length +
            " santri";

    }


    if (
        daftar.length === 0
    ) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="text-center text-muted empty-santri"
                >

                    <i
                        class="bi bi-people d-block mb-2"
                    ></i>

                    <strong>
                        Belum ada data santri
                    </strong>

                    <br>

                    <small>
                        Silakan tambahkan santri baru.
                    </small>

                </td>

            </tr>

        `;

        return;

    }


    tbody.innerHTML = "";


    daftar.forEach(
        function (item,index) {

            const nama =
                escapeHtml(
                    item.nama || "-"
                );


            const kelas =
                escapeHtml(
                    item.kelas || "-"
                );


            const hp =
                escapeHtml(
                    item.hp || ""
                );


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>

                    <div class="nama-santri">
                        ${nama}
                    </div>

                    ${
                        hp
                        ?
                        `
                        <small class="text-muted">

                            <i class="bi bi-telephone"></i>

                            ${hp}

                        </small>
                        `
                        :
                        ""
                    }

                </td>

                <td>

                    <span class="kelas-santri">
                        ${kelas}
                    </span>

                </td>

                <td class="text-center">

                    <button
                        type="button"
                        class="btn btn-outline-primary btn-action me-1"
                        title="Edit"
                        onclick="editSantri(${index})"
                    >

                        <i class="bi bi-pencil"></i>

                    </button>


                    <button
                        type="button"
                        class="btn btn-outline-danger btn-action"
                        title="Hapus"
                        onclick="hapusSantri(${index})"
                    >

                        <i class="bi bi-trash"></i>

                    </button>

                </td>

            `;


            tbody.appendChild(
                tr
            );

        }
    );

}


/* =====================================================
   EDIT SANTRI
====================================================== */

function editSantri(index) {

    const daftar =
        ambilSantri();


    if (
        !daftar[index]
    ) {

        return;

    }


    const data =
        daftar[index];


    const namaBaru =
        prompt(
            "Nama Santri:",
            data.nama || ""
        );


    if (
        namaBaru === null
    ) {

        return;

    }


    const nama =
        namaBaru.trim();


    if (!nama) {

        alert(
            "Nama santri tidak boleh kosong."
        );

        return;

    }


    const kelasBaru =
        prompt(
            "Kelas:",
            data.kelas || ""
        );


    if (
        kelasBaru === null
    ) {

        return;

    }


    const kelas =
        kelasBaru.trim();


    if (!kelas) {

        alert(
            "Kelas tidak boleh kosong."
        );

        return;

    }


    const hpBaru =
        prompt(
            "No. HP Wali:",
            data.hp || ""
        );


    if (
        hpBaru === null
    ) {

        return;

    }


    data.nama =
        nama;


    data.kelas =
        kelas;


    data.hp =
        hpBaru.trim();


    daftar[index] =
        data;


    localStorage.setItem(
        "daftarSantri",
        JSON.stringify(
            daftar
        )
    );


    tampilkanSantri();


    alert(
        "✅ Data santri berhasil diperbarui."
    );

}


/* =====================================================
   HAPUS SANTRI
====================================================== */

function hapusSantri(index) {

    const daftar =
        ambilSantri();


    if (
        !daftar[index]
    ) {

        return;

    }


    const nama =
        daftar[index].nama ||
        "santri ini";


    const yakin =
        confirm(
            'Hapus data "' +
            nama +
            '"?'
        );


    if (!yakin) {

        return;

    }


    daftar.splice(
        index,
        1
    );


    localStorage.setItem(
        "daftarSantri",
        JSON.stringify(
            daftar
        )
    );


    tampilkanSantri();


    alert(
        "🗑️ Data santri berhasil dihapus."
    );

}


/* =====================================================
   KEAMANAN TAMPILAN TEKS
====================================================== */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
